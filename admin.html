<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딩글이 카드 도감 · 등대팀 관리자</title>
<style>
  :root{
    --deep:#060D1C; --sea:#101E3A; --sea2:#17274A; --line:rgba(255,255,255,.08);
    --beam:#FFC94A; --beam2:#FFE6A8; --foam:#EEF3FB; --mist:#93A6C6; --dim:#7387AD;
    --cC:#8397B2; --cB:#3FC4B2; --cA:#A87BF0; --cS:#FFC94A;
    --ok:#4ED8A0; --bad:#FF9A8B; --info:#6FA8E8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:radial-gradient(120% 55% at 50% -4%,#16294D 0%,var(--deep) 58%) no-repeat,var(--deep);
    background-attachment:fixed;color:var(--foam);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  :focus-visible{outline:2px solid var(--beam);outline-offset:2px}
  button,input,select{font-family:inherit}
  button{cursor:pointer}
  a{color:var(--beam)}

  /* 로그인 */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate .box{width:100%;max-width:340px;text-align:center}
  .gate h1{font-size:23px;margin:0 0 6px}
  .gate p{color:var(--mist);font-size:13px;margin:0 0 22px}
  .gate input{width:100%;padding:13px 14px;font-size:16px;background:rgba(255,255,255,.05);
    border:1px solid rgba(143,163,196,.3);border-radius:10px;color:var(--foam);outline:none;margin-bottom:10px}
  .gate input:focus{border-color:var(--beam)}
  .btn{width:100%;padding:13px;font-size:15px;font-weight:700;background:var(--beam);
    color:#16233D;border:none;border-radius:10px}
  .btn:hover{filter:brightness(1.06)}
  .btn.sm{width:auto;padding:8px 15px;font-size:13px;border-radius:8px}
  .btn.gh{background:transparent;color:var(--foam);border:1px solid rgba(143,163,196,.35)}
  .btn.gh:hover{border-color:var(--beam);color:var(--beam)}
  .err{color:var(--bad);font-size:12.5px;margin-top:10px}

  /* 레이아웃 */
  .top{position:sticky;top:0;z-index:20;background:rgba(11,23,48,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .topin{max-width:1180px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:14px}
  .brand{font-weight:800;font-size:16px;white-space:nowrap}
  .brand span{color:var(--beam)}
  .tabs{display:flex;gap:3px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:9px 14px;font-size:13.5px;font-weight:600;background:none;border:none;color:var(--mist);
    border-radius:8px;white-space:nowrap}
  .tab:hover{color:var(--foam);background:rgba(255,255,255,.05)}
  .tab.on{color:#16233D;background:var(--beam)}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}

  /* 카드/표 */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin-bottom:22px}
  .kpi{background:var(--sea);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .kpi .l{font-size:12px;color:var(--mist);margin-bottom:6px}
  .kpi .v{font-size:26px;font-weight:800;line-height:1.1}
  .kpi .s{font-size:11.5px;color:var(--dim);margin-top:5px}
  .kpi.hl{border-color:rgba(247,201,72,.5);background:rgba(247,201,72,.08)}
  .kpi.hl .v{color:var(--beam)}

  .panel{background:var(--sea);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden}
  .ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .ph h2{margin:0;font-size:15px;font-weight:700}
  .ph .sub{font-size:12px;color:var(--mist)}
  .ph .right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  a.btn{text-decoration:none;display:inline-flex;align-items:center}
  .pb{padding:16px}
  .pb.flush{padding:0}
  .prept .sumr td{border-top:2px solid var(--line);background:rgba(255,255,255,.03)}
  .fzbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:12px 16px}
  .ckl{list-style:none;margin:0;padding:0}.ckl li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .ckl li:first-child{border-top:0}.ckl .ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.07);color:var(--mist)}
  .ckl li.ok .ck{background:rgba(78,216,160,.2);color:#7FE9C0}.ckl li.ok b{color:var(--mist)}.ckl .note{display:block}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:11px 14px;background:rgba(0,0,0,.2);color:var(--mist);font-weight:600;
    font-size:12px;white-space:nowrap;position:sticky;top:0}
  td{padding:11px 14px;border-top:1px solid rgba(143,163,196,.12);vertical-align:middle}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .scroll{max-height:520px;overflow:auto}

  .chip{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .chip.C{background:rgba(124,143,168,.2);color:#B6C4D8;border:1px solid rgba(124,143,168,.5)}
  .chip.B{background:rgba(63,182,168,.16);color:#8FE3D6;border:1px solid rgba(63,182,168,.5)}
  .chip.A{background:rgba(161,118,232,.16);color:#CFB6F5;border:1px solid rgba(161,118,232,.5)}
  .chip.S{background:rgba(247,201,72,.16);color:var(--beam2);border:1px solid rgba(247,201,72,.5)}
  .chip.wait{background:rgba(143,163,196,.16);color:var(--mist);border:1px solid rgba(143,163,196,.4)}
  .chip.ok{background:rgba(78,216,160,.16);color:#7FE9C0;border:1px solid rgba(78,216,160,.45)}
  .chip.no{background:rgba(255,154,139,.14);color:var(--bad);border:1px solid rgba(255,154,139,.45)}

  .bar{height:9px;background:rgba(0,0,0,.28);border-radius:999px;overflow:hidden;min-width:90px}
  .bar i{display:block;height:100%;border-radius:999px}

  input.search,select.sel{padding:8px 11px;font-size:13px;background:rgba(0,0,0,.25);
    border:1px solid rgba(143,163,196,.3);border-radius:8px;color:var(--foam);outline:none}
  input.search:focus,select.sel:focus{border-color:var(--beam)}
  select.sel option{background:#12233F}

  .rev{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:13px}
  .rc{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .rc .rh{padding:11px 13px;display:flex;align-items:center;gap:8px;font-size:13px}
  .rc .rh b{font-weight:700}
  .rc .rh .sid{color:var(--mist);font-size:11.5px}
  .rc{position:relative}
  .rc img{width:100%;height:210px;object-fit:contain;object-position:top;background:#0A1428;
    display:block;cursor:zoom-in}
  .rc img.bad{min-height:210px}
  .rc img.bad+.openorig{background:rgba(255,154,139,.16);border-color:rgba(255,154,139,.5);
    color:var(--bad)}
  .rc .openorig{position:absolute;right:10px;top:46px;z-index:4;font-size:11px;
    background:rgba(11,23,48,.85);border:1px solid rgba(143,163,196,.4);color:var(--mist);
    padding:4px 9px;border-radius:999px;text-decoration:none}
  .rc .openorig:hover{border-color:var(--beam);color:var(--beam)}
  a.tel{color:var(--beam2);text-decoration:none;font-variant-numeric:tabular-nums}
  a.tel:hover{text-decoration:underline}
  .rc .ra{display:flex;gap:6px;padding:11px 13px}
  .rc .ra button{flex:1;padding:9px;font-size:12.5px;font-weight:700;border-radius:8px;border:none}
  .rc .ra .y{background:rgba(78,216,160,.18);color:#7FE9C0;border:1px solid rgba(78,216,160,.45)}
  .rc .ra .n{background:rgba(255,154,139,.14);color:var(--bad);border:1px solid rgba(255,154,139,.45)}
  .rc .done{padding:12px;text-align:center;font-size:12.5px}

  .qcard{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:12px}
  .qcard h3{margin:0 0 3px;font-size:14.5px}
  .qcard .meta{font-size:11.5px;color:var(--mist);margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
  .row .lb{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .bar{flex:1}
  .row .n{width:64px;text-align:right;color:var(--mist);font-size:12px;font-variant-numeric:tabular-nums}
  .memos{margin-top:12px;padding-top:12px;border-top:1px solid rgba(143,163,196,.15)}
  .memo{font-size:12.5px;color:var(--foam);background:rgba(0,0,0,.2);border-radius:8px;
    padding:9px 11px;margin-bottom:6px;line-height:1.5}
  .memo b{color:var(--mist);font-weight:600;font-size:11px}

  .empty{padding:44px 16px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(143,163,196,.3);
    border-top-color:var(--beam);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .zoom{position:fixed;inset:0;z-index:300;background:rgba(4,9,20,.95);display:flex;
    align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .zoom img{max-width:100%;max-height:100%;border-radius:10px}
  .zv{padding:0;cursor:default;background:rgba(4,9,20,.98)}
  body:has(.zv) .toast{bottom:92px}
  .zv .zstage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;cursor:grab}
  .zv .zstage.drag{cursor:grabbing}
  .zv img{max-width:calc(100vw - 32px);max-height:calc(100vh - 120px);border-radius:8px;transform-origin:center center;
    user-select:none;-webkit-user-select:none;-webkit-user-drag:none;will-change:transform;pointer-events:none}
  .zv .zx{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);
    color:#fff;font-size:18px;cursor:pointer;z-index:2}
  .zv .zpct{position:absolute;top:22px;left:16px;font-size:12px;color:var(--mist);z-index:2;pointer-events:none}
  .zv .ztools{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;
    align-items:center;gap:6px;background:rgba(14,26,52,.94);border:1px solid rgba(255,255,255,.12);padding:6px;border-radius:999px;z-index:2;
    max-width:calc(100vw - 16px)}
  .zv .ztools button{min-width:42px;height:42px;border-radius:999px;border:0;background:rgba(255,255,255,.09);color:#fff;
    font-size:15px;font-weight:700;padding:0 12px;cursor:pointer;white-space:nowrap;font-family:inherit}
  .zv .ztools button:hover{background:rgba(255,255,255,.18)}
  .zv .ztools .y{background:#22a873}.zv .ztools .n{background:#c9505a}
  .zv .zsep{width:1px;height:24px;background:rgba(255,255,255,.18);margin:0 2px}
  @media(max-width:420px){.zv .ztools{gap:4px;padding:5px}.zv .ztools button{min-width:38px;height:40px;padding:0 9px;font-size:14px}}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(20,38,74,.97);
    border:1px solid var(--beam);color:var(--beam2);padding:11px 20px;border-radius:999px;
    font-size:13.5px;z-index:400;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .note{font-size:12px;color:var(--dim);line-height:1.7}
  /* 학생 상세 */
  .drawer{position:fixed;inset:0;z-index:200;background:rgba(4,9,20,.72);display:flex;justify-content:flex-end}
  .drawer .dp{width:100%;max-width:540px;height:100%;overflow-y:auto;background:var(--sea);
    border-left:1px solid var(--line);padding:22px 22px 70px;animation:dIn .22s ease}
  @keyframes dIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
  .dp .dh{display:flex;align-items:flex-start;gap:10px}
  .dp h3{margin:0;font-size:21px}
  .dp .sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  .dp .sec h4{margin:0 0 10px;font-size:13px;color:var(--mist);font-weight:700}
  .kv{display:grid;grid-template-columns:112px 1fr;gap:7px 12px;font-size:13.5px;margin:0}
  .kv dt{color:var(--dim)} .kv dd{margin:0}
  .frm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .frm input,.frm textarea{flex:1;min-width:0;padding:10px 12px;font-size:14px;background:rgba(255,255,255,.05);
    border:1px solid rgba(143,163,196,.3);border-radius:9px;color:var(--foam);outline:none;font-family:inherit}
  .frm input.n{flex:0 0 120px}
  .frm textarea{width:100%;min-height:78px;resize:vertical}
  .frm input:focus,.frm textarea:focus{border-color:var(--beam)}
  .btn.danger{background:rgba(255,154,139,.15);color:var(--bad);border:1px solid rgba(255,154,139,.4)}
  .owned{display:flex;flex-wrap:wrap;gap:5px}
  .sanc .sb{margin-top:12px;padding:12px 13px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
  .sanc .sbh{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13.5px}
  .sanc .sbh .note{margin-left:auto}
  .sanc .sb .note{margin:4px 0 8px}
  .sanc .srow{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
  .sanc .pick{display:flex;flex-wrap:wrap;gap:6px}
  .sanc .pk{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 9px;border-radius:8px;background:rgba(255,255,255,.05);font-size:12px}
  .sanc .pk b{margin-left:3px;color:var(--beam)}
  .sanc .pk input,.sanc #spend{width:46px;padding:4px 6px;font-size:13px;background:rgba(0,0,0,.25);color:var(--foam);
    border:1px solid var(--line);border-radius:6px}
  .sanc .logs{max-height:260px;overflow-y:auto;border-radius:8px;border:1px solid var(--line)}
  .sanc .lr{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 9px;font-size:12.5px;border-bottom:1px solid var(--line)}
  .sanc .lr:last-child{border-bottom:none}
  .sanc .lr.rv{opacity:.5}
  .sanc .lt{color:var(--dim);white-space:nowrap}
  .sanc .lnk{background:none;border:none;color:var(--bad);font-size:12px;cursor:pointer;white-space:nowrap}
  .owned span{font-size:12px;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.05)}
  .owned span b{margin-left:4px;color:var(--beam)}
  .plus{color:#7FE9C0;font-weight:800} .minus{color:var(--bad);font-weight:800}
  .gbtn{display:inline-flex;gap:8px;margin-left:6px}
  .fq{flex-wrap:wrap;gap:8px}.fq #fl{flex:1;min-width:200px}.fq #fc{flex:0 0 80px;width:80px}
  .qrbox .btn.gh{color:#0B1834;background:#F1F4F9;border:1px solid #CBD3E1}
  .flist{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .fev{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .fev.off{opacity:.55}.fev .fb{display:flex;gap:6px;flex-wrap:wrap}
  .fst{margin-top:14px;padding:14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .fhd{display:flex;flex-direction:column;gap:4px}
  .fpick{display:flex;flex-direction:column;gap:6px}
  .fpk{display:flex;gap:12px;align-items:center;flex-wrap:wrap;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--foam);font-size:15px}
  .fpk:hover{border-color:var(--beam)} .fpk .note{margin-left:auto}
  .rsn{position:fixed;inset:0;z-index:320;background:rgba(3,8,18,.72);display:flex;align-items:center;justify-content:center;padding:16px}
  .rsnb{width:min(520px,100%);background:var(--sea);border:1px solid var(--line);border-radius:16px;padding:18px}
  .rsnb h3{margin:0 0 4px;font-size:16px}.rsnb .note{margin:0 0 12px}
  .rsnl{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .rsnp{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--foam);font-size:13.5px;cursor:pointer}
  .rsnp.on,.rsnp:hover{border-color:var(--bad);background:rgba(255,154,139,.1)}
  .rsnb textarea{width:100%;min-height:64px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--foam);font:inherit;resize:vertical}
  .ttab .tth{width:46px;height:62px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:#0B1834}
  .ttab td{vertical-align:middle}
  .ttab .lnk{background:none;border:none;color:var(--info);font-size:12px;cursor:pointer;padding:0 4px;text-decoration:underline}
  .ttab .lnk.bad{color:var(--bad)}
  .fbar{position:sticky;top:64px;z-index:5;margin:0 0 14px;padding:10px 12px;border-radius:14px;background:rgba(10,20,40,.92);
    border:1px solid var(--line);backdrop-filter:blur(8px)}
  .fsum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mist);margin-bottom:8px}.fsum b{color:var(--beam);font-size:14px}
  .fsub{display:flex;gap:6px;overflow-x:auto}
  .fsum span.low{color:var(--bad)}.fsum span.low b{color:var(--bad)}
  .kqb{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .kqn{font-size:56px;font-weight:900;line-height:1;color:var(--beam);font-variant-numeric:tabular-nums}
  .kqbtn{display:flex;gap:8px;align-items:center}
  .kqbtn #kqplus{width:auto;padding:18px 34px;font-size:20px}
  .kqw{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:rgba(255,154,139,.12);color:var(--bad);font-weight:700}
  .fsub button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mist);font-size:13px;font-weight:700;cursor:pointer}
  .fsub button.on{background:var(--beam);color:#13203A;border-color:var(--beam)}
  .fsub button i{font-style:normal;display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px}
  .fsub button.on i{background:#13203A;color:var(--beam)}
  input.mini{width:54px;padding:3px 6px;margin:0 3px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--foam);font-size:13px}
  tr.dim td{opacity:.6}
  .exi{display:flex;flex-direction:column;gap:6px}.exi>span.brk{opacity:.85}.exi>span{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #inflight{position:fixed;right:16px;bottom:16px;z-index:400;padding:8px 14px;border-radius:999px;background:rgba(10,20,40,.92);
    border:1px solid var(--line);color:var(--mist);font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .rcn{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}.rcn:last-child{border-bottom:none}
  .fgifts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .fgift{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;
    background:rgba(255,201,74,.07);border:1px solid rgba(255,201,74,.25)}
  .fgift.off{background:rgba(0,0,0,.15);border-color:var(--line)}
  .fgift .lnk{background:none;border:none;color:var(--mist);text-decoration:underline;cursor:pointer;font-size:12px}
  .fplan{margin-top:12px;padding:14px 16px;border-radius:12px;border:1.5px solid rgba(255,201,74,.45);background:rgba(255,201,74,.08);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}

<body>
<div id="app"><div class="gate"><span class="spin"></span></div></div>

<script>
/* ═══════════════════════════════════════════════
   딩글이 카드 도감 — 등대팀 관리자
   ═══════════════════════════════════════════════ */

/* ── 설정: 학생용 index.html과 동일하게 맞춰주세요 ── */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbzG9m2zMqCLCkxWinagr5fRNIL_0e0Cm51GG9BhK_0mzXu0fOxqbyiZe8WjqFjbZ-T8qw/exec",                 // Apps Script 웹앱 주소
  // 담당자 코드는 여기 두지 않습니다. Apps Script → 프로젝트 설정 → 스크립트 속성의 ADMIN_CODE에 둡니다.
  CAP: 3,
};

const TIERS = {
  C: { color: "#7C8FA8", word: "일반", goods: "소정의 선물" },
  B: { color: "#3FB6A8", word: "희귀", goods: "조금 더 좋은 선물" },
  A: { color: "#A176E8", word: "영웅", goods: "더 좋은 선물" },
  S: { color: "#F7C948", word: "전설", goods: "특별 선물" },
};
const TIER_KEYS = ["C", "B", "A", "S"];
const PER_TIER = { C: 7, B: 7, A: 7, S: 5 };      // 등급별 카드 종수
const TOTAL_CARDS = TIER_KEYS.reduce((a, t) => a + PER_TIER[t], 0);

const PROGRAMS = [
  { id: "p1", name: "학습동아리" },
  { id: "p2", name: "학습튜터링" },
  { id: "p3", name: "학습법특강(11.19(목) 온라인학습법 워크숍)", aka: ["학습법 특강", "학습법특강(11.19(목) 온라인학습법 워크숍 예정)"] },
  { id: "p4", name: "학습코칭 상담" },
  { id: "p5", name: "의사소통코칭" },
  { id: "p6", name: "의사소통 워크숍(11.23(월) 온라인의사소통 워크숍)", aka: ["의사소통 워크숍", "의사소통 워크숍(11.23(목) 온라인의사소통 워크숍 예정)", "의사소통 워크숍(11.23(월) 온라인의사소통 워크숍 예정)"] },
];

/* 프로그램 이름을 바꾸기 전에 남긴 만족도(예전 이름 저장)를 지금 이름으로 맞춘다 */
function progAka(r) {
  const p = PROGRAMS.find(x => (x.aka || []).indexOf(r.program) >= 0);
  return p ? Object.assign({}, r, { program: p.name }) : r;
}
const api = CONFIG.API_URL && CONFIG.API_URL.indexOf("http") === 0;
/* 인증 항목별 지급 장수. 같은 사이트의 학생 앱(index.html) 설정을 읽어 덮어쓴다 */
let REWARD = { follow: 7, apply: 7, done: 10, tabs: 7 };
/* 이 학생이 그 인증으로 실제 받은 장수: 획득 기록에 있으면 그 값, 없으면(10/24 이전 참여) 그때 장수 */
const OLD_REWARD = { follow: 5, apply: 5, done: 7 };
function rewardFor(st, key) {
  const log = st && Array.isArray(st.log) ? st.log : [];
  for (let i = log.length - 1; i >= 0; i--) if (log[i] && log[i].k === "g" && log[i].key === key && !log[i].x) return Number(log[i].n) || 0;
  const R0 = (st && st.claims && st.claims[key] && st.claims[key] < Date.parse("2026-10-27T00:00:00+09:00")) || !log.length ? OLD_REWARD : REWARD;
  return key === "follow" ? R0.follow : key === "tabs" ? (REWARD.tabs || 7) : String(key).indexOf("apply:") === 0 ? R0.apply : String(key).indexOf("done:") === 0 ? R0.done : 0;
}
const rewardOf = key => key === "follow" ? REWARD.follow : key === "tabs" ? (REWARD.tabs || 7)
  : String(key).indexOf("apply:") === 0 ? REWARD.apply : String(key).indexOf("done:") === 0 ? REWARD.done : 0;
const ADMIN_PAGE_VERSION = "2026-11-25b";   // 이 관리자 페이지 파일의 버전 (로그인 화면 아래에 표시)
let SRV = null;                             // 로그인 화면에서 확인한 서버 상태
let MISMATCH = "";                          // 학생 앱과 서버 주소가 다르면 경고 문구

let D = { students: [], proofs: [], surveys: [], ratings: [], exchanges: [], grants: [], meta: {} };
let ADMIN = "";        // 로그인 때 입력한 담당자 코드 (이 창을 닫으면 사라짐)
let V = { tab: "home", loading: false, q: "", revFilter: "wait", err: "" };

const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function toast(m) {
  const e = document.createElement("div");
  e.className = "toast"; e.textContent = m;
  document.body.appendChild(e);
  setTimeout(() => e.remove(), 2200);
}

/* 구글 드라이브 주소를 이미지로 표시 가능한 형태로 바꾼다.
   예전에 저장된 uc?export=view 주소도 자동 변환된다. */
function driveId(u) {
  const t = String(u || "");
  if (t.indexOf("google") < 0) return "";   // data: 주소 등은 그대로 둔다
  const m = t.match(/[-\w]{25,}/);          // 드라이브 파일 ID
  return m ? m[0] : "";
}
function imgUrl(u) {
  u = String(u || "");
  const id = driveId(u);
  return id ? "https://drive.google.com/thumbnail?id=" + id + "&sz=w1200" : u;
}
function origUrl(u) {
  const id = driveId(u);
  return id ? "https://drive.google.com/file/d/" + id + "/view" : String(u || "");
}
/* 썸네일 주소가 실패하면 lh3 주소로 한 번 더 시도한다 */
function admImgFallback(im) {
  const id = im.getAttribute("data-id") || "";
  if (id && !im.getAttribute("data-retry")) {
    im.setAttribute("data-retry", "1");
    im.src = "https://lh3.googleusercontent.com/d/" + id + "=w1200";
    return;
  }
  im.classList.add("bad");
}

function phoneFmt(v) {
  const raw = String(v == null ? "" : v).trim();
  let d = raw.replace(/\D/g, "");
  if (/^1\d{8,9}$/.test(d)) d = "0" + d;
  if (/^01\d{9}$/.test(d)) return d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7);
  if (/^01\d{8}$/.test(d)) return d.slice(0, 3) + "-" + d.slice(3, 6) + "-" + d.slice(6);
  return raw;
}
function proofLabel(key) {
  if (key === "follow") return "인스타 팔로우";
  if (key === "tabs") return "TABS 설문";
  const a = String(key).split(":");
  const p = PROGRAMS.find(x => x.id === a[1]);
  const nm = p ? p.name : a[1];
  return a[0] === "apply" ? nm + " 신청" : nm + " 완료";
}

/* ── 데이터 로드 ── */
async function load(silent) {
  if (!silent) { V.loading = true; render(); }
  try {
    if (api) {
      const r = await fetch(CONFIG.API_URL + "?action=admin&admin=" + encodeURIComponent(ADMIN));
      const j = await r.json();
      if (!j.ok) {
        authed = false; V.loading = false;
        V.err = j.error === "no admin code" ? NO_CODE_MSG : "담당자 코드가 맞지 않습니다. 다시 입력해 주세요.";
        return render();
      }
      D = { students: j.students || [], proofs: j.proofs || [], surveys: j.surveys || [],
            ratings: (j.ratings || []).map(progAka), exchanges: j.exchanges || [], grants: j.grants || [],
            pollSheets: j.pollSheets || [],
            meta: { v: j.v || "", epoch: j.epoch || "", notice: j.notice || null,
                    sheetName: j.sheetName || "", sheetUrl: j.sheetUrl || "",
                    closed: Number(j.closed) || 0, backup: j.backup || null, tabsEnd: Number(j.tabsEnd) || 0,
                    final: j.final && Array.isArray(j.final.list) ? j.final : null },
            stock: j.stock || { total: {}, count: {}, log: [] },
            events: Array.isArray(j.events) ? j.events : [] };
      // 시트가 앞의 0을 지운 예전 번호(1012345678)까지 010-1234-5678 꼴로 맞춘다
      D.students.forEach(x => { if (x.contact) x.contact = phoneFmt(x.contact); });
      D.exchanges.forEach(x => { if (x.contact) x.contact = phoneFmt(x.contact); });
      revApplyPending();   // 아직 저장 중인 승인·반려는 화면에서 그대로 둔다
    } else {
      D = fromLocal();
    }
    V.err = "";
  } catch (e) {
    if (silent) return;                 // 자동 새로고침 실패는 조용히 넘긴다 (다음 차례에 다시)
    V.err = "데이터를 불러오지 못했습니다. API 주소를 확인해 주세요. (" + String(e && e.message || e) + ")";
  }
  V.loading = false; render();
}

/* 2분마다 조용히 새로고침 — 다른 팀원이 처리한 내용과 새 인증을 반영한다.
   상세 창이 열려 있거나 글자를 입력하는 중이거나 탭이 가려져 있으면 건너뛴다. */
setInterval(async () => {
  if (!authed || !api || V.loading || document.hidden || $("drawer") || V.inflight) return;
  const ae = document.activeElement;
  if (ae && ae.matches && ae.matches("input,textarea,select")) return;
  const before = D.proofs.filter(p => p.status === "wait").length;
  const y = window.scrollY;
  await load(true);
  window.scrollTo(0, y);
  const after = D.proofs.filter(p => p.status === "wait").length;
  if (after > before) toast(`새 인증 ${after - before}건이 들어왔어요`);
}, 120000);

/* 서버 없이 이 기기에서 테스트할 때 */
function fromLocal() {
  const out = { students: [], proofs: [], surveys: [], ratings: [], exchanges: [] };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || k.indexOf("dingle:") !== 0) continue;
    let d; try { d = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
    const owned = d.owned || {};
    out.students.push({
      sid: d.sid, name: d.name, owned: owned, claims: d.claims || {}, proofs: d.proofs || {},
      types: Object.keys(owned).filter(x => owned[x] > 0).length,
      pending: d.pending || 0,
      exchanged: Object.keys(d.exchanged || {})
        .filter(t => { const x = d.exchanged[t]; return !x || typeof x !== "object" || x.status === "done"; })
        .join(","),
      quizDone: (d.quizDone || []).length, at: d.createdAt || 0,
      ref: d.ref || "", refFrom: d.refFrom || [], contact: d.contact || "",
    });
    Object.keys(d.proofs || {}).forEach(key => {
      const pr = d.proofs[key];
      out.proofs.push({ sid: d.sid, name: d.name, key, at: pr.at, status: pr.status || "wait", img: pr.img });
    });
    (d.surveys || []).forEach(sv => out.surveys.push(Object.assign({ sid: d.sid, name: d.name }, sv)));
    Object.keys(d.ratings || {}).forEach(pid => {
      const rt = d.ratings[pid];
      out.ratings.push({ sid: d.sid, name: d.name, program: rt.program, score: rt.score || 0, memo: rt.memo || "" });
    });
    Object.keys(d.exchanged || {}).forEach(t => {
      const x = d.exchanged[t] || {};
      out.exchanges.push({ sid: d.sid, name: d.name, tier: t, goods: TIERS[t] ? TIERS[t].goods : "",
        contact: x.contact || d.contact || "", at: x.at || 0,
        status: typeof x === "object" && x.status ? x.status : "done", doneAt: 0 });
    });
  }
  return out;
}

/* ── 집계 ── */
function tierDone(st, t) {
  const o = st.owned || {};
  let n = 0;
  for (let i = 1; i <= PER_TIER[t]; i++) if ((o[t + i] || 0) > 0) n++;
  return n;
}
function stats() {
  const s = { total: D.students.length, cards: 0, wait: 0, exch: 0, comp: { C: 0, B: 0, A: 0, S: 0 }, full: 0, hidComp: { C: 0, B: 0, A: 0, S: 0 }, hidFull: 0 };
  D.students.forEach(st => {
    const o = st.owned || {};
    Object.keys(o).forEach(k => s.cards += o[k]);
    const hid = !!(st.adm && st.adm.hide);   // 순위 제외 학생은 완성자 수에서 빼고 따로 센다 (학생 순위표와 같은 기준)
    TIER_KEYS.forEach(t => { if (tierDone(st, t) === PER_TIER[t]) (hid ? s.hidComp : s.comp)[t]++; });
    if (TIER_KEYS.every(t => tierDone(st, t) === PER_TIER[t])) hid ? s.hidFull++ : s.full++;
  });
  // 교환 완료 = 교환 시트에서 '지급 완료'인 학생 수 (1인 1개). 학생 기록의 exchanged 칸은 학생이 다시 접속해야 바뀌어서 쓰지 않는다
  s.exch = new Set((D.exchanges || []).filter(x => x.status === "done").map(x => String(x.sid))).size;
  s.wait = D.proofs.filter(p => p.status === "wait").length;
  return s;
}

const NO_CODE_MSG = "서버에 담당자 코드가 아직 없습니다. Apps Script 편집기 → 왼쪽 톱니바퀴(프로젝트 설정) → 스크립트 속성 → 속성 ADMIN_CODE, 값에 원하는 코드를 넣고 저장해 주세요.";

/* ── 화면: 로그인 ── */
function viewGate() {
  return `
    <div class="gate"><div class="box">
      <h1>등대팀 관리자</h1>
      <p>딩글이 카드 도감 운영 화면입니다</p>
      <input id="code" type="password" placeholder="담당자 코드" autocomplete="off">
      <button class="btn" id="go">들어가기</button>
      ${V.err ? `<div class="err">${esc(V.err)}</div>` : ""}
      ${V.errRaw ? `<div class="note" style="margin-top:4px">서버 응답: ${esc(V.errRaw)}</div>` : ""}
      <p class="note" style="margin-top:20px" id="srvline">${srvText()}</p>
      <p class="note" style="margin-top:2px;opacity:.7">관리자 페이지 ${ADMIN_PAGE_VERSION}</p>
    </div></div>`;
}

/* 로그인 화면에서 서버가 실제로 닿는지, 몇 버전인지 보여준다 (문제가 어디 있는지 바로 알 수 있게) */
function srvText() { return srvState() + (MISMATCH || ""); }
function srvState() {
  if (!api) return "API 주소가 비어 있어 이 기기의 데이터만 표시됩니다";
  if (!SRV) return '<span class="spin"></span> 서버 확인 중…';
  if (SRV.state === "down") return '<span style="color:var(--bad)">서버에 연결하지 못했습니다. API 주소와 배포 상태를 확인해 주세요.</span>';
  if (SRV.state === "old") return '<span style="color:var(--bad)">서버가 예전 버전입니다' + (SRV.v ? " (" + esc(SRV.v) + ")" : "") +
    '. apps-script.gs를 새 버전으로 배포해 주세요.</span>';
  if (SRV.state === "stale") return '<span style="color:var(--beam)">서버 연결됨 · 버전 ' + esc(SRV.v) +
    ' · 최신(' + SERVER_EXPECT + ')이 아닙니다. Apps Script를 [배포 관리 → 수정 → 새 버전]으로 다시 배포해야 기간 설문 시트가 만들어집니다.</span>';
  return '<span style="color:#7FE9C0">서버 연결됨 · 버전 ' + esc(SRV.v) + ' ✓</span>';
}
async function checkServer() {
  if (!api || SRV) return;
  try {
    const r = await fetch(CONFIG.API_URL + "?action=ping");
    const j = await r.json();
    const v = (j && j.v) || "";
    SRV = { state: v >= SERVER_EXPECT ? "ok" : v >= "2026-09-24" ? "stale" : "old", v };
  } catch (e) { SRV = { state: "down", v: "" }; }
  const el = $("srvline"); if (el) el.innerHTML = srvText();
  // 같은 사이트의 학생 앱(index.html)이 쓰는 서버 주소와 비교한다 (파일로 열었을 때는 건너뜀)
  try {
    if (location.protocol.indexOf("http") === 0) {
      const t = await (await fetch(new URL("index.html", location.href).href)).text();
      // 학생 앱의 기간 설문 설정(제목·기간·보기)을 읽어 둔다 → 아무도 고르지 않은 보기도 0명으로 보여 준다
      try {
        const pm = t.match(/const POLLS = (\[[\s\S]*?\n\]);/);
        if (pm) { POLL_DEF = {}; (new Function("return " + pm[1])() || []).forEach(x => { POLL_DEF[x.id] = x; }); }
        const em = t.match(/EVENTS:\s*(\[[\s\S]*?\n  \]),/);
        if (em) { try { const ev = new Function("return " + em[1])(); if (Array.isArray(ev)) CODE_EVENTS = ev; } catch (eE) {} }
        const rm = t.match(/REWARD:\s*(\{[\s\S]*?\})/);
        if (rm) { const r = new Function("return " + rm[1])(); if (r && typeof r === "object") REWARD = Object.assign(REWARD, r); }
        D._pair = null;                        // 설정을 읽었으니 기간 설문 구분을 다시 계산
        if ((V.tab === "poll" || V.tab === "survey") && authed) render();
      } catch (eP) {}
      const m = t.match(/API_URL:\s*"([^"]+)"/);
      if (m && m[1].trim() !== CONFIG.API_URL.trim()) {
        MISMATCH = '<br><span style="color:var(--bad)">⚠ 학생 앱(index.html)과 이 관리자 페이지의 서버 주소가 다릅니다. ' +
                   '두 파일의 API_URL을 같게 맞춰야 학생 기록이 여기에 보입니다.</span>';
        const e2 = $("srvline"); if (e2) e2.innerHTML = srvText();
      }
    }
  } catch (e) {}
}

/* 확인해 볼 학생 — 의심 신호가 있는 학생을 모아 보여 준다 (판단은 사람이) */
function suspectRows() {
  const out = [];
  const bySid = {};
  D.proofs.forEach(p => (bySid[String(p.sid)] = bySid[String(p.sid)] || []).push(p));
  const refKids = {};
  D.students.forEach(x => { if (x.ref) (refKids[String(x.ref)] = refKids[String(x.ref)] || []).push(x); });
  const active = x => Object.keys(x.claims || {}).some(k => k === "follow" || k === "tabs" || k.indexOf("apply:") === 0 || k.indexOf("done:") === 0 || (x.quizDone || 0) > 0);
  D.students.forEach(x => {
    const why = [], sid = String(x.sid), ps = (bySid[sid] || []).slice().sort((a, b) => (a.at || 0) - (b.at || 0));
    // 짧은 시간에 인증 여러 건 (10분 안에 3건 이상)
    for (let i = 0; i + 2 < ps.length; i++) if (ps[i + 2].at - ps[i].at < 10 * 60e3) { why.push("10분 안에 인증 3건 이상"); break; }
    const no = ps.filter(p => p.status === "no").length;
    if (no >= 2) why.push(`반려 ${no}건`);
    const kids = refKids[sid] || [];
    if (kids.length >= 2 && !kids.some(active)) why.push(`추천 친구 ${kids.length}명 모두 활동 없음`);
    if ((x.adm && x.adm.ops || []).some(o => o.via === "revoke")) why.push("카드 회수 이력");
    if (why.length) out.push({ x, why });
  });
  return out.sort((a, b) => b.why.length - a.why.length);
}

/* ── 설문 ── */
/* 기간 설문 응답 구분. 서버가 '설문' 칸을 채워 보내지만, 예전 화면에서 낸 응답은 비어 있을 수 있어
   같은 주차·같은 질문이 기간 설문에 속해 있으면 그 설문으로 본다 */
function pollOf(s) {
  if (s.poll) return s.poll;
  if (!D._pair) {
    D._pair = {};
    // 학생 앱 설정(POLLS)에 있는 문항이면, 서버를 새 버전으로 바꾸기 전에 낸 응답이어도 기간 설문으로 본다
    Object.values(POLL_DEF).forEach(p => {
      const wk = mondayOf(p.from);
      (p.questions || []).forEach(q => { D._pair[wk + "|" + q.q] = p.id; });
    });
    D.surveys.forEach(x => { if (x.poll) D._pair[x.week + "|" + x.q] = x.poll; });
  }
  return D._pair[s.week + "|" + s.q] || "";
}
/* "YYYY-MM-DD"가 속한 주의 월요일 (학생 앱의 weekKey와 같은 규칙) */
function mondayOf(ymd) {
  const t = new Date(String(ymd) + "T00:00:00");
  t.setDate(t.getDate() - (t.getDay() + 6) % 7);
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
}

function viewSurvey() {
  const byQ = {};
  const quiz = D.surveys.filter(s => !pollOf(s));
  const nPoll = D.surveys.length - quiz.length;
  quiz.forEach(s => {
    if (!byQ[s.q]) byQ[s.q] = { total: 0, ans: {}, etc: [], weeks: {} };
    const g = byQ[s.q];
    g.total++;
    if (s.answer) g.ans[s.answer] = (g.ans[s.answer] || 0) + 1;
    if (s.etc) g.etc.push({ name: s.name, t: s.etc });
    if (s.week) g.weeks[s.week] = true;
  });
  const keys = Object.keys(byQ);

  return shell(`
    <div class="panel">
      <div class="ph"><h2>설문 응답</h2>
        <span class="sub">퀴즈 뒤 '한 마디' 응답 ${quiz.length}건 · 문항 ${keys.length}개${nPoll ? ` · 기간 설문 ${nPoll}건은 '기간 설문' 탭에 따로 모았습니다` : ""}</span>
        <div class="right"><button class="btn gh sm" id="csvsv">CSV 내려받기</button></div>
      </div>
      <div class="pb">
        ${keys.length ? keys.map(q => {
          const g = byQ[q];
          const opts = Object.keys(g.ans).sort((a, b) => g.ans[b] - g.ans[a]);
          const max = Math.max(1, ...opts.map(o => g.ans[o]));
          return `<div class="qcard">
            <h3>${esc(q)}</h3>
            <div class="meta">응답 ${g.total}건 · ${Object.keys(g.weeks).length}개 회차</div>
            ${opts.map(o => {
              const n = g.ans[o], pct = Math.round(n / g.total * 100);
              return `<div class="row"><div class="lb">${esc(o)}</div>
                <div class="bar"><i style="width:${Math.round(n / max * 100)}%;background:var(--info)"></i></div>
                <div class="n">${n}건 · ${pct}%</div></div>`;
            }).join("")}
            ${g.etc.length ? `<div class="memos">
              <div class="meta" style="margin-bottom:8px">직접 입력 ${g.etc.length}건</div>
              ${g.etc.slice(0, 30).map(e => `<div class="memo"><b>${esc(e.name)}</b> · ${esc(e.t)}</div>`).join("")}
              ${g.etc.length > 30 ? `<div class="note">외 ${g.etc.length - 30}건 — CSV에서 전체를 볼 수 있습니다</div>` : ""}
            </div>` : ""}
          </div>`;
        }).join("") : `<div class="empty">아직 퀴즈 설문 응답이 없습니다.<br>학생이 퀴즈를 풀고 '한 마디'에 답하면 이곳에 쌓입니다.</div>`}
      </div>
    </div>`);
}

/* ── 기간 설문 ── */
/* 여러 개 선택(multi) 문항의 답은 '; '로 이어 저장된다 → 보기별로 나눠 센다 */
const ansSplit = (a, dq) => !a ? [] : dq && dq.multi ? String(a).split("; ").filter(Boolean) : [a];
let POLL_DEF = {};    // 학생 앱(index.html)의 POLLS 설정. 같은 사이트에 올렸을 때만 읽힌다
let CODE_EVENTS = []; // 학생 앱의 이벤트 코드 설정 (보고서에 이름을 붙이는 데 쓴다)
function pollGroups() {
  const by = {};
  D.surveys.forEach(s => {
    const id = pollOf(s);
    if (!id) return;
    const g = by[id] || (by[id] = { id, qs: [], ppl: {} });
    if (g.qs.indexOf(s.q) < 0) g.qs.push(s.q);
    const p = g.ppl[s.sid] || (g.ppl[s.sid] = { sid: s.sid, name: s.name, at: 0, a: {} });
    p.a[s.q] = { answer: s.answer || "", etc: s.etc || "" };
    p.at = Math.max(p.at, Number(s.at) || 0);
  });
  // 학생 앱에 설정한 설문은 아직 응답이 없어도 보여 준다 (QR을 미리 뽑을 수 있게)
  Object.keys(POLL_DEF).forEach(id => { if (!by[id]) by[id] = { id, qs: [], ppl: {} }; });
  return Object.keys(by).sort().reverse().map(id => {
    const g = by[id], def = POLL_DEF[id];
    if (def) {   // 설정의 문항 순서를 따르고, 응답에만 있는 예전 문항은 뒤에 둔다
      const order = def.questions.map(q => q.q);
      g.qs = order.concat(g.qs.filter(q => order.indexOf(q) < 0));   // 설정한 문항은 응답이 없어도 모두
      g.def = def;
    }
    g.people = Object.values(g.ppl).sort((a, b) => (b.at || 0) - (a.at || 0));
    return g;
  });
}

function viewPoll() {
  const groups = pollGroups();
  if (!groups.length) return shell(`<div class="panel"><div class="ph"><h2>기간 설문</h2></div>
    <div class="pb"><div class="empty">아직 기간 설문 응답이 없습니다.<br>학생 화면 '카드 얻기' 맨 위 설문에 답하면 이곳에 쌓입니다.</div></div></div>`);
  const total = D.students.length;
  return shell(groups.map(g => {
    const n = g.people.length;
    const sheet = (D.pollSheets || []).find(x => x.id === g.id);
    const etcN = g.people.filter(p => g.qs.some(q => (p.a[q] || {}).etc)).length;
    return `
    <div class="cards">
      <div class="kpi hl"><div class="l">참여 인원</div><div class="v">${n}</div>
        <div class="s">${total ? `전체 참여자 ${total}명 중 ${Math.round(n / total * 100)}%` : ""}</div></div>
      <div class="kpi"><div class="l">문항</div><div class="v">${g.qs.length}</div><div class="s">설문 ${esc(g.id)}</div></div>
      <div class="kpi"><div class="l">직접 입력을 남긴 학생</div><div class="v">${etcN}</div></div>
      <div class="kpi"><div class="l">마지막 응답</div><div class="v" style="font-size:17px;margin-top:5px">
        ${g.people[0] && g.people[0].at ? FMT_MDHM.format(new Date(g.people[0].at)) : "-"}</div></div>
    </div>
    <div class="panel">
      <div class="ph"><h2>${g.def ? esc(g.def.title) + " (" + esc(g.def.from || g.id) + (g.def.until ? " ~ " + esc(g.def.until) : "") + ")" : "기간 설문 " + esc(g.id)} · 문항별 결과</h2>
        <span class="sub">응답한 학생 ${n}명 기준${g.def && g.def.cards ? " · 참여 보상 카드 " + Number(g.def.cards) + "장" : ""}</span>
        <div class="right">
          ${sheet ? `<a class="btn gh sm" href="${esc(sheet.url)}" target="_blank" rel="noopener">스프레드시트에서 보기</a>` : ""}
          ${sheet && sheet.sumUrl ? `<a class="btn gh sm" href="${esc(sheet.sumUrl)}" target="_blank" rel="noopener">시트 집계표</a>` : ""}
          ${g.def ? `<button class="btn gh sm" data-pollqr="${esc(g.id)}">설문 QR · 포스터</button>` : ""}
          <button class="btn gh sm" data-pollcsv="${esc(g.id)}">CSV 내려받기</button>
        </div>
      </div>
      <div class="pb">
        ${g.qs.map((q, qi) => {
          const cnt = {}, etc = [];
          const dq = g.def && g.def.questions.find(x => x.q === q);
          g.people.forEach(p => {
            const a = p.a[q]; if (!a) return;
            ansSplit(a.answer, dq).forEach(v => { cnt[v] = (cnt[v] || 0) + 1; });
            if (a.etc) etc.push({ name: p.name, t: a.etc });
          });
          (dq ? dq.opts : []).forEach(o => { if (!(o in cnt)) cnt[o] = 0; });   // 아무도 안 고른 보기도 0명으로
          const opts = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
          const answered = g.people.filter(p => p.a[q]).length || 1;
          return `<div class="qcard">
            <h3>질문 ${qi + 1}. ${esc(q)}</h3>
            <div class="meta">응답 ${g.people.filter(p => p.a[q]).length}명${dq && dq.multi ? " · 여러 개 선택(비율은 응답한 학생 대비)" : " · 보기 선택 " + opts.reduce((s, o) => s + cnt[o], 0) + "명"}${dq && dq.when ? ` · 질문 ${dq.when.q + 1}에서 '${esc(dq.when.is)}'를 고른 학생만` : ""} · 직접 입력 ${etc.length}명</div>
            ${opts.map((o, i) => {
              const c = cnt[o], pct = Math.round(c / answered * 100);
              return `<div class="row"><div class="lb">${esc(o)}</div>
                <div class="bar"><i style="width:${pct}%;background:${i === 0 && c ? "var(--beam)" : "var(--info)"}"></i></div>
                <div class="n">${c}명 · ${pct}%</div></div>`;
            }).join("") || `<div class="note">보기를 고른 응답이 없습니다.</div>`}
            ${etc.length ? `<div class="memos">
              <div class="meta" style="margin-bottom:8px">직접 입력 ${etc.length}건</div>
              ${etc.map(e => `<div class="memo"><b>${esc(e.name)}</b> · ${esc(e.t)}</div>`).join("")}
            </div>` : ""}
          </div>`;
        }).join("")}
      </div>
    </div>
    <div class="panel">
      <div class="ph"><h2>학생별 응답</h2><span class="sub">${n}명 · 최근 응답 순</span></div>
      <div class="pb flush"><div class="scroll">
        <table>
          <thead><tr><th>이름</th><th>학번</th><th>응답시각</th>
            ${g.qs.map((q, qi) => `<th>질문 ${qi + 1}</th>`).join("")}</tr></thead>
          <tbody>
            ${g.people.map(p => `<tr>
              <td>${esc(p.name)}</td>
              <td style="color:var(--mist)">${esc(p.sid)}</td>
              <td style="color:var(--mist);white-space:nowrap">${p.at ? FMT_MDHM.format(new Date(p.at)) : "-"}</td>
              ${g.qs.map(q => { const a = p.a[q] || {};
                return `<td>${esc(a.answer || "")}${a.etc ? `${a.answer ? "<br>" : ""}<span style="color:var(--mist)">✎ ${esc(a.etc)}</span>` : ""}${!a.answer && !a.etc ? "-" : ""}</td>`; }).join("")}
            </tr>`).join("")}
          </tbody>
        </table>
      </div></div>
    </div>`;
  }).join(""));
}

const siteBase = () => { try { return new URL("./", location.href).href; } catch (e) { return ""; } };
const qrLink = code => siteBase() + "?ev=" + encodeURIComponent(code);
function qrSVG(text, px) {
  const q = qrcode(0, "M"); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 4, cell = (px || 320) / (n + m * 2);
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m},${r + m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + m * 2} ${n + m * 2}" width="${px || 320}" height="${px || 320}" shape-rendering="crispEdges"
    style="background:#fff;border-radius:10px"><path d="${d}" fill="#0B1834"/></svg>`;
}
const evLive = e => !e.until || e.until > Date.now();
const evCount = code => D.students.filter(x => (x.claims || {})["event:" + String(code).toUpperCase()]).length;

function viewField() {
  const evs = (D.events || []).slice().reverse();
  // 학번(숫자) 또는 이름으로 찾는다. 이름이 같은 학생이 여럿이면 고르는 목록을 보여 준다
  const q = String(V.fq || "").trim(), isNum = /^\d+$/.test(q);
  let matches = [];
  if (q) {
    if (isNum) matches = D.students.filter(x => String(x.sid) === q);
    else {
      const nq = q.replace(/\s/g, "");
      matches = D.students.filter(x => String(x.name || "").replace(/\s/g, "") === nq);
      if (!matches.length) matches = D.students.filter(x => String(x.name || "").replace(/\s/g, "").indexOf(nq) >= 0);
    }
  }
  const st = V.fsel ? D.students.find(x => String(x.sid) === V.fsel) : matches.length === 1 ? matches[0] : null;
  V.fsid = st ? String(st.sid) : "";
  const tail = c => { const d = String(c || "").replace(/\D/g, ""); return d.length >= 4 ? "연락처 끝 " + d.slice(-4) : "연락처 없음"; };
  const pick = !st && matches.length > 1 ? `<div class="fpick"><p class="note" style="margin:10px 0 6px">'${esc(q)}' 학생이 ${matches.length}명입니다. 학번을 확인하고 골라 주세요.</p>
    ${matches.map(x => `<button class="fpk" data-fpick="${esc(x.sid)}"><b>${esc(x.name)}</b><span>${esc(x.sid)}</span>
      <span class="note">보유 ${x.types}종 · 미개봉 ${x.pending}장 · ${tail(x.contact)}</span></button>`).join("")}</div>` : "";
  let sub = V.fsub || "lookup";
  if (BOOTH_DONE && ["lookup", "qr", "final"].indexOf(sub) < 0) sub = V.fsub = "lookup";
  const gcount = it => D.students.filter(x => x.adm && x.adm.gifts && x.adm.gifts[it]).length;
  const exWait = (D.exchanges || []).filter(exWaiting).length;
  const live = evs.filter(evLive).length;
  const subs = [["lookup", "학생 조회"], ["stock", "재고·퀴즈"], ["qr", "현장 QR" + (live ? ` <i>${live}</i>` : "")], ["tabs", "TABS 명단"],
                ["final", "굿즈 교환" + (exWait ? ` <i>${exWait}</i>` : "")]]
    .filter(([k]) => !BOOTH_DONE || k === "lookup" || k === "qr" || k === "final");   // 현장 QR은 다음 이벤트에도 씀
  const body = sub === "stock" ? stockHTML() : sub === "qr" ? `
    <div class="panel">
      <div class="ph"><h2>현장 이벤트 QR</h2><span class="sub">학생이 폰 카메라로 QR을 찍으면 사이트가 열리면서 카드가 바로 들어갑니다 (로그인 전이면 로그인 직후)</span></div>
      <div class="pb">
        ${api ? `<div class="frm fq">
          <input id="fl" placeholder="이벤트 이름 (예: 11/5 현장 이벤트)" maxlength="30">
          <input id="fc" type="number" min="1" max="30" value="5" style="width:80px" inputmode="numeric"><span class="note">장</span>
          <select id="fu"><option value="today">오늘 자정까지</option><option value="3">3시간</option><option value="1">1시간</option><option value="0">기한 없음</option></select>
          <button class="btn sm" id="fadd">QR 만들기</button></div>` : `<p class="note">서버에 연결된 상태에서만 만들 수 있습니다.</p>`}
        ${evs.length ? `<div class="flist">${evs.map(e => `<div class="fev ${evLive(e) ? "" : "off"}">
            <div class="fi"><b>${esc(e.label)}</b> <span class="chip ${evLive(e) ? "ok" : "no"}">${evLive(e) ? "진행 중" : "끝남"}</span>
              <div class="note">카드 ${e.cards}장 · ${e.until ? (evLive(e) ? when(e.until) + "까지" : when(e.until) + " 종료") : "기한 없음"} · 참여 <b style="color:var(--foam)">${evCount(e.code)}명</b> · 코드 ${esc(e.code)}</div></div>
            <div class="fb"><button class="btn sm" data-fqr="${esc(e.code)}">QR 크게</button>
              ${evLive(e) ? `<button class="btn gh sm" data-fend="${esc(e.code)}">지금 끝내기</button>` : ""}
              <button class="btn gh sm" data-fdel="${esc(e.code)}">삭제</button></div></div>`).join("")}</div>`
          : `<p class="note" style="margin-top:12px">아직 만든 현장 이벤트가 없습니다.</p>`}
        <p class="note" style="margin-top:10px">한 학생은 이벤트마다 한 번만 받습니다. QR 사진이 퍼지는 것을 막으려면 기한을 짧게 두고, 행사가 끝나면 [지금 끝내기]를 누르세요.</p>
      </div>
    </div>

` : sub === "tabs" ? tabsInner() : sub === "final" ? exFieldHTML() : `
    <div class="panel">
      <div class="ph"><h2>학생 조회</h2><span class="sub">학번 또는 이름을 넣으면 카드 현황·인증·교환 상태를 보고 바로 지급합니다</span></div>
      <div class="pb">
        <div class="frm"><input id="fsid" placeholder="학번 또는 이름" maxlength="20" value="${esc(V.fq || "")}" autocomplete="off" style="font-size:18px;letter-spacing:.03em">
          <button class="btn sm" id="fgo">조회</button></div>
        ${q ? (st ? (matches.length > 1 || V.fsel ? `<p class="note" style="margin:10px 0 0">${V.fsel && matches.length > 1 ? `<button class="lnk" id="fback">← 동명이인 목록으로</button>` : ""}</p>` : "") + fieldStudent(st)
              : pick || `<p class="note" style="margin-top:10px">'${esc(q)}'(으)로 찾은 참여 기록이 없습니다. 학번·이름을 확인하거나 [새로고침] 후 다시 조회해 보세요.</p>`) : ""}
      </div>
    </div>
    ${recentHTML()}`;
  return shell(`
    <div class="fbar">
      <div class="fsum">
        ${BOOTH_DONE ? "" : STOCK_ITEMS.map(([it]) => { const t = stockTotal(it), l = stockLeft(it);
          return `<span class="${stockLow(it) ? "low" : ""}">${it === KEYRING ? "키링(퀴즈)" : it === HAND ? "손난로" : "쉐이크"} ${t ? `남은 <b>${Math.max(0, l)}</b>/${t}` : `<b>${stockUsed(it)}</b>개 지급`}${t && l <= 0 ? " · 소진" : ""}</span>`; }).join("")}
        <span>진행 중 QR <b>${live}</b></span><span>굿즈 교환 대기 <b>${exWait}</b></span>
      </div>
      <div class="fsub" role="tablist">${subs.map(([k, l]) => `<button class="${sub === k ? "on" : ""}" data-fsub="${k}" role="tab" aria-selected="${sub === k}">${l}</button>`).join("")}</div>
    </div>
    ${body}`);
}

function bindStock() {
  if (V.tab !== "field" || V.fsub !== "stock") return;
  const paint = () => {
    const n = $("kqn"); if (!n) return;
    n.textContent = stockUsed(KEYRING);
    const t = stockTotal(KEYRING), l = stockLeft(KEYRING);
    $("kql") && ($("kql").textContent = Math.max(0, l));
    $("kqp") && ($("kqp").textContent = V.kqPend ? " · 저장 중…" : "");
  };
  const tEl = $("kqt"); if (tEl) tEl.dataset.base = String(Number(tEl.textContent) - (V.kqPend || 0));
  const bump = d => {
    if (d < 0 && stockUsed(KEYRING) <= 0) return;
    V.kqPend = (V.kqPend || 0) + d;
    if (tEl) tEl.textContent = String(Number(tEl.dataset.base) + V.kqPend);
    paint();
    if (d > 0 && stockTotal(KEYRING) && stockLeft(KEYRING) <= 0) toast("키링 준비 수량을 모두 썼습니다");
    clearTimeout(V.kqTimer);
    V.kqTimer = setTimeout(flushKeyring, 700);          // 빠르게 여러 번 눌러도 한 번에 모아서 저장
  };
  $("kqplus") && ($("kqplus").onclick = () => bump(1));
  $("kqminus") && ($("kqminus").onclick = () => bump(-1));
  $("stsave") && ($("stsave").onclick = async e => {
    const total = {};
    app.querySelectorAll("[data-stt]").forEach(i => { total[i.dataset.stt] = i.value === "" ? null : Math.max(0, parseInt(i.value, 10) || 0); });
    const b = e.currentTarget; b.disabled = true;
    try { const j = await adminPost({ action: "stock", mode: "total", total }); D.stock = j.stock; toast("준비 수량을 저장했습니다"); render(); }
    catch (err) { b.disabled = false; toast(errMsg(err)); }
  });
}
async function flushKeyring() {
  const d = V.kqPend || 0;
  if (!d || V.kqBusy) return;
  V.kqBusy = true;
  try {
    const j = await adminPost({ action: "stock", mode: "add", item: KEYRING, delta: d });
    V.kqPend -= d; D.stock = j.stock;
  } catch (err) { toast("퀴즈 참여 수를 저장하지 못했습니다. 잠시 후 다시 저장합니다"); setTimeout(flushKeyring, 3000); }
  V.kqBusy = false;
  if (V.kqPend) setTimeout(flushKeyring, 300);
  if (V.tab === "field" && V.fsub === "stock") { const n = $("kqn"); if (n) n.textContent = stockUsed(KEYRING); const p = $("kqp"); if (p) p.textContent = V.kqPend ? " · 저장 중…" : ""; }
}

/* 학생 조회 맨 위: 규칙(신청한 등급 중 가장 높은 1개)대로 지금 무엇을 줘야 하는지 한 줄로 */
function handoutBox(st) {
  const hc = TIER_KEYS.slice().reverse().find(k => tierDone(st, k) === PER_TIER[k]) || null;   // 가장 높은 완성 등급

  if (hc) return `<div class="fplan">

      <div class="pa">${spot(hc, true)}</div></div>`;

}
/* 현장 신청 + 지급: 신청하지 않은 학생도 부스에서 바로 처리 (학생 신청과 같은 서버 기능을 쓴다) */
function spotExchange(sid, tier) {
  const st = stuOf(sid); if (!st) return Promise.resolve(false);
  D.exchanges = D.exchanges || [];
  let x = D.exchanges.find(y => String(y.sid) === String(sid) && y.tier === tier);

  if (!x) { x = { sid: String(sid), name: st.name || "", tier, goods: TIERS[tier].goods, contact: st.contact || "", at: Date.now(), status: "req", doneAt: 0 }; D.exchanges.push(x); }
  const prev = { status: x.status, doneAt: x.doneAt };
  x.status = "done"; x.doneAt = Date.now();
  return saveBehind(async () => {
      if (api) await adminPost({ action: "exchange", sid: String(sid), tier, goods: x.goods, contact: st.contact || "", name: st.name || "" });
      await exchangeDone(String(sid), tier, "done");
    }, () => { if (created) D.exchanges.splice(D.exchanges.indexOf(x), 1); else { x.status = prev.status; x.doneAt = prev.doneAt; } },
    `${tier}등급 현장 신청·지급을 저장하지 못했습니다`);
}
function fieldStudent(st) {

      <div>${given ? `<span class="chip ok">${esc(item)} 지급함 · ${when(given)}</span> <button class="lnk" data-gu="${esc(item)}">취소</button>`

      <div class="note">보유 <b style="color:var(--foam)">${st.types}/${TOTAL_CARDS}종</b> · 미개봉 ${st.pending}장 · 연락처 ${esc(st.contact) || "-"}</div></div>

    <div class="ftiers">${tiers}</div>

/* e: 현장 QR 이벤트 { code, label, cards } 또는 링크 QR { url, label, desc, big, steps, note } (예: 기간 설문) */
const qrUrl = e => e.url || qrLink(e.code);
function showQR(e) {
  const z = document.createElement("div");
  z.className = "qrfull";
  z.innerHTML = `<div class="qrbox">${qrSVG(qrUrl(e), Math.min(520, innerWidth - 80, innerHeight - 260))}
    <h2>${esc(e.label)}</h2><p>${e.desc || `카메라로 찍으면 딩글이 카드 <b>${e.cards}장</b>!`}</p>
    <div class="note" style="word-break:break-all">${esc(qrUrl(e))}</div>
    <div class="frm" style="justify-content:center;margin-top:12px"><button class="btn sm" id="qrcopy">링크 복사</button>
      <button class="btn sm" id="qrposter">A4 포스터 인쇄</button>
      <button class="btn gh sm" id="qrprint">QR만 인쇄</button><button class="btn gh sm" id="qrx">닫기</button></div></div>`;
  document.body.appendChild(z);
  document.body.classList.add("qrprint");
  const close = () => { z.remove(); document.body.classList.remove("qrprint"); };
  z.querySelector("#qrx").onclick = close;
  z.onclick = ev => { if (ev.target === z) close(); };
  z.querySelector("#qrcopy").onclick = () => navigator.clipboard.writeText(qrUrl(e)).then(() => toast("링크를 복사했습니다"), () => toast("복사하지 못했습니다"));
  z.querySelector("#qrprint").onclick = () => { pageMargin0(true); window.print(); };
  z.querySelector("#qrposter").onclick = () => printPoster(e);
}
/* A4 포스터: QR + 참여 방법. 인쇄 뒤에는 지운다 */
function printPoster(e) {
  const old = document.querySelector(".qrposter"); if (old) old.remove();
  const pz = document.createElement("div");
  pz.className = "qrposter";
  pz.innerHTML = `<div class="pp">
    <div class="pp-k">연세대학교 미래캠퍼스 미래융합교육혁신원 · 등대팀</div>
    <h1>딩글이 카드도감</h1>
    <div class="pp-ev">${esc(e.label)}</div>
    <div class="pp-qr">${qrSVG(qrUrl(e), 560)}</div>
    <div class="pp-big">${e.big || `카메라로 QR을 찍으면<br>딩글이 카드 <b>${e.cards}장</b>!`}</div>
    <ol class="pp-steps">
      ${(e.steps || ["휴대폰 카메라로 QR을 찍어 사이트를 엽니다", "처음이면 학번·이름을 넣고 [시작]", "카드가 바로 들어가요 — 뽑기 탭에서 열어 보세요"]).map(t => `<li>${esc(t)}</li>`).join("")}
    </ol>
    <div class="pp-url">${esc(siteBase().replace(/^https?:\/\//, "").replace(/\/$/, ""))}</div>
    <div class="pp-note">${esc(e.note || "한 사람당 1회 · 학습지원 프로그램에 참여하고 인증하면 카드를 더 받을 수 있어요")}</div>
  </div>`;
  document.body.appendChild(pz);
  document.body.classList.remove("qrprint");
  document.body.classList.add("posterprint");
  const done = () => { pz.remove(); document.body.classList.remove("posterprint"); if (document.querySelector(".qrfull")) document.body.classList.add("qrprint"); window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  pageMargin0(true);
  setTimeout(() => window.print(), 50);
}
/* 브라우저 인쇄 머리글(날짜·주소)이 안 찍히게 @page 여백을 0으로 */
function pageMargin0(on) {
  let st = document.getElementById("pm0");
  if (!st) { st = document.createElement("style"); st.id = "pm0"; document.head.appendChild(st); }
  st.textContent = on ? "@media print{ @page{margin:0} }" : "";
}

function bindField() {
  if (V.tab !== "field") return;
  app.querySelectorAll("[data-fsub]").forEach(b => b.onclick = () => { V.fsub = b.dataset.fsub; render();
    if (V.fsub === "lookup") setTimeout(() => $("fsid") && $("fsid").focus(), 0); });
  bindExGroups();
  $("rcptprint") && ($("rcptprint").onclick = () => printReceipt());
  if ($("pkmsg")) {
    const save = () => { const v = $("pkmsg").value; try { localStorage.setItem("dingle:pickupMsg", v); } catch (e) {} $("pklen").textContent = v.length + "/300자"; };
    $("pkmsg").oninput = save;
    $("pkcopy").onclick = async () => {
      const v = $("pkmsg").value.trim(); if (!v) return toast("안내 문구를 적어 주세요");
      if (/○/.test(v) && !confirm("아직 ○ 자리가 남아 있습니다. 그대로 복사할까요?")) return;
      try { await navigator.clipboard.writeText(v); toast("문자 내용을 복사했습니다"); } catch (e) { $("pkmsg").select(); toast("복사가 막혀 있어 글을 선택해 두었습니다. Ctrl+C로 복사해 주세요"); }
    };
    $("excopy2").onclick = () => copyContacts(exGroups((D.exchanges || []).filter(exWaiting)));
    $("pknotice") && ($("pknotice").onclick = async e => {
      const v = $("pkmsg").value.trim(); if (!v) return toast("안내 문구를 적어 주세요");
      if (/○/.test(v)) return toast("○ 자리(날짜·시간·장소)를 먼저 채워 주세요");
      if (!confirm("이 안내를 학생 앱 맨 위 공지로 올릴까요? (지금 공지가 있으면 바뀝니다)")) return;
      const b = e.currentTarget; b.disabled = true;
      try { await adminPost({ action: "notice", text: v.slice(0, 300) }); D.meta.notice = { t: v.slice(0, 300), at: Date.now() }; toast("학생 앱 공지로 올렸습니다"); }
      catch (err) { toast(errMsg(err)); }
      render();
    });
  }
  $("fadd") && ($("fadd").onclick = async e => {
    const label = $("fl").value.trim(), cards = parseInt($("fc").value, 10) || 0, u = $("fu").value;
    if (!label) return toast("이벤트 이름을 적어 주세요");
    if (cards < 1 || cards > 30) return toast("장수는 1~30장으로 넣어 주세요");
    let until = 0;
    if (u === "today") { const k = new Date(Date.now() + 9 * 3600e3); until = Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate(), 23, 59, 59) - 9 * 3600e3; }
    else if (+u) until = Date.now() + (+u) * 3600e3;
    const b = e.currentTarget; b.disabled = true;
    try { const j = await adminPost({ action: "fieldEvent", mode: "add", label, cards, until }); D.events = j.events || [];
      render(); showQR(D.events[D.events.length - 1]); }
    catch (err) { b.disabled = false; toast(errMsg(err)); }
  });
  const act = (sel, mode, ask, msg) => app.querySelectorAll(sel).forEach(b => b.onclick = async () => {
    const code = b.dataset[sel.slice(6, -1).replace(/-./g, x => x[1].toUpperCase())];
    if (ask && !confirm(ask)) return;
    try { const j = await adminPost({ action: "fieldEvent", mode, code }); D.events = j.events || []; render(); toast(msg); }
    catch (err) { toast(errMsg(err)); }
  });
  act("[data-fend]", "end", "이 QR 이벤트를 지금 끝낼까요? 이미 받은 카드는 그대로입니다.", "이벤트를 끝냈습니다");
  act("[data-fdel]", "del", "이 QR 이벤트를 목록에서 지울까요? 이미 받은 카드는 그대로이며, QR은 더 이상 동작하지 않습니다.", "삭제했습니다");
  app.querySelectorAll("[data-fqr]").forEach(b => b.onclick = () => showQR(D.events.find(x => x.code === b.dataset.fqr)));
  const look = () => { V.fq = ($("fsid").value || "").trim(); V.fsel = null; render(); setTimeout(() => $("fsid") && $("fsid").focus(), 0); };
  app.querySelectorAll("[data-fpick]").forEach(b => b.onclick = () => { V.fsel = b.dataset.fpick; render(); });
  $("fback") && ($("fback").onclick = () => { V.fsel = null; render(); });
  $("fgo") && ($("fgo").onclick = look);
  $("fsid") && ($("fsid").onkeydown = e => { if (e.key === "Enter") look(); });
  app.querySelectorAll("[data-fg]").forEach(b => b.onclick = async () => {
    const n = +b.dataset.fg, reason = ($("fgr").value || "").trim() || "현장 지급";
    b.disabled = true;
    if (await grantCards(V.fsid, n, reason)) render(); else b.disabled = false;
  });
  const gift = (item, on) => {
    if (on && stockTotal(item) && stockLeft(item) <= 0 && !confirm(`${item} 준비 수량을 모두 썼습니다. 그래도 지급으로 표시할까요?`)) return;
    giftNow(V.fsid, item, on);
    toast(on ? `${item} 지급` + (stockTotal(item) && stockLow(item) ? ` · 남은 수량 ${Math.max(0, stockLeft(item))}개` : "") : `${item} 지급 표시 취소`);
    render(); setTimeout(() => $("fsid") && $("fsid").select(), 0);
  };
  app.querySelectorAll("[data-gv]").forEach(b => b.onclick = () => gift(b.dataset.gv, true));
  app.querySelectorAll("[data-gu]").forEach(b => b.onclick = () => { if (confirm("경품 지급 표시를 취소할까요?")) gift(b.dataset.gu, false); });
  app.querySelectorAll("[data-fex]").forEach(b => b.onclick = () => {
    const t = b.dataset.fex, st = stuOf(V.fsid);
    if (st && st.adm && st.adm.hide && !confirm(`${st.name} 학생은 순위 제외(인증 기준 미준수) 학생입니다.\n그래도 ${t}등급 굿즈를 지급 완료로 기록할까요?`)) return;
    giveTier(V.fsid, t); toast(`${t}등급 선물 지급 완료`); render();
  });
  app.querySelectorAll("[data-fspot]").forEach(b => b.onclick = () => {
    const t = b.dataset.fspot, st = stuOf(V.fsid); if (!st) return;
    const got = (D.exchanges || []).filter(x => String(x.sid) === String(st.sid) && x.status === "done").map(x => x.tier);
    const warn = (st.adm && st.adm.hide ? "\n⚠ 순위 제외(인증 기준 미준수) 학생입니다." : "") + (got.length ? `\n⚠ 이미 ${got.join("·")}등급을 받은 학생입니다 (가장 높은 등급 1개 규칙).` : "");
    if (!confirm(`${st.name} (${st.sid})\n${t}등급 교환을 현장에서 신청하고 바로 지급 완료로 기록할까요?${warn}`)) return;
    spotExchange(st.sid, t); toast(`${t}등급 현장 신청 + 지급 완료`); render();
  });
}


/* ───────── 반려 사유 고르기 ─────────
   자주 쓰는 사유를 눌러 고르거나 직접 적는다. 학생 화면에 그대로 보이므로 문장으로 둔다. 취소하면 null */
const REJECT_PRESETS = [
  "인증 항목과 다른 화면입니다",
  "신청 완료 화면이 아닙니다 (프로그램 안내·목록 화면)",
  "다른 프로그램의 참여 기록입니다",
  "2026학년도 2학기 참여 기록이 아닙니다 (이번 학기 기록으로 인증해 주세요)",
  "다른 사람의 캡처로 보입니다",
  "화면이 잘리거나 흐려서 확인할 수 없습니다",
];
function askReason(title, note, extra) {
  return new Promise(done => {
    const list = (extra || []).concat(REJECT_PRESETS);
    const z = document.createElement("div");
    z.className = "rsn";
    z.innerHTML = `<div class="rsnb" role="dialog" aria-modal="true" aria-label="반려 사유">
      <h3>${esc(title)}</h3>${note ? `<p class="note">${esc(note)}</p>` : ""}
      <div class="rsnl">${list.map((t, i) => `<button class="rsnp" data-i="${i}">${esc(t)}</button>`).join("")}</div>
      <textarea id="rsnt" maxlength="100" placeholder="직접 적기 (학생 화면에 그대로 보입니다)"></textarea>
      <div class="frm" style="justify-content:flex-end;margin-top:10px">
        <button class="btn gh sm" id="rsnx">취소</button><button class="btn sm danger" id="rsno">반려하기</button></div></div>`;
    document.body.appendChild(z);
    const ta = z.querySelector("#rsnt");
    const close = v => { z.remove(); document.removeEventListener("keydown", key); done(v); };
    const key = e => { if (e.key === "Escape") close(null); };
    document.addEventListener("keydown", key);
    z.querySelectorAll(".rsnp").forEach(b => b.onclick = () => {
      z.querySelectorAll(".rsnp").forEach(x => x.classList.toggle("on", x === b)); ta.value = list[+b.dataset.i]; ta.focus(); });
    z.querySelector("#rsnx").onclick = () => close(null);
    z.onclick = e => { if (e.target === z) close(null); };
    z.querySelector("#rsno").onclick = () => { const v = ta.value.trim(); if (!v) { toast("사유를 고르거나 적어 주세요"); ta.focus(); return; } close(v); };
    setTimeout(() => ta.focus(), 0);
  });
}

/* ───────── TABS 현황 (더미래페스티벌 부스 이벤트) ─────────
   TABS 설문 인증을 한 학생 목록. 캡처를 보고 바로 승인·반려하고, 전기손난로 수령 완료를 표시한다. */
const HAND = "전기손난로", KEYRING = "인형 키링", SHAKE = "단백질 쉐이크";
/* 부스 경품 재고 — 준비 수량은 '재고·퀴즈' 메뉴에서 바꾼다 (기본값은 기획안: 손난로 30, 키링 150)
   손난로·쉐이크: 학생별 [지급]으로 센다 / 키링: 퀴즈 담당이 [+1]로 센다(= 퀴즈 참여 인원) */
const STOCK_DEFAULT = { [HAND]: 30, [KEYRING]: 150 };
const STOCK_ITEMS = [[HAND, "gift", "TABS 사전 인증"], [KEYRING, "count", "학습지원 프로그램 퀴즈 참여"], [SHAKE, "gift", "인스타 팔로우 인증"]];
const stockTotal = it => { const t = ((D.stock || {}).total || {})[it]; return t === undefined || t === null ? (STOCK_DEFAULT[it] || 0) : Number(t) || 0; };
const stockUsed = it => STOCK_ITEMS.find(x => x[0] === it && x[1] === "count")
  ? (Number(((D.stock || {}).count || {})[it]) || 0) + (it === KEYRING ? (V.kqPend || 0) : 0)
  : D.students.filter(x => x.adm && x.adm.gifts && x.adm.gifts[it]).length;
const stockLeft = it => stockTotal(it) ? stockTotal(it) - stockUsed(it) : null;
const stockLow = it => { const t = stockTotal(it), l = stockLeft(it); return t > 0 && l <= Math.max(3, Math.ceil(t * 0.1)); };
/* 더미래페스티벌 부스(11/10)가 끝났다: 현장·경품 탭은 '학생 조회'와 '최종 경품'만 보이고,
   TABS 현장 이벤트 종료 버튼은 운영 탭으로 옮긴다. 다음 현장 이벤트 때 false로 바꾸면 메뉴가 다시 보인다. */
const BOOTH_DONE = true;
/* 부스 최종 지급 수(확정치) — 키링은 [+1]을 중간에 못 눌러 기록이 모자라고, 손난로는 1개가 기록 없이 나가서
   보고서에는 '준비 수량 전부 지급'으로 적는다. 숫자가 다르면 여기만 고치면 된다. */
const BOOTH_FINAL = { [HAND]: 30, [KEYRING]: 155 };
const HAND_TOTAL = { valueOf: () => stockTotal(HAND), toString: () => String(stockTotal(HAND)) };
const BOOTH_DAY = Date.parse("2026-11-10T00:00:00+09:00");   // 이보다 먼저 인증했으면 '사전 인증'
function tabsRows() {
  return (D.proofs || []).filter(p => p.key === "tabs").map(p => {
    const st = D.students.find(x => String(x.sid) === String(p.sid)) || {};
    const g = (st.adm && st.adm.gifts) || {};
    return { p, st, sid: String(p.sid), name: p.name || st.name || "", at: p.at || 0, status: p.status || "wait",
             hand: g[HAND] || 0, shake: g["단백질 쉐이크"] || 0, follow: !!(st.claims || {}).follow, contact: st.contact || "" };
  }).sort((a, b) => (b.at || 0) - (a.at || 0));
}

function tabsCtlHTML() {
  const te = Number(D.meta.tabsEnd) || 0;
  return `<div class="panel tbctl">
      <div class="ph"><h2>TABS 현장 이벤트 (${esc(HAND)})</h2>
        <span class="chip ${te ? "no" : "ok"}">${te ? "종료 · " + when(te) : "진행 중"}</span>
        <div class="right">${api ? (te ? `<button class="btn gh sm" id="tbopen">다시 열기</button>` : `<button class="btn sm danger" id="tbend">현장 이벤트 종료</button>`) : ""}</div></div>
      <div class="pb"><p class="note" style="margin:0">${te
        ? `학생 화면의 ${esc(HAND)} 홍보(큰 배너·안내 창·로그인 배너)가 꺼졌습니다. TABS 인증은 11월 30일까지 계속되고 <b>카드만 지급</b>됩니다.`
        : `지금은 학생 화면에 '${esc(HAND)} 선착순' 홍보가 크게 보입니다. 부스가 끝나면 [현장 이벤트 종료]를 누르세요 — 홍보만 꺼지고 TABS 인증(카드 지급)은 11월 30일까지 계속됩니다.`}</p></div>
    </div>`;
}
function tabsInner() {
  const all = tabsRows();
  const n = k => all.filter(k).length;
  const given = D.students.filter(x => x.adm && x.adm.gifts && x.adm.gifts[HAND]).length;
  const f = V.tf || "all";
  const flt = { all: () => true, ready: r => r.status !== "no" && !r.hand, done: r => !!r.hand, wait: r => r.status === "wait", no: r => r.status === "no" }[f];
  const rows = all.filter(flt);
  const chip = r => r.status === "ok" ? `<span class="chip ok">승인</span>` : r.status === "no" ? `<span class="chip no">반려</span>` : `<span class="chip wait">검토 전</span>`;
  const pre = r => r.at && r.at < BOOTH_DAY ? `<span class="chip ok" title="부스 운영일 전에 인증">사전</span>` : `<span class="chip wait" title="부스 운영일 당일·이후 인증">당일</span>`;
  const ctl = tabsCtlHTML();
  return (`
    ${ctl}
    <div class="cards">
      <div class="kpi hl"><div class="l">TABS 인증</div><div class="v">${all.length}</div><div class="s">사전 인증 ${n(r => r.at && r.at < BOOTH_DAY)}명</div></div>
      <div class="kpi"><div class="l">검토</div><div class="v">${n(r => r.status === "wait")}</div><div class="s">승인 ${n(r => r.status === "ok")} · 반려 ${n(r => r.status === "no")}</div></div>
      <div class="kpi"><div class="l">${HAND} 지급</div><div class="v">${given} <span style="font-size:15px;color:var(--mist)">/ ${HAND_TOTAL}</span></div>
        <div class="s">${given >= HAND_TOTAL ? "모두 소진" : "남은 수량 " + (HAND_TOTAL - given) + "개"}</div></div>
      <div class="kpi"><div class="l">받을 수 있는 학생</div><div class="v">${n(r => r.status !== "no" && !r.hand)}</div><div class="s">인증했고 아직 안 받음</div></div>
    </div>
    <div class="panel">
      <div class="ph"><h2>TABS 인증 학생</h2><span class="sub">${rows.length}명 표시 · 최근 인증 순 · '사전'은 11월 10일 전에 인증</span>
        <div class="right"><input class="search" id="tq" placeholder="이름 또는 학번" value="${esc(V.tq || "")}">
          <select id="tf">${[["all", "전체"], ["ready", HAND + " 미수령"], ["done", "수령 완료"], ["wait", "검토 전"], ["no", "반려"]]
            .map(([k, l]) => `<option value="${k}" ${f === k ? "selected" : ""}>${l}</option>`).join("")}</select>
          <button class="btn gh sm" id="tcsv">CSV</button></div></div>

const KO = n => Number(n || 0).toLocaleString("ko-KR");

function reportData() {

  const firstAt = Math.min.apply(null, S.map(x => x.created || x.at || now).concat([now]));
  const proofN = { ok: 0, wait: 0, no: 0 };
  D.proofs.forEach(p => { proofN[p.status] = (proofN[p.status] || 0) + 1; });

  };
  // 프로그램별 신청 → 완료
  const prog = PROGRAMS.map(p => {

  const at = t => { const w = mondayMs(t); return weeks.find(x => x.w === w); };
  S.forEach(x => { const r = x.created && at(x.created); if (r) r.join++; });
  D.proofs.forEach(p => { const r = p.at && at(p.at); if (r) r.proof++; });
  D.surveys.filter(x => !pollOf(x)).forEach(x => {
    const t = Date.parse(String(x.week) + "T12:00:00+09:00"); const r = !isNaN(t) && at(t); if (r) r.quiz++;
  });
  // 참여 경로
  const route = [["인스타그램 팔로우", "follow"], ["TABS 설문 인증", "tabs"], ["출석 보너스", "daily:"], ["퀴즈", null], ["프로그램 신청", "apply:"], ["활동 완료", "done:"],
                 ["이벤트 코드", "event:"], ["기간 설문", "survey:"], ["친구 추천으로 가입", "ref"]]
    .map(([l, pre]) => [l, pre === null ? k.quizStu : pre === "ref" ? k.ref : S.filter(x => has(x, pre)).length]);
  // 만족도
  const rp = {};
  D.ratings.forEach(r => { const o = rp[r.program] || (rp[r.program] = { n: 0, sum: 0, memo: 0 }); if (r.score) { o.n++; o.sum += r.score; } if (r.memo) o.memo++; });
  // 설문 (퀴즈 '한 마디' + 기간 설문)

  const add = (title, list, def, kind, meta) => {
    const by = {};
    list.forEach(x => { const o = by[x.q] || (by[x.q] = { q: x.q, cnt: {}, etc: [], n: 0 }); o.n++;
      ansSplit(x.answer, def && def.questions.find(z => z.q === x.q)).forEach(v => { o.cnt[v] = (o.cnt[v] || 0) + 1; }); if (x.etc) o.etc.push(x.etc); });
    const qIdx = q => { const i = def ? def.questions.findIndex(z => z.q === q) : -1; return i < 0 ? 99 : i; };
    Object.values(by).sort((a, b) => qIdx(a.q) - qIdx(b.q)).forEach(o => {   // 설정한 문항 순서대로

      (dq ? dq.opts : []).forEach(op => { if (!(op in o.cnt)) o.cnt[op] = 0; });

      cards: g.def && g.def.cards, people: g.people.length,
      // 설문 기간에 처음 가입해서 설문에 답한 학생 (설문 때문에 새로 들어온 인원)
      newbies: g.def && g.def.from ? g.people.filter(pp => { const st = S.find(x => String(x.sid) === String(pp.sid));
        const d = st && st.created ? kstDay(st.created) : ""; return d && d >= g.def.from && d <= (g.def.until || g.def.from); }).length : 0 }));
  add("퀴즈 '한 마디'", D.surveys.filter(x => !pollOf(x)), null, "weekly");
  // ── 더 자세한 항목 ──
  const tiers = TIER_KEYS.map(t => ({ t, word: TIERS[t].word, all: PER_TIER[t], done: S.filter(x => !(x.adm && x.adm.hide) && tierDone(x, t) === PER_TIER[t]).length }));
  const dist = [[0, 0], [1, 5], [6, 10], [11, 15], [16, 20], [21, 25], [26, 26]].map(([lo, hi]) =>
    [lo === hi ? `${lo}종` : `${lo}~${hi}종`, S.filter(x => (x.types || 0) >= lo && (x.types || 0) <= hi).length]);
  const own = {};
  S.forEach(x => Object.keys(x.owned || {}).forEach(id => { if (x.owned[id] > 0) own[id] = (own[id] || 0) + 1; }));
  const avgTypes = S.length ? (S.reduce((a, x) => a + (x.types || 0), 0) / S.length).toFixed(1) : "0";
  const full = S.filter(x => (x.types || 0) >= TOTAL_CARDS).length;
  // 인증 항목별 검토 결과
  const keys = [["follow", "인스타그램 팔로우"], ["tabs", "TABS 설문"]].concat(
    PROGRAMS.map(p => ["apply:" + p.id, p.name + " · 신청"]), PROGRAMS.map(p => ["done:" + p.id, p.name + " · 완료"]));
  const pr = keys.map(([key, label]) => {
    const l = D.proofs.filter(p => p.key === key);
    return { label, n: l.length, ok: l.filter(p => p.status === "ok").length, wait: l.filter(p => p.status === "wait").length, no: l.filter(p => p.status === "no").length };
  }).filter(r => r.n);
  // 이벤트 코드·현장 QR
  const evName = {};

  (D.events || []).forEach(e => { evName[String(e.code).toUpperCase()] = e.label + " (현장 QR)"; });
  const evc = {};
  S.forEach(x => Object.keys(x.claims || {}).forEach(c => { if (c.indexOf("event:") === 0) { const k2 = c.slice(6); evc[k2] = (evc[k2] || 0) + 1; } }));
  const evs = Object.keys(evc).map(c => [evName[c] || c, evc[c]]).sort((a, b) => b[1] - a[1]);
  // 부스 이벤트(TABS)
  const tabsP = D.proofs.filter(p => p.key === "tabs"), dayT = Date.parse("2026-11-10T00:00:00+09:00");
  const gifts = it => S.filter(x => x.adm && x.adm.gifts && x.adm.gifts[it]).length;

                  quiz: Math.max(stockUsed(KEYRING), BOOTH_FINAL[KEYRING] || 0),

function hbars(rows, color, opt) {     // rows: [[label, n, pctBase]]  opt.top: 1위 강조

/* 주차별 막대 하나짜리 작은 차트 (합계·가장 많았던 주 표시) */
function miniChart(weeks, key, title, color) {
  const W = 300, H = 120, P = { l: 6, r: 6, t: 16, b: 18 };
  const vals = weeks.map(w => w[key] || 0), max = Math.max(1, ...vals), sum = vals.reduce((a, b) => a + b, 0);
  const n = weeks.length, gx = (W - P.l - P.r) / Math.max(1, n), bw = Math.max(4, Math.min(20, gx * 0.62));
  const pk = vals.indexOf(Math.max(...vals));
  const step = n > 10 ? 3 : n > 6 ? 2 : 1;
  let g = `<line x1="${P.l}" x2="${W - P.r}" y1="${H - P.b}" y2="${H - P.b}" stroke="#D5DBE6"/>`;
  weeks.forEach((w, i) => {
    const v = vals[i], h = (H - P.t - P.b) * v / max, x = P.l + gx * i + (gx - bw) / 2, cx = x + bw / 2;
    g += `<rect x="${x.toFixed(1)}" y="${(H - P.b - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${color}" opacity="${i === pk ? 1 : .45}"/>`;
    if (i === pk && v) g += `<text x="${cx.toFixed(1)}" y="${(H - P.b - h - 4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#0F1F3D">${v}</text>`;
    if (i % step === 0 || i === n - 1) g += `<text x="${cx.toFixed(1)}" y="${H - 5}" text-anchor="middle" font-size="9" fill="#7A8599">${wkLabel(w.w)}</text>`;
  });
  return `<div class="rmc"><div class="rmch"><span>${title}</span><b>${KO(sum)}</b></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)} 주차별">${g}</svg>
    <div class="rmcf">가장 많았던 주: ${vals[pk] ? wkLabel(weeks[pk].w) + " 주 (" + vals[pk] + ")" : "-"}</div></div>`;
}
