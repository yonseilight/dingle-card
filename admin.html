  const sumP = f => r.prog.reduce((a, p) => a + p[f], 0);
  const convAll = PCT(sumP("both"), sumP("apply"));
  const bestProg = r.prog.slice().sort((a, b) => b.apply - a.apply)[0];
  const convProg = r.prog.filter(p => p.apply >= 3).sort((a, b) => b.conv - a.conv)[0];
  const hasBooth = !!(r.booth.tabs || r.booth.quiz);
  const tbl = (head, rows, sum, cls) => `<table class="rt ${cls || ""}"><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(rw => `<tr>${rw.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}${sum ? `<tr class="sum">${sum.map(c => `<td>${c}</td>`).join("")}</tr>` : ""}</tbody></table>`;
  const chap = (no, title, lead, inner, brk) => `<div class="rsec${brk ? " rbrk" : ""}">
    <div class="rch"><span>${no}</span><h2>${title}</h2></div>${lead ? `<p class="rlead">${lead}</p>` : ""}${inner}</div>`;
  const blk = (title, inner, note) => `<div class="rblk">${title ? `<h3>${title}</h3>` : ""}${inner}${note ? `<p class="rn">${note}</p>` : ""}</div>`;
  const tile = (l, v, sm, cls) => `<div class="${cls || ""}"><span>${l}</span><b>${v}</b>${sm ? `<small>${sm}</small>` : ""}</div>`;
  const rate = p => { const o = r.rp[p.name]; return o && o.n ? `${(o.sum / o.n).toFixed(1)} <small>(${o.n})</small>` : "-"; };
  const convBar = (v, on) => on ? `<span class="rcv"><i style="width:${v}%"></i></span><b>${v}%</b>` : "-";
  const topAns = q => { const o = Object.keys(q.cnt).sort((a, b) => q.cnt[b] - q.cnt[a])[0]; return o && q.cnt[o] ? o : ""; };
  const pollQ = r.qs.find(q => q.kind === "poll" && topAns(q));

  /* ── 요약 ── */
  const funnel = [["참여 학생", k.total], ["인증 1회 이상", k.proofStu], ["프로그램 신청 인증", k.applyStu], ["활동 완료 인증", k.doneStu]];
  const finds = [
    `카드도감에 <b>${KO(k.total)}명</b>이 참여했고, 그중 <b>${KO(k.proofStu)}명(${PCT(k.proofStu, k.total)}%)</b>이 팔로우·TABS·프로그램 인증을 1회 이상 했습니다.`,
    `학습지원 프로그램 <b>신청 인증 ${KO(sumP("apply"))}건</b> 중 <b>${KO(sumP("both"))}건(${convAll}%)</b>이 활동 완료 인증까지 이어졌습니다.${bestProg && bestProg.apply ? ` 신청이 가장 많은 프로그램은 <b>${esc(bestProg.name)}</b>(${bestProg.apply}명)입니다.` : ""}`,
    `퀴즈 참여 <b>${KO(k.quiz)}회</b>(${KO(k.quizStu)}명) · 26종을 모두 모은 학생 <b>${KO(r.full)}명</b> · 1인 평균 보유 ${r.avgTypes}종.`,
    hasBooth ? `더미래페스티벌 부스: TABS 설문 인증 <b>${KO(r.booth.tabs)}명</b>, 학습지원 프로그램 퀴즈 <b>${KO(r.booth.quiz)}명</b> 참여, 전기손난로 ${KO(r.booth.hand)}개 지급.` : "",
    pollQ ? `이벤트 설문 '${esc(pollQ.q)}'에서 가장 많이 고른 답은 <b>${esc(topAns(pollQ))}</b>입니다(응답 ${pollQ.n}명 중 ${pollQ.cnt[topAns(pollQ)]}명).` : "",
  ].filter(Boolean);
  const summary = `<header class="rhd">
      <div class="rk">미래융합교육혁신원 등대팀(Lighthouse Team) 20기</div>
      <h1>딩글이 카드도감 운영 보고서</h1>
      <div class="rm"><span class="rpill ${cl ? "end" : ""}">${cl ? "운영 마감" : "운영 중"}</span>
        운영 기간 ${day(r.firstAt)} ~ ${cl ? day(cl) : day(r.now)} · 집계 ${new Date(r.now).toLocaleString("ko-KR", { dateStyle: "long", timeStyle: "short" })}</div>
    </header>
    <div class="rhero">
      ${tile("참여 학생", KO(k.total) + "<em>명</em>", "최근 7일 신규 " + KO(r.last7) + "명")}
      ${tile("인증 참여", KO(k.proofStu) + "<em>명</em>", "참여 학생의 " + PCT(k.proofStu, k.total) + "%")}
      ${tile("프로그램 신청 인증", KO(k.applyStu) + "<em>명</em>", "참여 학생의 " + PCT(k.applyStu, k.total) + "%")}
      ${tile("활동 완료 인증", KO(k.doneStu) + "<em>명</em>", "신청 → 완료 " + convAll + "%")}
    </div>
    <div class="r2 rtop">
      ${blk("참여 단계", `<div class="rfun">${funnel.map(([l, n], i) => `<div class="rfr"><span class="rfl">${l}</span>
          <span class="rft"><i style="width:${Math.max(n ? 3 : 0, PCT(n, k.total))}%;opacity:${1 - i * .18}"></i></span>
          <span class="rfn">${KO(n)}명<small>${PCT(n, k.total)}%</small></span></div>`).join("")}</div>`,
        "비율은 모두 참여 학생 대비. 인증은 반려되지 않은 것만 셉니다.")}
      ${blk("그 밖의 지표", `<div class="rsub">
        ${tile("퀴즈 참여", KO(k.quiz) + "회", KO(k.quizStu) + "명 참여")}
        ${tile("지급된 카드", KO(k.cards) + "장", "평균 " + r.avgTypes + "종 보유")}
        ${tile("굿즈 교환", KO(k.exDone) + "건", "신청 " + KO(k.exReq) + "건")}
        ${tile("프로그램 만족도", k.rateAvg + (k.rateN ? "<em>/5</em>" : ""), KO(k.rateN) + "건 응답")}</div>`)}
    </div>
    <div class="rsum"><h3>핵심 결과</h3><ol>${finds.map(f => `<li>${f}</li>`).join("")}</ol></div>
    <div class="rtoc">${["학습지원 프로그램 연계", "참여 추이와 경로", "카드 수집과 경품", "설문 결과", "세부 표"]
      .map((t, i) => `<span><b>${i < 4 ? "0" + (i + 1) : "부록"}</b>${t}</span>`).join("")}</div>`;

  /* ── 01 프로그램 ── */
  const ch1 = chap("01", "학습지원 프로그램 연계",
    `신청 인증 ${KO(sumP("apply"))}건 → 활동 완료 인증 ${KO(sumP("done"))}건 · 신청 후 완료 전환율 <b>${convAll}%</b>${convProg ? ` · 전환율이 가장 높은 프로그램 <b>${esc(convProg.name)}</b>(${convProg.conv}%)` : ""}`,
    blk("", tbl(["프로그램", "신청 인증", "활동 완료 인증", "신청 후 완료", "전환율", "만족도"],
        r.prog.map(p => [`<b>${esc(p.name)}</b>`, p.apply + "명", p.done + "명", p.both + "명", convBar(p.conv, p.apply), rate(p)]),
        ["합계", sumP("apply") + "건", sumP("done") + "건", sumP("both") + "건", convBar(convAll, sumP("apply")), k.rateAvg + (k.rateN ? ` <small>(${k.rateN})</small>` : "")], "rprog"),
      "전환율 = 같은 프로그램을 신청 인증한 학생 중 활동 완료까지 인증한 비율. 만족도 = 별점 평균(5점 만점), 괄호는 응답 수. 반려된 인증은 빠집니다."), true);

  /* ── 02 추이·경로 ── */
  const ch2 = chap("02", "참여 추이와 경로", `최근 7일 신규 참여 ${KO(r.last7)}명 · 한 학생이 여러 경로에 참여할 수 있습니다.`,
    blk("주차별 추이", `<div class="r3">${miniChart(r.weeks, "join", "신규 가입", "#2F5BD3")}${miniChart(r.weeks, "proof", "인증 제출", "#E3A008")}${miniChart(r.weeks, "quiz", "퀴즈 '한 마디' 응답", "#18A36B")}</div>`,
      "가로축은 그 주의 월요일 날짜. 진하게 칠한 막대가 가장 많았던 주입니다. 주차별 숫자는 부록 A에 있습니다.") +
    blk("참여 경로별 인원", hbars(r.route.map(([l, n]) => [l, n, k.total]).sort((a, b) => b[1] - a[1]), "#2F5BD3"),
      "오른쪽 %는 참여 학생 대비 비율."));

  /* ── 03 카드·경품 ── */
  const ch3 = chap("03", "카드 수집과 경품",
    `26종 완성 <b>${KO(r.full)}명</b> · 1인 평균 보유 ${r.avgTypes}종 · 굿즈 교환 지급 ${KO(k.exDone)}건`,
    `<div class="r2">${blk("등급별 완성과 굿즈 교환", tbl(["등급", "완성 학생", "교환 신청", "지급 대상", "지급 완료"],
        r.exT.map(t => [`<b class="tg tg${t.t}">${t.t}</b> ${t.word} <small>(${PER_TIER[t.t]}종)</small>`, `${t.ready}명 <small>${PCT(t.ready, k.total)}%</small>`, t.req + "건", t.give + "건", t.done + "건"])),
        "완성 = 그 등급 카드를 종류별로 모두 가진 학생(순위 제외 학생 빼고). 굿즈는 학생별 1개이고, 아직 안 받은 신청은 완성한 가장 높은 등급으로 자동 상향해 지급 대상에 셉니다.")}
      ${blk("보유 종수 분포", hbars(r.dist.map(([l, n]) => [l, n, k.total]), "#E3A008"))}</div>` +
    (hasBooth ? blk("더미래페스티벌 부스 이벤트 (11월 10일)", `<div class="rsub r3b">
        ${tile("TABS 설문 인증", KO(r.booth.tabs) + "명", "사전 " + r.booth.pre + "명 · 당일 이후 " + (r.booth.tabs - r.booth.pre) + "명")}
        ${tile("프로그램 퀴즈 참여", KO(r.booth.quiz) + "명", "인형 키링 " + r.booth.quiz + "개" + (r.booth.keyT && r.booth.quiz >= r.booth.keyT ? " · 준비 수량 전부 소진" : ""))}
        ${tile("전기손난로 지급", KO(r.booth.hand) + "개", r.booth.handT && r.booth.hand >= r.booth.handT ? "준비 " + r.booth.handT + "개 전부 소진" : r.booth.handT ? "준비 " + r.booth.handT + "개" : "TABS 사전 인증자")}
</div>`,
        "사전 인증 = 부스 운영일(11월 10일) 0시 전에 TABS 인증을 마친 학생.") : "") +
    blk("순위 상위 10명", `<div class="rtop10">${tbl(["순위", "이름", "보유", "26종 완성일"],
        r.top.slice(0, 5).map(x => [x.r, x.name, x.types + "종", x.done ? new Date(x.done).toLocaleDateString("ko-KR") : "-"]))}${
        r.top.length > 5 ? tbl(["순위", "이름", "보유", "26종 완성일"], r.top.slice(5).map(x => [x.r, x.name, x.types + "종", x.done ? new Date(x.done).toLocaleDateString("ko-KR") : "-"])) : ""}</div>`,
      "순위는 보유 종류 수 → 26종을 먼저 모은 순. 순위에서 제외한 학생은 빠지고, 이름은 가운데를 가렸습니다."), true);

  /* ── 04 설문 ── */
  const qhtml = q => {
    const opts = Object.keys(q.cnt).sort((a, b) => q.cnt[b] - q.cnt[a]);
    const picked = q.multi ? q.n : opts.reduce((a, o) => a + q.cnt[o], 0);   // 여러 개 선택은 응답한 학생 대비
    return `<div class="rq"><h4>${esc(q.q)}</h4>
      <div class="rqm">응답 ${q.n}명${q.multi ? " · 복수 응답(비율은 응답한 학생 대비)" : ""}${q.when ? ` · ${q.when.n}번에서 '${esc(q.when.is)}'를 고른 학생만` : ""}${q.etc.length ? ` · 직접 입력 ${q.etc.length}명` : ""}</div>
      ${hbars(opts.map(o => [o, q.cnt[o], picked]), q.kind === "poll" ? "#E3A008" : "#18A36B", { top: true })}
      ${q.etc.length ? `<div class="retc"><b>직접 입력</b> ${q.etc.slice(0, 6).map(t => `<span>${esc(t)}</span>`).join("")}${q.etc.length > 6 ? ` <em>외 ${q.etc.length - 6}건</em>` : ""}</div>` : ""}
    </div>`; };
  const polls = r.qs.filter(q => q.kind === "poll"), weekly = r.qs.filter(q => q.kind !== "poll");
  const byPoll = {};
  polls.forEach(q => { const id = q.meta ? q.meta.id : q.group; (byPoll[id] = byPoll[id] || { meta: q.meta, list: [] }).list.push(q); });
  const md = ymd => { if (!ymd) return ""; const d = new Date(ymd + "T00:00:00+09:00"); return (d.getMonth() + 1) + "월 " + d.getDate() + "일"; };
  const ch4 = chap("04", "설문 결과", `막대 옆 %는 그 문항에서 보기를 고른 학생 대비 비율이고, 가장 많이 고른 답을 진하게 표시했습니다.`,
    blk("이벤트 설문", Object.keys(byPoll).length ? Object.values(byPoll).map(g => `
      <div class="rpg"><div class="rpgh"><b>${esc(g.meta ? g.meta.title : "이벤트 설문")}</b>
        <span>${g.meta && g.meta.from ? md(g.meta.from) + (g.meta.until && g.meta.until !== g.meta.from ? " ~ " + md(g.meta.until) : "") + " · " : ""}참여 ${g.meta ? g.meta.people : "-"}명${g.meta && g.meta.newbies ? ` (그 기간 첫 참여 ${g.meta.newbies}명)` : ""}${g.meta && g.meta.cards ? " · 참여 보상 카드 " + g.meta.cards + "장" : ""}</span></div>
        <div class="rqg">${g.list.map(qhtml).join("")}</div></div>`).join("") : `<p class="rn">진행한 이벤트 설문이 없습니다.</p>`,
      "카드 얻기 화면에서 기간을 정해 연 설문(참여하면 카드 지급). 학생 1명당 1회 응답.") +
    blk("퀴즈 '한 마디'", weekly.length ? `<div class="rqg">${weekly.map(qhtml).join("")}</div>` : `<p class="rn">아직 퀴즈 설문 응답이 없습니다.</p>`,
      "퀴즈(11월 19일까지 주 1회, 11월 20일부터 3일에 1회)를 푼 뒤 받는 한 문항 설문. 학생마다 참여 순서대로 다른 문항이 나오므로 문항별 응답 수가 다릅니다."), true);

  /* ── 부록 ── */
  const cardGrid = TIER_KEYS.map(t => `<div class="cg"><div class="cgh"><b class="tg tg${t}">${t}</b> ${TIERS[t].word}</div><div class="cgr">${
    Array.from({ length: PER_TIER[t] }, (_, i) => { const id = t + (i + 1), n = r.own[id] || 0, pc = PCT(n, k.total);
      return `<div class="cgc" title="${id}"><span>${pc}%</span><i style="height:${Math.max(3, pc * .6)}px"></i><b>${id}</b></div>`; }).join("")}</div></div>`).join("");
  const app = chap("부록", "세부 표", "",
    blk("A. 주차별 참여", tbl(["주차 (월요일)", "신규 가입", "누적 참여 학생", "인증 제출", "퀴즈 '한 마디' 응답"],
        r.weeks.map(w => [wkLabel(w.w) + " 주", w.join, w.cum, w.proof, w.quiz]), null, "rnum"),
      "인증 제출은 항목별 마지막 제출 시각 기준(재인증하면 새 주차로 셉니다).") +
    (r.pr.length ? blk("B. 인증 항목별 검토 결과", tbl(["인증 항목", "제출", "승인", "검토 전", "반려", "반려율"],
        r.pr.map(x => [esc(x.label), x.n, x.ok, x.wait, x.no, PCT(x.no, x.n) + "%"]),
        ["합계", ...["n", "ok", "wait", "no"].map(f => r.pr.reduce((a, x) => a + x[f], 0)),
         PCT(r.pr.reduce((a, x) => a + x.no, 0), r.pr.reduce((a, x) => a + x.n, 0)) + "%"], "rnum")) : "") +
    blk("C. 카드별 보유 학생 비율", `<div class="cgs">${cardGrid}</div>`,
      "숫자 = 그 카드를 1장 이상 가진 학생 비율. 뽑기 확률은 C 50% · B 30% · A 15% · S 5%이며, 한 등급을 모두 3장씩 모으면 그 등급 확률이 남은 등급에 나뉩니다."), true);

  return `<article class="rep" id="report"><table class="rpage"><thead><tr><td><div class="rrh"><span>딩글이 카드도감 운영 보고서</span><span>등대팀 20기 · ${new Date(r.now).toLocaleDateString("ko-KR")} 집계</span></div></td></tr></thead>
    <tfoot><tr><td><div class="rrf"></div></td></tr></tfoot><tbody><tr><td class="rbody">
    ${summary}${ch1}${ch2}${ch3}${ch4}${app}
    <div class="rf">딩글이 카드도감 관리자 페이지에서 자동 생성 · 인증 수치는 카드도감에 올린 캡처 기준</div>
    </td></tr></tbody></table></article>`;
}

/* ───────── 최종 결과보고서 (상위기관 제출용) ─────────
   마감하면 보고서 탭이 이 화면으로 열린다. 숫자는 데이터에서, 글(목적·추진 경과·개선 방향 등)은
   기본 문안을 채워 두고 화면 위 편집 칸에서 고칠 수 있다(이 컴퓨터에 저장, 인쇄에는 편집 칸이 나오지 않음). */
const EVENT_START = "2026-09-23";
const EVENT_URL = "https://yonseilight.github.io/dingle-card/";
const FR_KEY = "dingle:finalRep";
const progShort = n => String(n).split("(")[0].trim();
function frDate(t) { const d = new Date(t); return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.(${"일월화수목금토"[d.getDay()]})`; }
function frYmd(ymd) { return frDate(new Date(ymd + "T12:00:00+09:00")); }
function frDefaults() {
  const r = reportData(), cl = Number(D.meta.closed) || 0;
  const progs = PROGRAMS.map(p => progShort(p.name)).join("·");
  // 추진 경과: [날짜, 문장] → 날짜 순 (같은 날이면 적은 순서대로), 마감은 맨 끝

/* 설문 한 문항 → 가로 막대 */
function qBars(q, color) {
  const opts = Object.keys(q.cnt).sort((a, b) => q.cnt[b] - q.cnt[a]);
  const tot = q.multi ? q.n : opts.reduce((a, o) => a + q.cnt[o], 0);
  return `<div class="fq"><h4>${esc(q.q)} <small>(응답 ${q.n}명${q.multi ? " · 복수 응답" : ""})</small></h4>
    ${q.when ? `<p class="fnote" style="margin:0 0 2px">${q.when.n}번에서 '${esc(q.when.is)}'를 고른 학생만 답함</p>` : ""}
    ${hbarList(opts.map(o => [o, q.cnt[o]]), tot, color)}
    ${q.etc.length ? `<p class="fnote">직접 입력: ${q.etc.slice(0, 6).map(esc).join(" · ")}${q.etc.length > 6 ? ` 외 ${q.etc.length - 6}건` : ""}</p>` : ""}</div>`;
}

function bindEventEditor(id) {
  app.querySelectorAll("[data-evrep]").forEach(b => b.onclick = () => { V.evId = b.dataset.evrep; render(); });
  $("evred") && ($("evred").ontoggle = e => { V.evOpen = e.currentTarget.open; });
  let tmr = 0;
  const keys = ["name", "place", "desc", "achieve", "improve"];
  const redraw = () => {
    const o = {}; keys.forEach(k => { const el = $("ev_" + k); if (el) o[k] = el.value; }); evSave(id, o);
    clearTimeout(tmr); tmr = setTimeout(() => { const el = $("report"); if (el) el.outerHTML = eventReportHTML(id); }, 250);
  };
  keys.forEach(k => { const el = $("ev_" + k); if (el) el.oninput = redraw; });
  $("ev_reset") && ($("ev_reset").onclick = () => { if (!confirm("고친 글을 지우고 기본 문안으로 되돌릴까요?")) return;

}

/* 통합 보고서: 날짜별 누적 참여 추이 (+ 이벤트 표시) */
function growthChart(endMs) {
  const end = kstYmd(endMs), days = dayRange(EVENT_START, end);
  const marks = [];
  evList().forEach(e => { const i = days.indexOf(e.from); if (i >= 0) marks.push({ i, label: evLoad(e.id).name.split(" (")[0] }); });
  marks.sort((a, b) => a.i - b.i);
  return lineChart({ H: 215, title: "카드도감 참여 학생 누적 추이", sub: `${mdShort(EVENT_START)} ~ ${mdShort(end)} · 날짜별 누적`, days, marks,
    series: [{ name: "누적 참여 학생(명)", vals: cumByDay(days, D.students.map(x => x.created)), color: CH.blue, area: true },
             { name: "누적 인증 건수(반려 제외)", vals: cumByDay(days, D.proofs.filter(p => p.status !== "no").map(p => p.at)), color: CH.gold }] });
}

      <li>학습지원 프로그램 <b>신청 인증 ${KO(sumP("apply"))}건</b>(${KO(k.applyStu)}명), <b>활동 완료 인증 ${KO(sumP("done"))}건</b>(${KO(k.doneStu)}명) — 신청한 학생의 ${convAll}%가 활동 완료까지 인증함.</li>
      <li>프로그램 만족도 평균 <b>${k.rateAvg}${k.rateN ? "점" : ""}</b>(5점 만점, ${KO(k.rateN)}명 응답), 퀴즈 참여 ${KO(k.quiz)}회(${KO(k.quizStu)}명).</li>
      <li>등급 완성 굿즈 <b>${KO(k.exDone)}개 지급</b>${left.length ? `(미수령 ${left.length}건)` : ""}, 26종 전체 수집 ${KO(r.full)}명.</li>
      ${hasBooth ? `<li>더미래페스티벌 부스 이벤트: TABS 설문 인증 ${KO(r.booth.tabs)}명, 학습지원 프로그램 퀴즈 ${KO(r.booth.quiz)}명 참여.</li>` : ""}
    </ol>`;

  /* Ⅰ. 사업 개요 */
  const ways = [
    ["처음 참여(가입)", R.welcome + "장", "-"],
    ["인스타그램 팔로우 인증", R.follow + "장", "10월 27일 전 5장"],
    ["학습지원 프로그램 신청 인증", R.apply + "장", "프로그램별 · 10월 27일 전 5장"],
    ["학습지원 프로그램 활동 완료 인증", R.done + "장", "프로그램별 · 10월 27일 전 7장"],
    ["퀴즈 + 한 문항 설문", R.quiz + "장", "11월 19일까지 주 1회, 11월 20일부터 3일 1회"],
    ["TABS 설문 인증", (R.tabs || 7) + "장", "더미래페스티벌 연계"],
    ["친구 추천", `${R.invited}장 + ${R.referrer}장`, "추천받은 학생 · 추천한 학생"],
    ["출석", "1장/일", "11월 19일 종료"],
    ["이벤트 코드 · 현장 QR · 기간 설문", "회차별", "부스·행사 운영 시"],
  ];
  const s1 = `${H1("Ⅰ", "사업 개요", true)}
    ${H2(1, "목적")}<p class="fp">${esc(f.purpose)}</p>
    ${H2(2, "운영 방법")}
    <p class="fp">학생이 카드도감 웹사이트에 학번·이름으로 참여하고, 아래 활동을 인증하면 딩글이 카드를 받아 26종(C 7 · B 7 · A 7 · S 5)을 수집함. 인증 사진은 등대팀이 검토하여 기준에 맞지 않으면 반려·회수함.</p>
    ${ft(["카드 받는 방법", "지급 카드", "비고"], ways, null, "fway")}
    ${H2(3, "보상 체계")}
    <ul class="fl">
      <li>한 등급의 카드를 모두 모으면 등급 굿즈로 교환 신청 (C 일반 · B 희귀 · A 영웅 · S 전설)</li>
      <li>굿즈는 <b>학생 1명당 1개</b>이며, 완성한 가장 높은 등급으로 지급 (신청 후 더 높은 등급을 완성하면 자동 상향)</li>
      <li>인증 기준에 맞지 않는 방법으로 카드를 받은 경우 경품 지급 대상에서 제외</li>
    </ul>
    ${H2(4, "추진 경과")}
    ${ft(["일자", "내용"], lines(f.timeline).map(l => { const m = l.match(/^(\d{4}\.\s*\d{1,2}\.\s*\d{1,2}\.(?:\([^)]*\))?(?:\s*~\s*[\d.\s()월화수목금토일]+)?)\s+(.*)$/); return m ? [m[1], esc(m[2])] : ["", esc(l)]; }), null, "ftime")}
    ${lines(f.etc).length ? `${H2(5, "기타 운영 사항")}<ul class="fl">${lines(f.etc).map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}`;

  /* Ⅱ. 추진 실적 */
  const funnel = [["참여 학생", k.total], ["인증 1회 이상", k.proofStu], ["프로그램 신청 인증", k.applyStu], ["활동 완료 인증", k.doneStu]];
  const goodsRows = TIER_KEYS.map(t => { const x = r.exT.find(z => z.t === t), pr = Number(f.price[t]) || 0;
    return [`${t} ${TIERS[t].word}`, x.ready + "명", x.done + "개", leftBy(t) + "개", ...(f.showCost ? [pr ? WON(pr) : "-", pr ? WON(pr * x.done) : "-"] : [])]; });
  const goodsSum = ["합계", "-", k.exDone + "개", left.length + "개", ...(f.showCost ? ["", WON(TIER_KEYS.reduce((a, t) => a + (Number(f.price[t]) || 0) * r.exT.find(z => z.t === t).done, 0))] : [])];
  const boothRows = hasBooth ? [["전기손난로 (TABS 사전 인증)", r.booth.hand + "개", f.boothPrice.hand], ["인형 키링 (프로그램 퀴즈)", r.booth.quiz + "개", f.boothPrice.key]] : [];
  const s2 = `${H1("Ⅱ", "추진 실적")}
    ${H2(1, "참여 현황")}
    <figure class="fchart"><figcaption><b>참여 단계별 인원</b><small>참여 학생 대비 비율</small></figcaption>${hbarList(funnel, k.total, CH.blue)}</figure>
    ${note("인증은 반려되지 않은 것만 셈. 한 학생이 여러 인증을 할 수 있음." + r.qs.filter(q => q.kind === "poll" && q.meta && q.meta.newbies).reduce((a, q) => a.some(x => x.id === q.meta.id) ? a : a.concat(q.meta), [])
      .map(m => ` 참여 학생에는 '${m.title}'(${frYmd(m.from)}) 때 처음 들어온 ${m.newbies}명이 포함됨.`).join(""))}
    <div class="r3 fcharts">${miniChart(r.weeks, "join", "주차별 신규 참여", "#2F5BD3")}${miniChart(r.weeks, "proof", "주차별 인증 제출", "#E3A008")}${miniChart(r.weeks, "quiz", "주차별 퀴즈 설문 응답", "#18A36B")}</div>
    ${H2(2, "학습지원 프로그램 연계 실적")}
    ${barChart({ title: "프로그램별 신청·완료 인증", sub: "명", long: true, cats: r.prog.map(p => progShort(p.name)), series: [{ name: "신청 인증", vals: r.prog.map(p => p.apply), color: CH.blue }, { name: "활동 완료 인증", vals: r.prog.map(p => p.done), color: CH.green }] })}
    ${ft(["프로그램", "신청 인증", "활동 완료 인증", "신청 후 완료", "전환율", "만족도(5점)"],
      r.prog.map(p => [esc(progShort(p.name)), p.apply + "명", p.done + "명", p.both + "명", p.apply ? p.conv + "%" : "-", rate(p)]),
      ["합계", sumP("apply") + "건", sumP("done") + "건", sumP("both") + "건", convAll + "%", k.rateN ? `${k.rateAvg} (${k.rateN}명)` : "-"], "fnum")}
    ${note("전환율 = 같은 프로그램을 신청 인증한 학생 중 활동 완료까지 인증한 비율. 인증 수치는 학생이 카드도감에 올린 화면 캡처를 등대팀이 확인한 기준임.")}
    ${H2(3, "굿즈 지급 실적")}
    ${barChart({ title: "등급별 완성 학생과 굿즈 지급", sub: "굿즈는 1인 1개(가장 높은 등급)라 지급 수가 완성 학생보다 적을 수 있음", cats: TIER_KEYS.map(t => t + " " + TIERS[t].word), series: [{ name: "완성 학생", vals: TIER_KEYS.map(t => r.exT.find(z => z.t === t).ready), color: CH.purple }, { name: "지급 완료", vals: TIER_KEYS.map(t => r.exT.find(z => z.t === t).done), color: CH.gold }], H: 200 })}
    ${ft(["등급", "완성 학생", "지급 완료", "미수령", ...(f.showCost ? ["단가(원)", "금액(원)"] : [])], goodsRows, goodsSum, "fnum")}
    ${note("완성 학생 = 그 등급 카드를 모두 모은 학생(인증 기준 미준수로 제외된 학생 제외). 굿즈는 학생 1명당 1개." + (f.showCost ? " 금액 = 지급 완료 × 단가." : ""))}
    ${hasBooth ? `${H2(4, "더미래페스티벌 부스 이벤트 (2026. 11. 10.)")}
      ${ft(["구분", "실적", ...(boothRows.some(b => b[2]) && f.showCost ? ["금액(원)"] : [])],
        [["TABS 설문 인증", r.booth.tabs + "명 (사전 " + r.booth.pre + "명)", ...(boothRows.some(b => b[2]) && f.showCost ? ["-"] : [])],
         ...boothRows.map(b => [b[0] + " 지급", b[1], ...(boothRows.some(z => z[2]) && f.showCost ? [b[2] ? WON(Number(b[2]) * parseInt(b[1], 10)) : "-"] : [])])], null, "fnum")}
      ${note("준비 수량(전기손난로 30개 · 인형 키링 155개)을 모두 지급함.")}` : ""}
    ${evs.length ? `${H2(hasBooth ? 5 : 4, "이벤트별 성과")}
      ${barChart({ title: "이벤트별 참여 인원", sub: "명", long: true, cats: evs.map(e => e.f.name.split(" (")[0]), series: [{ name: "참여 (설문·TABS 인증)", vals: evs.map(e => e.d.n), color: CH.blue }, { name: "처음 참여(가입)", vals: evs.map(e => e.d.newbies), color: CH.gold }], H: 200 })}
      ${ft(["이벤트", "일시", "참여 (설문·인증)", "처음 참여", "참여 학생 변화"], evs.map(e => [esc(e.f.name), e.e.from === e.e.until ? frYmd(e.e.from) : frYmd(e.e.from) + " ~ " + frYmd(e.e.until).replace(/^\d+\. /, ""), KO(e.d.n) + "명", KO(e.d.newbies) + "명", `${KO(e.d.before)} → ${KO(e.d.after)}명 (+${KO(e.d.after - e.d.before)})`]), null, "fnum")}
      ${note("이벤트마다 자세한 결과는 ‘이벤트별 보고서’에 따로 정리함.")}` : ""}`;

  /* Ⅲ. 설문 결과 */
  const qblock = q => { const opts = Object.keys(q.cnt).sort((a, b) => q.cnt[b] - q.cnt[a]); const tot = q.multi ? q.n : opts.reduce((a, o) => a + q.cnt[o], 0);
    return `<div class="fq"><h4>${esc(q.q)} <small>(응답 ${q.n}명${q.multi ? " · 복수 응답" : ""})</small></h4>
      ${q.when ? `<p class="fnote" style="margin:0 0 2px">${q.when.n}번에서 '${esc(q.when.is)}'를 고른 학생만 답함</p>` : ""}
      ${ft(["응답", "인원", "비율"], opts.filter(o => q.cnt[o] > 0).map(o => [esc(o), q.cnt[o] + "명", PCT(q.cnt[o], tot) + "%"]), null, "fnum fsm")}
      ${q.etc.length ? `<p class="fnote">직접 입력: ${q.etc.slice(0, 5).map(esc).join(" · ")}${q.etc.length > 5 ? ` 외 ${q.etc.length - 5}건` : ""}</p>` : ""}</div>`; };
  const polls = r.qs.filter(q => q.kind === "poll"), weekly = r.qs.filter(q => q.kind !== "poll").sort((a, b) => b.n - a.n);
  const s3 = `${H1("Ⅲ", "설문 결과")}
    ${polls.length ? `${H2(1, "기간 설문")}${(() => {
      const groups = []; polls.forEach(q => { const id = q.meta ? q.meta.id : q.group; let g = groups.find(x => x.id === id);
        if (!g) groups.push(g = { id, meta: q.meta, list: [] }); g.list.push(q); });
      groups.sort((a, b) => String(a.meta && a.meta.from || a.id) < String(b.meta && b.meta.from || b.id) ? -1 : 1);
      return groups.map((g, gi) => { const m = g.meta || {};
        return `<h4 class="fh3">${"가나다라마바"[gi] || gi + 1}. ${esc(m.title || "기간 설문")} <small>(${m.from ? frYmd(m.from) + (m.until && m.until !== m.from ? " ~ " + frYmd(m.until).replace(/^\d+\. /, "") : "") + ", " : ""}참여 ${KO(m.people || 0)}명${m.cards ? `, 참여 카드 ${m.cards}장` : ""})</small></h4>
          ${m.newbies ? `<p class="fnote">이 설문 기간에 처음 참여(가입)한 학생 ${KO(m.newbies)}명 포함.</p>` : ""}
          <div class="fqg">${g.list.map(q => qBars(q, CH.blue)).join("")}</div>`; }).join(""); })()}` : ""}
    ${weekly.length ? `${H2(polls.length ? 2 : 1, "퀴즈 참여 후 한 문항 설문")}<div class="fqg">${weekly.map(q => qBars(q, CH.green)).join("")}</div>
      ${note("퀴즈를 푼 학생에게 회차마다 다른 문항을 한 개씩 물었음(응답 선택). 문항별 응답 수가 다름.")}` : ""}`;

  /* Ⅳ. 성과 및 개선 방향 */
  const auto = [
    `학습지원 프로그램 신청 인증 ${KO(sumP("apply"))}건, 활동 완료 인증 ${KO(sumP("done"))}건으로 프로그램 참여를 카드 수집과 연결함.`,
    `참여 학생 ${KO(k.total)}명 중 ${PCT(k.proofStu, k.total)}%가 인증 활동에 참여함.`,
    k.rateN ? `프로그램 만족도 평균 ${k.rateAvg}점(5점 만점, ${KO(k.rateN)}명 응답).` : "",
  ].filter(Boolean);
  const s4 = `${H1("Ⅳ", "성과 및 개선 방향")}
    ${H2(1, "성과")}<ul class="fl">${auto.concat(lines(f.achieve)).map(l => `<li>${esc(l)}</li>`).join("")}</ul>
    ${lines(f.improve).length ? `${H2(2, "개선 방향")}<ul class="fl">${lines(f.improve).map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}`;

  /* 붙임 */
  const ap = `${H1("붙임", "세부 자료", true).replace("<span>붙임.</span>", "<span>붙임</span>")}
    ${H2(1, "주차별 참여 현황")}
    ${ft(["주차 (월요일)", "신규 참여", "누적 참여", "인증 제출", "퀴즈 설문 응답"], r.weeks.map(w => [wkLabel(w.w), w.join, w.cum, w.proof, w.quiz]), null, "fnum fsm")}
    ${r.pr.length ? `${H2(2, "인증 항목별 검토 결과")}
    ${ft(["인증 항목", "제출", "승인", "검토 전", "반려", "반려율"], r.pr.map(x => { const ps = x.label.split(" · "), suf = ps.length > 1 ? ps.pop() : ""; return [esc(progShort(ps.join(" · ")) + (suf ? " · " + suf : "")), x.n, x.ok, x.wait, x.no, PCT(x.no, x.n) + "%"]; }),
      ["합계", ...["n", "ok", "wait", "no"].map(q => r.pr.reduce((a, x) => a + x[q], 0)), PCT(r.pr.reduce((a, x) => a + x.no, 0), r.pr.reduce((a, x) => a + x.n, 0)) + "%"], "fnum fsm")}` : ""}`;

  return `<article class="rep fin" id="report"><table class="rpage"><thead><tr><td><div class="rrh"><span>「딩글이 카드도감」 최종 통합 결과보고서</span><span>미래융합교육혁신원 등대팀 20기</span></div></td></tr></thead>
    <tfoot><tr><td><div class="rrf"></div></td></tr></tfoot><tbody><tr><td class="rbody">
    ${cover}${s1}${s2}${s3}${s4}${ap}
    <div class="fend">— 끝 —</div>
    </td></tr></tbody></table></article>`;
}

function frEditorHTML() {

  const inp = (id, label, v, hint) => `<label class="fre"><span>${label}${hint ? ` <i>${hint}</i>` : ""}</span><input id="fr_${id}" value="${esc(v)}"></label>`;
  return `<div class="panel">
    <div class="ph"><h2>최종 결과보고서</h2>
      <span class="sub">${cl ? `${when(cl)} 마감 기준 · 숫자는 자동, 아래 글은 고칠 수 있습니다` : `<b style="color:var(--beam)">미리보기</b> — 아직 마감 전이라 숫자가 바뀔 수 있습니다`}</span>
      <div class="right"><button class="btn sm" id="repprint">인쇄 · PDF로 저장</button><button class="btn gh sm" id="rephtml">HTML로 저장</button></div></div>
    <div class="pb">
      <details class="fred" ${V.frOpen ? "open" : ""} id="fred"><summary>보고서 글 고치기 (작성 주체·목적·추진 경과·개선 방향·단가)</summary>
        <div class="fregrid">
          ${inp("author", "운영 주체", f.author)}
          ${inp("target", "참여 대상", f.target)}
          ${ta("purpose", "목적", f.purpose, 3)}
          ${ta("timeline", "추진 경과", f.timeline, 6, "한 줄에 하나 · '2026. 11. 10.(화) 내용' 형식")}
          ${ta("improve", "개선 방향", f.improve, 4, "한 줄에 하나 · 데이터로 자동 작성한 초안")}
          ${ta("achieve", "성과 (추가)", f.achieve, 3, "자동 성과 아래에 붙습니다 · 비워 두면 자동 성과만")}

            <div class="frm">${TIER_KEYS.map(t => `<label class="note">${t} <input id="fr_p${t}" type="number" min="0" step="100" value="${esc(f.price[t])}" style="width:90px"></label>`).join("")}
              <label class="note">손난로 <input id="fr_bh" type="number" min="0" step="100" value="${esc(f.boothPrice.hand)}" style="width:90px"></label>
              <label class="note">키링 <input id="fr_bk" type="number" min="0" step="100" value="${esc(f.boothPrice.key)}" style="width:90px"></label>
              <label class="note"><input id="fr_cost" type="checkbox" ${f.showCost ? "checked" : ""}> 금액 넣기</label></div></div>
        </div>
        <div class="frm" style="margin-top:8px"><button class="btn gh sm" id="fr_reset">기본 문안으로 되돌리기</button><span class="note">이 컴퓨터에 자동 저장됩니다</span></div>
      </details>
    </div></div>`;

function bindFinalEditor() {
  const ids = ["author", "target", "purpose", "timeline", "improve", "achieve", "etc"];
  const read = () => {
    const o = frLoad();
    ids.forEach(i => { const el = $("fr_" + i); if (el) o[i] = el.value; });
    TIER_KEYS.forEach(t => { const el = $("fr_p" + t); if (el) o.price[t] = el.value === "" ? "" : Number(el.value); });
    if ($("fr_bh")) o.boothPrice.hand = $("fr_bh").value; if ($("fr_bk")) o.boothPrice.key = $("fr_bk").value;
    if ($("fr_cost")) o.showCost = $("fr_cost").checked;
    return o;
  };
  let tmr = 0;
  const changed = o => { const d = frDefaults(), out = {};
    Object.keys(o).forEach(k => { if (JSON.stringify(o[k]) !== JSON.stringify(d[k])) out[k] = o[k]; }); return out; };
  const redraw = () => { frSave(changed(read())); clearTimeout(tmr); tmr = setTimeout(() => { const el = $("report"); if (el) el.outerHTML = finalReportHTML(); }, 250); };
  app.querySelectorAll("[id^=fr_]").forEach(el => { if (el.id !== "fr_reset") { el.oninput = redraw; el.onchange = redraw; } });
  $("fred") && ($("fred").ontoggle = e => { V.frOpen = e.currentTarget.open; });
  $("fr_reset") && ($("fr_reset").onclick = () => { if (!confirm("고친 글을 지우고 기본 문안으로 되돌릴까요?")) return; try { localStorage.removeItem(FR_KEY); } catch (e) {} render(); });
}

      <body>${$("report").outerHTML}</body></html>`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
    a.download = fname() + ".html";
    document.body.appendChild(a); a.click(); a.remove();
  });
}

/* ── 만족도 ── */
function viewRating() {
  const byP = {};
  D.ratings.forEach(r => {
    const k = r.program || "기타";
    if (!byP[k]) byP[k] = { n: 0, sum: 0, cnt: 0, memos: [] };
    byP[k].n++;
    if (r.score) { byP[k].sum += r.score; byP[k].cnt++; }
    if (r.memo) byP[k].memos.push({ name: r.name, t: r.memo, s: r.score });
  });
  const keys = Object.keys(byP).sort((a, b) => (byP[b].cnt ? byP[b].sum / byP[b].cnt : 0) - (byP[a].cnt ? byP[a].sum / byP[a].cnt : 0));

  return shell(`
    <div class="panel">
      <div class="ph"><h2>프로그램 만족도</h2>
        <span class="sub">활동 완료 인증 시 받은 응답 ${D.ratings.length}건</span>
        <div class="right"><button class="btn gh sm" id="csvrt">CSV 내려받기</button></div>
      </div>
      <div class="pb">
        ${keys.length ? keys.map(k => {
          const g = byP[k];
          const avg = g.cnt ? (g.sum / g.cnt) : 0;
          return `<div class="qcard">
            <h3>${esc(k)}</h3>
            <div class="meta">응답 ${g.n}건 · 별점 ${g.cnt}건</div>
            <div class="row">
              <div class="lb" style="color:var(--beam);font-weight:800;font-size:17px">
                ${g.cnt ? avg.toFixed(1) : "-"}<span style="font-size:12px;color:var(--mist);font-weight:400"> / 5</span></div>
              <div class="bar"><i style="width:${avg / 5 * 100}%;background:var(--beam)"></i></div>
              <div class="n">${"★".repeat(Math.round(avg))}</div>
            </div>
            ${g.memos.length ? `<div class="memos">
              ${g.memos.slice(0, 20).map(m => `<div class="memo">
                <b>${esc(m.name)}${m.s ? " · " + "★".repeat(m.s) : ""}</b><br>${esc(m.t)}</div>`).join("")}
              ${g.memos.length > 20 ? `<div class="note">외 ${g.memos.length - 20}건</div>` : ""}
            </div>` : ""}
          </div>`;
        }).join("") : `<div class="empty">아직 만족도 응답이 없습니다.<br>학생이 활동 완료를 인증하면 이곳에 쌓입니다.</div>`}
      </div>
    </div>`);
}

/* ── 추천 ── */
function viewReferral() {
  const byRef = {};
  D.students.forEach(s => {
    if (!s.ref) return;
    if (!byRef[s.ref]) byRef[s.ref] = [];
    byRef[s.ref].push(s);
  });
  const nameOf = sid => {
    const f = D.students.find(x => String(x.sid) === String(sid));
    return f ? f.name : "(미가입)";
  };
  const joined = s => Object.keys(s.claims || {}).some(k => k.indexOf("apply:") === 0 || k.indexOf("done:") === 0);

  const rows = Object.keys(byRef)
    .map(sid => ({ sid, name: nameOf(sid), list: byRef[sid] }))
    .sort((a, b) => b.list.length - a.list.length);

  const invited = D.students.filter(s => s.ref).length;
  const active = D.students.filter(s => s.ref && joined(s)).length;
  const rate = invited ? Math.round(active / invited * 100) : 0;

  return shell(`
    <div class="cards">
      <div class="kpi"><div class="l">추천으로 가입</div><div class="v">${invited}</div>
        <div class="s">전체 ${D.students.length}명 중</div></div>
      <div class="kpi"><div class="l">추천한 학생</div><div class="v">${rows.length}</div>
        <div class="s">1명 이상 데려온 학생</div></div>
      <div class="kpi ${rate >= 50 ? "hl" : ""}"><div class="l">실제 참여 전환</div><div class="v">${rate}%</div>
        <div class="s">추천 가입자 중 프로그램 인증 ${active}명</div></div>
    </div>

    <div class="panel">
      <div class="ph"><h2>추천 현황</h2>
        <span class="sub">추천한 학생과 데려온 친구</span>
        <div class="right"><button class="btn gh sm" id="csvref">CSV 내려받기</button></div>
      </div>
      <div class="pb flush"><div class="scroll">

          <tbody>
            ${rows.length ? rows.map(r => `<tr>
              <td>${esc(r.name)}</td>

            </tr>`).join("") : `<tr><td colspan="4"><div class="empty">아직 추천 기록이 없습니다.</div></td></tr>`}
          </tbody>
        </table>

/* 학생 한 명의 상세 — 오른쪽에서 열리는 창 */
function openStudent(sid) {
  const st = D.students.find(x => String(x.sid) === String(sid));
  if (!st) return;
  closeStudent();
  const owned = st.owned || {};
  const byTier = TIER_KEYS.map(t => {
    const ids = Object.keys(owned).filter(k => k[0] === t && owned[k] > 0).sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));
    return `<div style="margin-bottom:8px"><span class="chip ${t}">${t} ${TIERS[t].word} ${ids.length}/${PER_TIER[t]}</span>
      <div class="owned" style="margin-top:6px">${ids.map(k => `<span>${k}<b>×${owned[k]}</b></span>`).join("") || '<span style="color:var(--dim)">없음</span>'}</div></div>`;
  }).join("");
  const proofs = D.proofs.filter(p => String(p.sid) === String(sid));
  const ex = (D.exchanges || []).filter(x => String(x.sid) === String(sid));
  const gr = D.grants.filter(g => String(g.sid) === String(sid));

}
function closeStudent() { const d = $("drawer"); if (d) d.remove(); }

/* ── 부정 참여 조치 (허위 인증 등) ──
   서버가 학생 기록에 직접 적용하고, 학생 폰에 남은 옛 기록으로 저장해도 다시 적용하므로 되살아나지 않는다. */
const OP_LABEL = { hide: "순위 제외", unhide: "순위 복구", revoke: "인증 반려 회수", take: "카드 골라서 회수", give: "반려 취소(돌려줌)",

function logText(e) {

  const key = String(e.key || "");
  if (key.indexOf("daily:") === 0) return `카드 ${e.n}장 받음 · 출석 (${esc(key.slice(6))})`;
  const what = key === "welcome" ? "시작 카드" : key === "invited" ? "추천인 입력" : key === "server" ? "추천·등대팀 지급"
    : key.indexOf("quiz:") === 0 ? "퀴즈" : key.indexOf("event:") === 0 ? "이벤트 코드 " + esc(key.slice(6))
    : key.indexOf("survey:") === 0 ? "기간 설문" : key === "follow" || key.indexOf(":") > 0 ? proofLabel(key) + " 인증" : esc(key);

}
function sanctionHTML(st, proofs) {

  const ops = (adm.ops || []).slice().reverse();
  const revoked = k => !(st.claims || {})[k];      // 회수하면 인증 인정이 풀린다 → 재인증 대기

  const owned = st.owned || {};
  const ids = Object.keys(owned).filter(k => owned[k] > 0)

      <p class="note">${adm.hide ? `순위 화면에서 빠져 있습니다${adm.hideReason ? " · " + esc(adm.hideReason) : ""}. 학생 본인 화면에는 '집계 제외 · 사유'로 보입니다.`

      ${rejected.length ? rejected.map(p => `<div class="srow"><span>${proofLabel(p.key)} <span class="chip no">반려</span></span>
          ${revoked(p.key) ? `<span class="note">회수함 · 재인증 대기</span>`
            : `<button class="btn sm danger" data-rv="${esc(p.key)}">이 인증으로 받은 카드 회수</button>`}</div>`).join("")
        : `<p class="note">반려된 인증이 없습니다. 인증 검토 탭에서 반려하면 여기에 나옵니다.</p>`}

    </div>

          <input type="number" min="0" max="${owned[k]}" value="0" data-pk="${k}" inputmode="numeric"></label>`).join("")}</div>`

          <input id="spend" type="number" min="0" max="${st.pending}" value="0" style="width:72px" inputmode="numeric">장</label>

      ${log && log.length ? `<div class="logs">${log.map(e => `<div class="lr ${e.r ? "rv" : ""}">
          <span class="lt">${when(e.t)}</span><span class="lx">${logText(e)}${e.r ? ` <span class="note">· 되돌림</span>` : ""}</span>
          ${e.r ? "" : `<button class="lnk" data-rb="${e.t}">이 시점부터 되돌리기</button>`}</div>`).join("")}</div>
          <p class="note">고른 시점과 그 이후에 받은 카드·뽑은 카드를 모두 되돌립니다. (인증·퀴즈 참여 기록은 남습니다)</p>`
        : `<p class="note">획득 기록이 없습니다. 이 기능이 생기기 전에 참여한 학생은 '카드 골라서 회수'나 '전부 회수'를 써 주세요.</p>`}

      <div class="frm"><input id="wconf" placeholder="확인을 위해 학번 입력" inputmode="numeric">

          o.type === "give" ? " 미개봉 " + (o.pending || 0) + "장"
          : o.cards ? " · 뽑은 카드 " + Object.values(o.cards).reduce((a, b) => a + b, 0) + "장" + (o.pending ? " + 미개봉 " + o.pending + "장" : "") : ""}${o.reason ? " · " + esc(o.reason) : ""}</div>`).join("")}</div>` : ""}
  </div>`;
}
async function sanction(st, body, btn) {
  if (!api) { toast("서버에 연결된 상태에서만 쓸 수 있습니다"); return false; }
  const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try {
    const j = await adminPost(Object.assign({ action: "sanction", sid: st.sid }, body));
    st.adm = j.adm;
    if (j.student) Object.assign(st, j.student);
    D.grants.unshift({ at: Date.now(), sid: String(st.sid), name: st.name, cards: 0,
                       reason: "[조치] " + (OP_LABEL[body.kind] || body.kind) + (body.reason ? " · " + body.reason : "") });
    render(); openStudent(st.sid);
    return true;
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = label; }
    toast(errMsg(err));
    return false;
  }
}
function bindSanction(el, st) {
  const why = () => el.querySelector("#sreason").value.trim();
  const need = () => { const r = why(); if (!r) { toast("사유를 먼저 적어 주세요"); el.querySelector("#sreason").focus(); } return r; };
  el.querySelectorAll("[data-sk]").forEach(b => b.onclick = async () => {
    const r = b.dataset.sk === "hide" ? need() : why();
    if (b.dataset.sk === "hide" && !r) return;
    if (await sanction(st, { kind: b.dataset.sk, reason: r }, b))
      toast(b.dataset.sk === "hide" ? `${st.name} 학생을 순위에서 뺐습니다` : `${st.name} 학생을 순위에 다시 넣었습니다`);
  });
  el.querySelectorAll("[data-rv]").forEach(b => b.onclick = async () => {
    const r = need(); if (!r) return;
    const k = b.dataset.rv, n = rewardFor(st, k);
    if (!confirm(`${st.name} 학생이 '${proofLabel(k)}' 인증으로 받은 카드(그걸로 뽑은 카드 포함)를 회수할까요?`)) return;
    if (await sanction(st, { kind: "revoke", key: k, n, reason: r }, b)) toast("이 인증으로 받은 카드를 회수했습니다");
  });
  const tk = el.querySelector("#stake");
  if (tk) tk.onclick = async () => {
    const cards = {}; let cnt = 0;
    el.querySelectorAll("[data-pk]").forEach(i => {
      const v = Math.max(0, Math.min(Number(i.max) || 0, parseInt(i.value, 10) || 0));
      if (v) { cards[i.dataset.pk] = v; cnt += v; }
    });
    const pend = Math.max(0, Math.min(st.pending || 0, parseInt(el.querySelector("#spend").value, 10) || 0));
    if (!cnt && !pend) return toast("회수할 카드 수를 넣어 주세요");
    const r = need(); if (!r) return;
    if (!confirm(`${st.name} 학생에게서 카드 ${cnt}장${pend ? ", 미개봉 " + pend + "장" : ""}을 회수할까요?`)) return;
    if (await sanction(st, { kind: "take", cards, pending: pend, reason: r }, tk)) toast("고른 카드를 회수했습니다");
  };
  el.querySelectorAll("[data-rb]").forEach(b => b.onclick = async () => {
    const r = need(); if (!r) return;
    const t = Number(b.dataset.rb);
    if (!confirm(`${when(t)} 이후에 받은 카드와 뽑은 카드를 모두 되돌릴까요?`)) return;
    if (await sanction(st, { kind: "rollback", after: t - 1, reason: r }, b)) toast("되돌렸습니다");
  });
  const wp = el.querySelector("#swipe");
  if (wp) wp.onclick = async () => {
    if (el.querySelector("#wconf").value.trim() !== String(st.sid)) return toast("학번을 정확히 입력해야 회수됩니다");
    const r = need(); if (!r) return;
    if (await sanction(st, { kind: "wipe", reason: r }, wp)) toast(`${st.name} 학생의 카드를 모두 회수했습니다`);
  };
}

/* 지급 기록 한 줄의 장수 표시 (회수는 미개봉에서만 빠지므로 실제로 빠진 장수가 다를 수 있다) */
function grantAmt(g) {
  if (!g.cards) return `<span class="minus">조치</span>`;
  const main = `<span class="${g.cards > 0 ? "plus" : "minus"}">${g.cards > 0 ? "+" : ""}${g.cards}</span>`;
  return g.actual != null && g.actual !== g.cards ? `${main} <span class="note">(실제 ${g.actual > 0 ? "+" : ""}${g.actual})</span>` : main;
}
function grantBtns(g) {
  const i = D.grants.indexOf(g);
  return `<span class="gbtn">${g.cards ? `<button class="lnk" data-gc="${i}">취소</button>` : ""}<button class="lnk" data-gd="${i}">기록 삭제</button></span>`;
}
async function grantRowAction(g, kind) {
  if (!api) return toast("서버에 연결된 상태에서만 쓸 수 있습니다");

  if (kind === "delete" && !confirm(`이 ${label} 기록만 지울까요?\n학생의 카드는 바뀌지 않습니다.` + (g.cards ? `\n(카드도 원래대로 돌리려면 [취소]를 누르세요)` : ""))) return;
  if (kind === "cancel" && !confirm(`이 ${label}을 취소할까요?\n이 지급·회수로 바뀐 카드를 원래대로 돌리고 기록을 지웁니다.`)) return;
  const body = { action: kind === "delete" ? "grantDelete" : "grantCancel", sid: g.sid, at: g.at, cards: g.cards, reason: g.reason };
  try {
    let j;
    try { j = await adminPost(body); }
    catch (e) {
      if (!(e && e.message === "need amount")) throw e;
      const r = prompt(`예전 기록이라 이 회수로 실제 몇 장이 빠졌는지 남아 있지 않습니다.\n`
        + `회수는 미개봉 카드에서만 빠지므로 ${Math.abs(g.cards)}장보다 적었을 수 있습니다.\n\n`
        + `${g.cards < 0 ? "돌려줄" : "다시 뺄"} 장수를 적어 주세요. 0을 넣으면 카드는 그대로 두고 기록만 지웁니다.`, "");
      if (r === null) return;
      j = await adminPost(Object.assign(body, { amount: Math.max(0, parseInt(r, 10) || 0) }));
    }
    const sid = g.sid, open = !!$("drawer");
    await load();
    if (open) openStudent(sid);
    toast(kind === "delete" ? "기록을 지웠습니다"
      : j.back ? `취소했습니다 (미개봉 ${j.back > 0 ? "+" : ""}${j.back}장)` : "취소했습니다 (카드 변화 없음)");
  } catch (e) {
    toast(e && e.message === "not found" ? "기록을 찾지 못했습니다. [새로고침] 후 다시 해 주세요" : errMsg(e));
  }

    if (err && err.message === "already gift") { toast("이미 받은 학생입니다 (다른 팀원이 먼저 처리)"); return false; }
    revert(); render(); toast((failMsg || "저장하지 못해 되돌렸습니다") + " — " + errMsg(err)); return false;

}
/* ───────── 인증 승인·반려: 기다리지 않고 바로 다음 인증으로 ─────────
   누르면 화면에서 바로 처리된 것으로 보이고, 서버 저장은 뒤에서 한 건씩 차례대로 한다(같은 학생 기록이 꼬이지 않게).
   저장 중인 건은 새로고침해도 화면에서 그대로 유지하고, 저장이 실패하면 원래 상태로 되돌리고 알려 준다. */
const REV_PEND = new Map();      // "학번|항목" → { status, reason, n(대기 중인 건수) }
let revChain = Promise.resolve();
const revK = (sid, key) => String(sid) + "|" + key;
function revSet(it, st, reason) {
  [it, D.proofs.find(p => String(p.sid) === String(it.sid) && p.key === it.key)].forEach(p => {
    if (p) { p.status = st; p.reason = st === "no" ? reason : ""; } });
}
function revApplyPending() {
  if (!REV_PEND.size) return;
  D.proofs.forEach(p => { const o = REV_PEND.get(revK(p.sid, p.key)); if (o) { p.status = o.status; p.reason = o.status === "no" ? o.reason : ""; } });
}
function revQueue(sid, key, st, reason, onOk, onFail) {
  const k = revK(sid, key), o = REV_PEND.get(k) || { n: 0 };
  REV_PEND.set(k, { status: st, reason, n: o.n + 1 });
  V.inflight++; paintInflight();
  const send = async () => {
    try { return await review(sid, key, st, reason); }
    catch (e) {   // 한 번만 다시 시도 (같은 처리를 두 번 보내도 서버가 이미 처리된 것으로 본다)
      if (st === "wait" || !api) throw e;
      await new Promise(r => setTimeout(r, 1200));
      return await review(sid, key, st, reason);
    }
  };
  revChain = revChain.then(send).then(j => { try { onOk(j); } catch (e) {} }, err => {
    const cur = REV_PEND.get(k);
    if (!cur || cur.n <= 1) onFail(err);   // 같은 인증을 그 뒤에 또 바꿨다면 마지막 것을 따른다
  }).finally(() => {
    const cur = REV_PEND.get(k);
    if (cur) { if (cur.n <= 1) REV_PEND.delete(k); else cur.n--; }
    V.inflight--; paintInflight();

}

/* ───────── 인증 사진 크게 보기 ─────────
   휠·두 손가락으로 확대, 끌어서 이동, 두 번 눌러 확대/맞춤, 90도 회전. 검토 대기면 여기서 바로 승인·반려 */
function openZoom(im, cardIdx) {
  const id = im.getAttribute("data-id") || "";

  const card = document.getElementById("rc" + cardIdx);
  const canAct = !!(card && card.querySelector("[data-ok]"));

  z.className = "zoom zv";
  z.setAttribute("role", "dialog"); z.setAttribute("aria-label", "인증 사진 크게 보기");
  z.innerHTML = `<div class="zstage"><img alt="인증 사진" referrerpolicy="no-referrer" draggable="false"></div>
    <button class="zx" aria-label="닫기">✕</button>
    <div class="zpct"></div>
    <div class="ztools">
      <button data-z="out" aria-label="축소">−</button><button data-z="fit">맞춤</button><button data-z="in" aria-label="확대">+</button><button data-z="rot" aria-label="90도 회전">⟳</button>
      ${canAct ? `<span class="zsep"></span><button data-z="ok" class="y">승인</button><button data-z="no" class="n">반려</button>` : ""}
    </div>`;
  document.body.appendChild(z);
  const stage = z.querySelector(".zstage"), img = z.querySelector("img"), pct = z.querySelector(".zpct");
  img.src = im.currentSrc || im.src;
  if (hi && hi !== img.src) { const pre = new Image(); pre.referrerPolicy = "no-referrer"; pre.onload = () => { img.src = hi; }; pre.src = hi; }
  let s = 1, x = 0, y = 0, r = 0;
  const fitS = () => { // 돌렸을 때도 화면 안에 다 들어오는 배율
    if (r % 180 === 0) return 1;
    const w = img.offsetWidth, h = img.offsetHeight, W = stage.clientWidth - 32, H = stage.clientHeight - 120;
    return w && h ? Math.min(1, W / h, H / w) : 1;
  };
  const paint = () => { img.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
    pct.textContent = Math.round(s / fitS() * 100) + "%"; };
  const clampS = v => Math.max(fitS() * 0.5, Math.min(10, v));
  const zoomAt = (ns, cx, cy) => { // 화면의 (cx,cy) 지점을 고정한 채로 확대
    ns = clampS(ns); const b = stage.getBoundingClientRect();
    const px = cx - b.left - b.width / 2, py = cy - b.top - b.height / 2;
    x = px - (px - x) * ns / s; y = py - (py - y) * ns / s; s = ns; paint(); };
  const center = () => { const b = stage.getBoundingClientRect(); return [b.left + b.width / 2, b.top + b.height / 2]; };
  const fit = () => { s = fitS(); x = 0; y = 0; paint(); };
  const close = () => { z.remove(); document.removeEventListener("keydown", key); };
  const key = e => {
    if (e.key === "Escape") { e.preventDefault(); close(); }

  /* 끌기·두 손가락 확대 (마우스·터치·펜 모두 포인터 이벤트로) */

    stage.classList.add("drag");

      zoomAt(pinch.s * d / pinch.d, mx, my); moved = true;

    }

/* 학생 한 명의 경품 표시를 바로 바꾸고 뒤에서 저장 */

  const log = { at: Date.now(), sid: String(sid), name: st.name || "", cards: 0, reason: "[경품] " + item + (on ? " 지급" : " 지급 취소") };

    () => { src.status = prev.status; src.doneAt = prev.doneAt; }, `${tier}등급 지급 완료를 저장하지 못했습니다`);
}

    .sort((a, b) => (a.at || 0) - (b.at || 0));
}

/* 연락 명단 복사: "이름 연락처 등급" 한 줄씩 (문자 발송용) */

function viewExchange() {
  const ex = (D.exchanges || []).slice();
  const waiting = ex.filter(exWaiting).sort((a, b) => (a.at || 0) - (b.at || 0));
  const paid    = ex.filter(x => x.status === "done").sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const superList = ex.filter(x => x.status === "req" && exSuper(x)).sort((a, b) => (b.at || 0) - (a.at || 0));   // 숨기지 않고 따로 보여 준다

  // 등급은 완성했지만 아직 신청하지 않은 학생
  const notYet = [];
  D.students.forEach(st => {
    const t = TIER_KEYS.slice().reverse().find(k => tierDone(st, k) === PER_TIER[k]);   // 가장 높은 완성 등급
    if (!t) return;
    const top = exTop(st.sid);
    if (top && TIER_I(top.tier) >= TIER_I(t)) return;
    if (top && top.status === "req") return;     // 대기 중인 신청이 있으면 지급할 때 자동으로 높은 등급을 준다
    if (ex.some(x => String(x.sid) === String(st.sid) && x.tier === t && x.status !== "cancel")) return;
    notYet.push({ st, t, low: top ? top.tier : "" });
  });
  /* 준비할 굿즈 수량 (등급별) — 학생 1명당 신청한 등급 중 가장 높은 1개 기준
     지급 완료 + 지급 대기 = 지금 준비할 수량 · 미신청 완성자는 더 신청할 수 있는 최대치.
     순위 제외(제재) 학생은 경품 대상에서 빠지므로 따로 센다 */
  const hidOf = sid => { const st = stuOf(sid); return !!(st && st.adm && st.adm.hide); };
  const prep = TIER_KEYS.map(t => {
    const mine = ex.filter(x => x.tier === t);
    const done = mine.filter(x => x.status === "done").length;
    const pend = ex.filter(x => exWaiting(x) && !exBroken(x) && exEff(x) === t);   // 자동 상향 반영
    const wait = pend.filter(x => !hidOf(x.sid)).length;

    return { t, done, wait, hidW, more, shift, now: done + wait };
  });

      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");

        prep.some(r => r.hidW) ? " 순위 제외 학생의 신청은 수량에서 뺐습니다." : ""}</p></div>

/* ── CSV ── */
function csv(rows, name) {
  const body = rows.map(r => r.map(c => {
    const v = String(c == null ? "" : c);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + body], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + "_" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

/* ── 렌더 ── */
let authed = false;
/* 학생별 '받은 등급' 칸을 교환 시트(지급 완료) 기준으로 맞춘다 — 지급 완료를 누르면 바로 반영 */
function syncExchangedField() {
  if (!api || !Array.isArray(D.exchanges) || !Array.isArray(D.students)) return;
  const by = {};
  D.exchanges.forEach(x => { if (x.status === "done" && x.tier) (by[String(x.sid)] = by[String(x.sid)] || []).push(x.tier); });
  D.students.forEach(st => { st.exchanged = (by[String(st.sid)] || []).filter((t, i, a) => a.indexOf(t) === i).join(","); });
}
function render() {
  syncExchangedField();
  _exTopCache.live = false;   // 그리기 전에 교환 상태가 바뀌었을 수 있으니 한 번은 다시 확인
  if (!authed) { app.innerHTML = viewGate(); return bindGate(); }
  if (V.tab === "review") app.innerHTML = viewReview();
  else if (V.tab === "students") app.innerHTML = viewStudents();
  else if (V.tab === "survey") app.innerHTML = viewSurvey();
  else if (V.tab === "poll") app.innerHTML = viewPoll();
  else if (V.tab === "report") app.innerHTML = viewReport();
  else if (V.tab === "field") app.innerHTML = viewField();
  else if (V.tab === "tabs") { V.tab = "field"; V.fsub = "tabs"; app.innerHTML = viewField(); }
  else if (V.tab === "rating") app.innerHTML = viewRating();
  else if (V.tab === "referral") app.innerHTML = viewReferral();
  else if (V.tab === "exchange") app.innerHTML = viewExchange();
  else if (V.tab === "ops") app.innerHTML = viewOps();
  else app.innerHTML = viewHome();
  bind();
}

function bindGate() {
  const go = $("go");
  go.onclick = async () => {
    const v = ($("code").value || "").trim();
    if (!v) { V.err = "담당자 코드를 입력해 주세요."; return render(); }
    if (api) {
      go.disabled = true; go.innerHTML = '<span class="spin"></span>';
      try {
        const r = await fetch(CONFIG.API_URL + "?action=auth&admin=" + encodeURIComponent(v));
        const j = await r.json();
        if (!j.ok) {
          V.err = j.error === "no admin code" ? NO_CODE_MSG
                : j.error === "unknown action" ? "서버가 예전 버전입니다. apps-script.gs를 새 버전으로 배포한 뒤 다시 들어와 주세요."
                : "코드가 올바르지 않습니다.";
          V.errRaw = j.error || "";
          return render();
        }
      } catch (e) { V.err = "서버에 연결하지 못했습니다."; V.errRaw = String(e && e.message || e); return render(); }
    }
    ADMIN = v; authed = true; V.err = ""; V.errRaw = "";
    await load();
  };
  $("code").onkeydown = e => { if (e.key === "Enter") go.click(); };
  setTimeout(() => $("code") && $("code").focus(), 40);
  checkServer();
}

function bindOps() {

    if (r.trim() !== "마감") return toast("'마감'이라고 정확히 입력해야 마감됩니다");

      V.tab = "report"; V.repMode = "final"; render(); window.scrollTo(0, 0);   // 마감 → 최종 결과보고서

  });

/* 인증 검토 단축키: 글자 입력 중이 아닐 때 A=맨 위 카드 승인, R=맨 위 카드 반려 */
document.addEventListener("keydown", e => {
  if (!authed || V.tab !== "review" || e.ctrlKey || e.metaKey || e.altKey) return;
  const ae = document.activeElement;
  if (ae && ae.matches && ae.matches("input,textarea,select") || document.querySelector(".rsn,.qrfull,#drawer,.zoom")) return;
  const k = e.key.toLowerCase();
  const sel = k === "a" ? "[data-ok]" : k === "r" ? "[data-no]" : "";
  if (!sel) return;
  const b = app.querySelector(sel + ":not([disabled])");
  if (b) { e.preventDefault(); b.click(); }
});

function bind() {
  bindOps();
  bindField();
  bindTabsCtl();
  bindStock();
  $("susopen") && ($("susopen").onclick = () => { V.susOpen = !V.susOpen; render(); });
  bindTabs();
  if (typeof bindReport === "function") bindReport();
  app.querySelectorAll("[data-tab]").forEach(el => el.onclick = () => { V.tab = el.dataset.tab; render(); });
  $("reload") && ($("reload").onclick = () => load());

  // 검토
  $("rf") && ($("rf").onchange = e => { V.revFilter = e.target.value; render(); });
  const list = D.proofs.filter(p => V.revFilter === "all" ? true : p.status === V.revFilter)
                       .sort((a, b) => (a.at || 0) - (b.at || 0));
  app.querySelectorAll(".rc img").forEach(im => im.onclick = () => openZoom(im, +im.closest(".rc").id.slice(2)));
  const rev = async (i, st) => {
    const it = list[i]; if (!it) return;
    const who0 = D.students.find(x => String(x.sid) === String(it.sid));
    const n = rewardFor(who0, it.key);
    let reason = "";
    if (st === "no") {
      const r = await askReason(`${who0 ? who0.name : it.sid} · ${proofLabel(it.key)} 반려`,
        `이 인증으로 받은 카드 ${n}장과 그 카드로 뽑은 카드만 회수하고, 학생에게 사유와 재인증 요청이 뜹니다.`,
        it.key === "tabs" ? ["TABS 설문 완료 화면이 아닙니다"] : []);
      if (r === null) return;
      reason = r;
    }
    if (st !== "ok" && it.status === "no" && api && !confirm(`반려를 취소할까요?\n회수했던 카드만큼 미개봉 카드로 돌려줍니다.`)) return;
    const prev = it.status, prevReason = it.reason || "", name = who0 ? who0.name : it.sid;
    /* 화면은 바로 바꾸고(다음 인증으로 넘어감), 서버 저장은 뒤에서 차례대로 */
    revSet(it, st, reason);
    toast((st === "ok" ? "승인" : st === "no" ? "반려" : "되돌림") + " · " + name + (api ? " (저장은 뒤에서 합니다)" : ""));
    render();
    revQueue(it.sid, it.key, st, reason, j => {
      const sc = j && j.sanction, who = D.students.find(x => String(x.sid) === String(it.sid));
      if (sc && sc.ok && who) {
        if (sc.adm) who.adm = sc.adm;
        if (sc.student) Object.assign(who, sc.student);
        if (sc.desc) D.grants.unshift({ at: Date.now(), sid: String(who.sid), name: who.name, cards: 0, reason: "[조치] " + sc.desc });
      }
      if (st === "wait" && prev === "no" && sc && sc.ok && !sc.none) toast("반려를 취소하고 카드를 돌려줬습니다 · " + name);
    }, err => {
      revSet(it, prev, prevReason);
      render();
      toast(`저장하지 못해 되돌렸습니다 · ${name} ${proofLabel(it.key)} — ${errMsg(err)}`);
    });
  };
  app.querySelectorAll("[data-ok]").forEach(b => b.onclick = () => rev(+b.dataset.ok, "ok"));

  // 대기 전체 승인
  $("okall") && ($("okall").onclick = async e => {
    const items = list.filter(p => p.status === "wait");
    if (!items.length) return;

  // 운영: 공지

      D.meta.notice = text ? { t: text, at: Date.now() } : null;
      toast(text ? "공지를 올렸습니다" : "공지를 내렸습니다");
      render();

  $("ntgo") && ($("ntgo").onclick = e => {
    const t = ($("nt").value || "").trim();

  $("ntdel") && ($("ntdel").onclick = e => postNotice("", e.currentTarget));

  // 운영: 학번으로 바로 지급
  $("qgo") && ($("qgo").onclick = async e => {
    const sid = ($("qsid").value || "").trim(), n = parseInt($("qn").value, 10), reason = ($("qr").value || "").trim();
    if (!/^\d{6,12}$/.test(sid)) return toast("학번을 확인해 주세요");
    if (!D.students.some(x => String(x.sid) === sid)) return toast("참여자 목록에 없는 학번입니다");
    if (!n || Math.abs(n) > 100) return toast("장수를 -100~100 사이로 넣어 주세요");
    if (!reason) return toast("사유를 적어 주세요 (지급 기록에 남습니다)");
    if (await grantCards(sid, n, reason, e.currentTarget)) render();
  });
  // 운영: 전체 초기화
  $("rsgo") && ($("rsgo").onclick = async e => {
    if (($("rsconf").value || "").trim() !== "전체 초기화") return toast("'전체 초기화'라고 정확히 입력해 주세요");
    if (!api) return toast("서버에 연결된 상태에서만 쓸 수 있습니다");
    if (!confirm("모든 학생 기록을 지웁니다. 백업본은 자동으로 만들어집니다. 계속할까요?")) return;
    const b = e.currentTarget; b.disabled = true; b.innerHTML = '<span class="spin"></span> 초기화 중';
    try {
      const j = await adminPost({ action: "resetAll", confirm: "전체 초기화" });
      V.resetMsg = `초기화 완료 · ${esc((j.done || []).join(", "))} · 캡처 ${j.trashed || 0}개 휴지통으로 · ` +
                   `<a href="${esc(j.backupUrl || "#")}" target="_blank" rel="noopener">백업본 열기</a>`;
      toast("전체 초기화를 마쳤습니다");
      await load();
    } catch (err) {
      b.disabled = false; b.textContent = "전체 초기화";
      toast(err && err.message === "unknown action" ? "서버를 최신 버전(" + SERVER_EXPECT + ")으로 배포해야 쓸 수 있습니다" : errMsg(err));
    }
  });

  bindGrantBtns(app);
  $("rankcsv") && ($("rankcsv").onclick = () => {
    const l = rankList(); l.forEach((x, i) => { if (x.rank === null) x.rank = l[i - 1].rank; });
    csv([["등수", "이름", "학번", "종수", "26종 완성 시각", "연락처", "교환 등급", "미개봉"]].concat(l.map(x =>
      [x.rank, x.name, x.sid, x.types, x.done ? new Date(x.done).toLocaleString("ko-KR") : "", x.contact, x.exchanged, x.pending])),
      "순위_" + new Date().toISOString().slice(0, 10));
  });
  $("grcsv") && ($("grcsv").onclick = () => {
    const rows = [["시각", "이름", "학번", "장수", "실제 반영", "사유"]];
    D.grants.forEach(g => rows.push([g.at ? new Date(g.at).toLocaleString("ko-KR") : "", g.name, g.sid, g.cards, g.actual == null ? "" : g.actual, g.reason]));
    csv(rows, "카드지급기록");
  });
  app.querySelectorAll("[data-no]").forEach(b => b.onclick = () => rev(+b.dataset.no, "no"));
  app.querySelectorAll("[data-re]").forEach(b => b.onclick = () => rev(+b.dataset.re, "wait"));

  // 검색
  const q = $("q");
  if (q) {
    // 화면을 다시 그리지 않고 줄만 숨긴다 — 다시 그리면 한글 조합(ㅈ+ㅜ+ㅇ → 중)이 끊겨 자음·모음이 따로 들어간다
    const apply = () => {
      V.q = q.value;
      const v = String(q.value || "").replace(/\s/g, "").toLowerCase();
      let n = 0;
      app.querySelectorAll("tr[data-q]").forEach(tr => { const on = !v || tr.dataset.q.indexOf(v) >= 0; tr.style.display = on ? "" : "none"; if (on) n++; });
      const c = $("qcount"); if (c) c.textContent = v ? `${n}명 / 전체 ${D.students.length}명` : `${D.students.length}명`;
      const none = $("qnone"); if (none) none.style.display = v && !n ? "" : "none";
    };
    q.oninput = apply;
    if (q.value) apply();
  }

  // CSV
  $("csv") && ($("csv").onclick = () => csv(
    [["이름", "학번", "보유종수", "C", "B", "A", "S", "미개봉", "퀴즈참여", "교환등급"]].concat(
      D.students.map(s => [s.name, s.sid, s.types].concat(TIER_KEYS.map(t => tierDone(s, t)))
        .concat([s.pending, s.quizDone || 0, s.exchanged || ""]))), "참여자"));
  $("csvsv") && ($("csvsv").onclick = () => csv(
    [["주차", "학번", "이름", "질문", "선택한 답", "직접 입력"]].concat(
      D.surveys.filter(s => !pollOf(s)).map(s => [s.week, s.sid, s.name, s.q, s.answer, s.etc])), "퀴즈설문응답"));
  app.querySelectorAll("[data-pollqr]").forEach(el => el.onclick = () => {
    const d = POLL_DEF[el.dataset.pollqr]; if (!d) return;
    const day = d.from ? `${Number(d.from.slice(5, 7))}월 ${Number(d.from.slice(8, 10))}일` : "";
    showQR({ url: siteBase() + "#survey", label: d.title + (day ? " · " + day : ""),
      desc: `카메라로 찍고 설문에 답해 주세요${d.cards ? ` (딩글이 카드 <b>${Number(d.cards)}장</b>)` : ""}`,
      big: d.doneMsg ? "QR을 찍고 설문에 답하면<br><b>돌림판 1회!</b>" : "QR을 찍고<br><b>설문에 참여해 주세요</b>",
      steps: ["휴대폰 카메라로 QR을 찍어 사이트를 엽니다", "처음이면 학번·이름을 넣고 [시작] — 설문이 바로 보여요",
              d.doneMsg ? "제출 뒤 '참여 완료' 화면을 등대팀에게 보여 주세요" : "모든 문항에 답하고 [제출]을 누르세요"],
      note: "한 사람당 1회 참여" + (d.cards ? ` · 답하면 딩글이 카드 ${Number(d.cards)}장` : "") });
  });
  app.querySelectorAll("[data-pollcsv]").forEach(el => el.onclick = () => {
    const g = pollGroups().find(x => x.id === el.dataset.pollcsv);
    if (!g) return;
    const head = ["학번", "이름", "응답시각"];
    g.qs.forEach(q => head.push(q, q + " (직접 입력)"));
    csv([head].concat(g.people.map(p => [p.sid, p.name, p.at ? new Date(p.at).toLocaleString("ko-KR") : ""]
      .concat(...g.qs.map(q => { const a = p.a[q] || {}; return [a.answer || "", a.etc || ""]; })))), "기간설문_" + g.id);
  });
  $("csvrt") && ($("csvrt").onclick = () => csv(
    [["학번", "이름", "프로그램", "별점", "한 줄 후기"]].concat(
      D.ratings.map(r => [r.sid, r.name, r.program, r.score, r.memo])), "만족도"));
  $("csvref") && ($("csvref").onclick = () => {
    const rows = [["추천한 학생", "추천인 학번", "데려온 학생", "학번", "프로그램 인증"]];
    D.students.forEach(s => {
      if (!s.ref) return;
      const r = D.students.find(x => String(x.sid) === String(s.ref));
      const j = Object.keys(s.claims || {}).some(k => k.indexOf("apply:") === 0 || k.indexOf("done:") === 0);
      rows.push([r ? r.name : "(미가입)", s.ref, s.name, s.sid, j ? "O" : "X"]);
    });
    csv(rows, "추천현황");
  });
  $("csvex") && ($("csvex").onclick = () => {
    const rows = [["이름", "학번", "등급", "선물", "연락처", "지급시각"]];
    (D.exchanges || []).filter(x => x.status === "done").forEach(x =>
      rows.push([x.name, x.sid, x.tier, x.goods || (TIERS[x.tier] ? TIERS[x.tier].goods : ""),
                 x.contact || "", x.doneAt ? new Date(x.doneAt).toLocaleString("ko-KR") : ""]));
    csv(rows, "교환내역");
  });

  // 교환 지급 처리 / 되돌리기
  const exList = (D.exchanges || []).slice();
  const waiting = exList.filter(exWaiting).sort((a, b) => (a.at || 0) - (b.at || 0));
  const paid    = exList.filter(x => x.status === "done").sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const setEx = async (item, status, btn) => {
    if (!item) return;
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      await exchangeDone(item.sid, item.tier, status);
      const src = (D.exchanges || []).find(x => x.sid === item.sid && x.tier === item.tier);
      if (src) { src.status = status; src.doneAt = status === "done" ? Date.now() : 0; }
      toast(status === "done" ? "지급 완료로 처리했습니다" : "신청 대기로 되돌렸습니다");
      render();
    } catch (e) {
      btn.disabled = false; btn.textContent = status === "done" ? "지급 완료" : "되돌리기";
      toast("처리에 실패했습니다");
    }
  };
  bindExGroups();
  app.querySelectorAll("[data-undo]").forEach(b =>
    b.onclick = () => setEx(paid[+b.dataset.undo], "req", b));
}

async function exchangeDone(sid, tier, status) {
  if (api) { await adminPost({ action: "exchangeDone", sid, tier, status }); return; }
  const raw = localStorage.getItem("dingle:" + sid);
  if (!raw) return;
  const d = JSON.parse(raw);
  d.exchanged = d.exchanged || {};
  d.exchanged[tier] = Object.assign({ at: Date.now() }, d.exchanged[tier], { status });
  localStorage.setItem("dingle:" + sid, JSON.stringify(d));
}

/* 등대팀 전용 요청. 담당자 코드를 붙여 보내고, 서버가 거절하면 예외를 던진다. */
async function adminPost(body) {
  const r = await fetch(CONFIG.API_URL, {
    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({}, body, { admin: ADMIN })),
  });
  const j = await r.json();
  if (!j || j.ok !== true) throw new Error((j && j.error) || "failed");
  return j;
}

async function review(sid, key, status, reason) {
  if (api) return await adminPost({ action: "review", sid, key, status, n: rewardOf(key), reason: reason || "" });
  const raw = localStorage.getItem("dingle:" + sid);
  if (!raw) return;
  const d = JSON.parse(raw);
  if (d.proofs && d.proofs[key]) d.proofs[key].status = status;
  localStorage.setItem("dingle:" + sid, JSON.stringify(d));
}

render();
</script>
</body>
