<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딩글이 카드 도감 · 등대팀 관리자</title>
<style>
  :root{
    --deep:#060D1C; --sea:#101E3A; --sea2:#17274A; --line:rgba(255,255,255,.08);
    --beam:#FFC94A; --beam2:#FFE6A8; --foam:#EEF3FB; --mist:#93A6C6; --dim:#7387AD;
    --cC:#8397B2; --cB:#3FC4B2; --cA:#A87BF0; --cS:#FFC94A;
    --ok:#4ED8A0; --bad:#FF9A8B; --info:#6FA8E8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:radial-gradient(120% 55% at 50% -4%,#16294D 0%,var(--deep) 58%) no-repeat,var(--deep);
    background-attachment:fixed;color:var(--foam);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  :focus-visible{outline:2px solid var(--beam);outline-offset:2px}
  button,input,select{font-family:inherit}
  button{cursor:pointer}
  a{color:var(--beam)}

  /* 로그인 */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate .box{width:100%;max-width:340px;text-align:center}
  .gate h1{font-size:23px;margin:0 0 6px}
  .gate p{color:var(--mist);font-size:13px;margin:0 0 22px}
  .gate input{width:100%;padding:13px 14px;font-size:16px;background:rgba(255,255,255,.05);
    border:1px solid rgba(143,163,196,.3);border-radius:10px;color:var(--foam);outline:none;margin-bottom:10px}
  .gate input:focus{border-color:var(--beam)}
  .btn{width:100%;padding:13px;font-size:15px;font-weight:700;background:var(--beam);
    color:#16233D;border:none;border-radius:10px}
  .btn:hover{filter:brightness(1.06)}
  .btn.sm{width:auto;padding:8px 15px;font-size:13px;border-radius:8px}
  .btn.gh{background:transparent;color:var(--foam);border:1px solid rgba(143,163,196,.35)}
  .btn.gh:hover{border-color:var(--beam);color:var(--beam)}
  .err{color:var(--bad);font-size:12.5px;margin-top:10px}

  /* 레이아웃 */
  .top{position:sticky;top:0;z-index:20;background:rgba(11,23,48,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .topin{max-width:1180px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:14px}
  .brand{font-weight:800;font-size:16px;white-space:nowrap}
  .brand span{color:var(--beam)}
  .tabs{display:flex;gap:3px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:9px 14px;font-size:13.5px;font-weight:600;background:none;border:none;color:var(--mist);
    border-radius:8px;white-space:nowrap}
  .tab:hover{color:var(--foam);background:rgba(255,255,255,.05)}
  .tab.on{color:#16233D;background:var(--beam)}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}

  /* 카드/표 */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin-bottom:22px}
  .kpi{background:var(--sea);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .kpi .l{font-size:12px;color:var(--mist);margin-bottom:6px}
  .kpi .v{font-size:26px;font-weight:800;line-height:1.1}
  .kpi .s{font-size:11.5px;color:var(--dim);margin-top:5px}
  .kpi.hl{border-color:rgba(247,201,72,.5);background:rgba(247,201,72,.08)}
  .kpi.hl .v{color:var(--beam)}

  .panel{background:var(--sea);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden}
  .ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .ph h2{margin:0;font-size:15px;font-weight:700}
  .ph .sub{font-size:12px;color:var(--mist)}
  .ph .right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  a.btn{text-decoration:none;display:inline-flex;align-items:center}
  .pb{padding:16px}
  .pb.flush{padding:0}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:11px 14px;background:rgba(0,0,0,.2);color:var(--mist);font-weight:600;
    font-size:12px;white-space:nowrap;position:sticky;top:0}
  td{padding:11px 14px;border-top:1px solid rgba(143,163,196,.12);vertical-align:middle}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .scroll{max-height:520px;overflow:auto}

  .chip{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .chip.C{background:rgba(124,143,168,.2);color:#B6C4D8;border:1px solid rgba(124,143,168,.5)}
  .chip.B{background:rgba(63,182,168,.16);color:#8FE3D6;border:1px solid rgba(63,182,168,.5)}
  .chip.A{background:rgba(161,118,232,.16);color:#CFB6F5;border:1px solid rgba(161,118,232,.5)}
  .chip.S{background:rgba(247,201,72,.16);color:var(--beam2);border:1px solid rgba(247,201,72,.5)}
  .chip.wait{background:rgba(143,163,196,.16);color:var(--mist);border:1px solid rgba(143,163,196,.4)}
  .chip.ok{background:rgba(78,216,160,.16);color:#7FE9C0;border:1px solid rgba(78,216,160,.45)}
  .chip.no{background:rgba(255,154,139,.14);color:var(--bad);border:1px solid rgba(255,154,139,.45)}

  .bar{height:9px;background:rgba(0,0,0,.28);border-radius:999px;overflow:hidden;min-width:90px}
  .bar i{display:block;height:100%;border-radius:999px}

  input.search,select.sel{padding:8px 11px;font-size:13px;background:rgba(0,0,0,.25);
    border:1px solid rgba(143,163,196,.3);border-radius:8px;color:var(--foam);outline:none}
  input.search:focus,select.sel:focus{border-color:var(--beam)}
  select.sel option{background:#12233F}

  .rev{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:13px}
  .rc{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .rc .rh{padding:11px 13px;display:flex;align-items:center;gap:8px;font-size:13px}
  .rc .rh b{font-weight:700}
  .rc .rh .sid{color:var(--mist);font-size:11.5px}
  .rc{position:relative}
  .rc img{width:100%;height:210px;object-fit:contain;object-position:top;background:#0A1428;
    display:block;cursor:zoom-in}
  .rc img.bad{min-height:210px}
  .rc img.bad+.openorig{background:rgba(255,154,139,.16);border-color:rgba(255,154,139,.5);
    color:var(--bad)}
  .rc .openorig{position:absolute;right:10px;top:46px;z-index:4;font-size:11px;
    background:rgba(11,23,48,.85);border:1px solid rgba(143,163,196,.4);color:var(--mist);
    padding:4px 9px;border-radius:999px;text-decoration:none}
  .rc .openorig:hover{border-color:var(--beam);color:var(--beam)}
  a.tel{color:var(--beam2);text-decoration:none;font-variant-numeric:tabular-nums}
  a.tel:hover{text-decoration:underline}
  .rc .ra{display:flex;gap:6px;padding:11px 13px}
  .rc .ra button{flex:1;padding:9px;font-size:12.5px;font-weight:700;border-radius:8px;border:none}
  .rc .ra .y{background:rgba(78,216,160,.18);color:#7FE9C0;border:1px solid rgba(78,216,160,.45)}
  .rc .ra .n{background:rgba(255,154,139,.14);color:var(--bad);border:1px solid rgba(255,154,139,.45)}
  .rc .done{padding:12px;text-align:center;font-size:12.5px}

  .qcard{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:12px}
  .qcard h3{margin:0 0 3px;font-size:14.5px}
  .qcard .meta{font-size:11.5px;color:var(--mist);margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
  .row .lb{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .bar{flex:1}
  .row .n{width:64px;text-align:right;color:var(--mist);font-size:12px;font-variant-numeric:tabular-nums}
  .memos{margin-top:12px;padding-top:12px;border-top:1px solid rgba(143,163,196,.15)}
  .memo{font-size:12.5px;color:var(--foam);background:rgba(0,0,0,.2);border-radius:8px;
    padding:9px 11px;margin-bottom:6px;line-height:1.5}
  .memo b{color:var(--mist);font-weight:600;font-size:11px}

  .empty{padding:44px 16px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(143,163,196,.3);
    border-top-color:var(--beam);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .zoom{position:fixed;inset:0;z-index:300;background:rgba(4,9,20,.95);display:flex;
    align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .zoom img{max-width:100%;max-height:100%;border-radius:10px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(20,38,74,.97);
    border:1px solid var(--beam);color:var(--beam2);padding:11px 20px;border-radius:999px;
    font-size:13.5px;z-index:400;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .note{font-size:12px;color:var(--dim);line-height:1.7}
  /* 학생 상세 */
  .drawer{position:fixed;inset:0;z-index:200;background:rgba(4,9,20,.72);display:flex;justify-content:flex-end}
  .drawer .dp{width:100%;max-width:540px;height:100%;overflow-y:auto;background:var(--sea);
    border-left:1px solid var(--line);padding:22px 22px 70px;animation:dIn .22s ease}
  @keyframes dIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
  .dp .dh{display:flex;align-items:flex-start;gap:10px}
  .dp h3{margin:0;font-size:21px}
  .dp .sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  .dp .sec h4{margin:0 0 10px;font-size:13px;color:var(--mist);font-weight:700}
  .kv{display:grid;grid-template-columns:112px 1fr;gap:7px 12px;font-size:13.5px;margin:0}
  .kv dt{color:var(--dim)} .kv dd{margin:0}
  .frm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .frm input,.frm textarea{flex:1;min-width:0;padding:10px 12px;font-size:14px;background:rgba(255,255,255,.05);
    border:1px solid rgba(143,163,196,.3);border-radius:9px;color:var(--foam);outline:none;font-family:inherit}
  .frm input.n{flex:0 0 120px}
  .frm textarea{width:100%;min-height:78px;resize:vertical}
  .frm input:focus,.frm textarea:focus{border-color:var(--beam)}
  .btn.danger{background:rgba(255,154,139,.15);color:var(--bad);border:1px solid rgba(255,154,139,.4)}
  .owned{display:flex;flex-wrap:wrap;gap:5px}
  .sanc .sb{margin-top:12px;padding:12px 13px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
  .sanc .sbh{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13.5px}
  .sanc .sbh .note{margin-left:auto}
  .sanc .sb .note{margin:4px 0 8px}
  .sanc .srow{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
  .sanc .pick{display:flex;flex-wrap:wrap;gap:6px}
  .sanc .pk{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 9px;border-radius:8px;background:rgba(255,255,255,.05);font-size:12px}
  .sanc .pk b{margin-left:3px;color:var(--beam)}
  .sanc .pk input,.sanc #spend{width:46px;padding:4px 6px;font-size:13px;background:rgba(0,0,0,.25);color:var(--foam);
    border:1px solid var(--line);border-radius:6px}
  .sanc .logs{max-height:260px;overflow-y:auto;border-radius:8px;border:1px solid var(--line)}
  .sanc .lr{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 9px;font-size:12.5px;border-bottom:1px solid var(--line)}
  .sanc .lr:last-child{border-bottom:none}
  .sanc .lr.rv{opacity:.5}
  .sanc .lt{color:var(--dim);white-space:nowrap}
  .sanc .lnk{background:none;border:none;color:var(--bad);font-size:12px;cursor:pointer;white-space:nowrap}
  .owned span{font-size:12px;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.05)}
  .owned span b{margin-left:4px;color:var(--beam)}
  .plus{color:#7FE9C0;font-weight:800} .minus{color:var(--bad);font-weight:800}
  .gbtn{display:inline-flex;gap:8px;margin-left:6px}
  .fq{flex-wrap:wrap;gap:8px}.fq #fl{flex:1;min-width:200px}.fq #fc{flex:0 0 80px;width:80px}
  .qrbox .btn.gh{color:#0B1834;background:#F1F4F9;border:1px solid #CBD3E1}
  .flist{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .fev{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .fev.off{opacity:.55}.fev .fb{display:flex;gap:6px;flex-wrap:wrap}
  .fst{margin-top:14px;padding:14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .fhd{display:flex;flex-direction:column;gap:4px}
  .fgifts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .fgift{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;
    background:rgba(255,201,74,.07);border:1px solid rgba(255,201,74,.25)}
  .fgift.off{background:rgba(0,0,0,.15);border-color:var(--line)}
  .fgift .lnk{background:none;border:none;color:var(--mist);text-decoration:underline;cursor:pointer;font-size:12px}
  .ftiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
  .ftier{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.18)}
  .ftier span{font-size:20px;font-weight:800;color:var(--foam)}
  .qrfull{position:fixed;inset:0;z-index:300;background:rgba(3,8,18,.85);display:flex;align-items:center;justify-content:center;padding:20px}
  .qrbox{background:#fff;color:#0B1834;border-radius:18px;padding:24px;text-align:center;max-width:600px}
  .qrbox h2{margin:12px 0 4px;font-size:24px}.qrbox p{margin:0 0 6px;font-size:16px}.qrbox .note{color:#5E6A80}
  /* QR 창을 띄웠을 때만 QR만 인쇄 (보고서 인쇄에는 영향 없음) */
  @media print{ body.qrprint *{visibility:hidden} body.qrprint .qrfull, body.qrprint .qrfull *{visibility:visible}
    body.qrprint .qrfull{background:#fff;position:absolute} body.qrprint .qrbox .frm{display:none} }
  .gbtn .lnk{background:none;border:none;padding:0;font-size:11.5px;color:var(--mist);cursor:pointer;text-decoration:underline}
  .gbtn .lnk:hover{color:var(--bad)}
  .vwarn{background:rgba(255,154,139,.12);color:#FFD5CD;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:16px}
  .ph h2{white-space:nowrap}
  td:first-child, td.num{white-space:nowrap}
  @media(max-width:640px){
    .topin{flex-wrap:wrap} .tabs{margin-left:0;width:100%;order:3}
    .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex:none}
    .row .lb{width:104px}
    .ph{flex-wrap:wrap}
    .ph .sub{flex:1 1 auto}
    .ph .right{margin-left:0;width:100%}
    .ph .right .search{flex:1;min-width:0}
    .scroll table{min-width:620px}
    .wrap{padding-left:12px;padding-right:12px}
  }
</style>
</head>
<body>
<div id="app"><div class="gate"><span class="spin"></span></div></div>

<script>
/* ═══════════════════════════════════════════════
   딩글이 카드 도감 — 등대팀 관리자
   ═══════════════════════════════════════════════ */

/* ── 설정: 학생용 index.html과 동일하게 맞춰주세요 ── */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbzG9m2zMqCLCkxWinagr5fRNIL_0e0Cm51GG9BhK_0mzXu0fOxqbyiZe8WjqFjbZ-T8qw/exec",                 // Apps Script 웹앱 주소
  // 담당자 코드는 여기 두지 않습니다. Apps Script → 프로젝트 설정 → 스크립트 속성의 ADMIN_CODE에 둡니다.
  CAP: 3,
};

const TIERS = {
  C: { color: "#7C8FA8", word: "일반", goods: "소정의 선물" },
  B: { color: "#3FB6A8", word: "희귀", goods: "조금 더 좋은 선물" },
  A: { color: "#A176E8", word: "영웅", goods: "더 좋은 선물" },
  S: { color: "#F7C948", word: "전설", goods: "특별 선물" },
};
const TIER_KEYS = ["C", "B", "A", "S"];
const PER_TIER = { C: 7, B: 7, A: 7, S: 5 };      // 등급별 카드 종수
const TOTAL_CARDS = TIER_KEYS.reduce((a, t) => a + PER_TIER[t], 0);

const PROGRAMS = [
  { id: "p1", name: "학습동아리" },
  { id: "p2", name: "학습튜터링" },
  { id: "p3", name: "학습법 특강" },
  { id: "p4", name: "학습코칭 상담" },
  { id: "p5", name: "의사소통코칭" },
  { id: "p6", name: "의사소통 워크숍" },
];

const api = CONFIG.API_URL && CONFIG.API_URL.indexOf("http") === 0;
/* 인증 항목별 지급 장수. 같은 사이트의 학생 앱(index.html) 설정을 읽어 덮어쓴다 */
let REWARD = { follow: 7, apply: 7, done: 10, tabs: 7 };
/* 이 학생이 그 인증으로 실제 받은 장수: 획득 기록에 있으면 그 값, 없으면(10/24 이전 참여) 그때 장수 */
const OLD_REWARD = { follow: 5, apply: 5, done: 7 };
function rewardFor(st, key) {
  const log = st && Array.isArray(st.log) ? st.log : [];
  for (let i = log.length - 1; i >= 0; i--) if (log[i] && log[i].k === "g" && log[i].key === key && !log[i].x) return Number(log[i].n) || 0;
  const R0 = (st && st.claims && st.claims[key] && st.claims[key] < Date.parse("2026-10-27T00:00:00+09:00")) || !log.length ? OLD_REWARD : REWARD;
  return key === "follow" ? R0.follow : key === "tabs" ? (REWARD.tabs || 7) : String(key).indexOf("apply:") === 0 ? R0.apply : String(key).indexOf("done:") === 0 ? R0.done : 0;
}
const rewardOf = key => key === "follow" ? REWARD.follow : key === "tabs" ? (REWARD.tabs || 7)
  : String(key).indexOf("apply:") === 0 ? REWARD.apply : String(key).indexOf("done:") === 0 ? REWARD.done : 0;
const ADMIN_PAGE_VERSION = "2026-10-31";   // 이 관리자 페이지 파일의 버전 (로그인 화면 아래에 표시)
let SRV = null;                             // 로그인 화면에서 확인한 서버 상태
let MISMATCH = "";                          // 학생 앱과 서버 주소가 다르면 경고 문구

let D = { students: [], proofs: [], surveys: [], ratings: [], exchanges: [], grants: [], meta: {} };
let ADMIN = "";        // 로그인 때 입력한 담당자 코드 (이 창을 닫으면 사라짐)
let V = { tab: "home", loading: false, q: "", revFilter: "wait", err: "" };

const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function toast(m) {
  const e = document.createElement("div");
  e.className = "toast"; e.textContent = m;
  document.body.appendChild(e);
  setTimeout(() => e.remove(), 2200);
}

/* 구글 드라이브 주소를 이미지로 표시 가능한 형태로 바꾼다.
   예전에 저장된 uc?export=view 주소도 자동 변환된다. */
function driveId(u) {
  const t = String(u || "");
  if (t.indexOf("google") < 0) return "";   // data: 주소 등은 그대로 둔다
  const m = t.match(/[-\w]{25,}/);          // 드라이브 파일 ID
  return m ? m[0] : "";
}
function imgUrl(u) {
  u = String(u || "");
  const id = driveId(u);
  return id ? "https://drive.google.com/thumbnail?id=" + id + "&sz=w1200" : u;
}
function origUrl(u) {
  const id = driveId(u);
  return id ? "https://drive.google.com/file/d/" + id + "/view" : String(u || "");
}
/* 썸네일 주소가 실패하면 lh3 주소로 한 번 더 시도한다 */
function admImgFallback(im) {
  const id = im.getAttribute("data-id") || "";
  if (id && !im.getAttribute("data-retry")) {
    im.setAttribute("data-retry", "1");
    im.src = "https://lh3.googleusercontent.com/d/" + id + "=w1200";
    return;
  }
  im.classList.add("bad");
}

function proofLabel(key) {
  if (key === "follow") return "인스타 팔로우";
  if (key === "tabs") return "TABS 설문";
  const a = String(key).split(":");
  const p = PROGRAMS.find(x => x.id === a[1]);
  const nm = p ? p.name : a[1];
  return a[0] === "apply" ? nm + " 신청" : nm + " 완료";
}

/* ── 데이터 로드 ── */
async function load(silent) {
  if (!silent) { V.loading = true; render(); }
  try {
    if (api) {
      const r = await fetch(CONFIG.API_URL + "?action=admin&admin=" + encodeURIComponent(ADMIN));
      const j = await r.json();
      if (!j.ok) {
        authed = false; V.loading = false;
        V.err = j.error === "no admin code" ? NO_CODE_MSG : "담당자 코드가 맞지 않습니다. 다시 입력해 주세요.";
        return render();
      }
      D = { students: j.students || [], proofs: j.proofs || [], surveys: j.surveys || [],
            ratings: j.ratings || [], exchanges: j.exchanges || [], grants: j.grants || [],
            pollSheets: j.pollSheets || [],
            meta: { v: j.v || "", epoch: j.epoch || "", notice: j.notice || null,
                    sheetName: j.sheetName || "", sheetUrl: j.sheetUrl || "",
                    closed: Number(j.closed) || 0, backup: j.backup || null },
            events: Array.isArray(j.events) ? j.events : [] };
    } else {
      D = fromLocal();
    }
    V.err = "";
  } catch (e) {
    if (silent) return;                 // 자동 새로고침 실패는 조용히 넘긴다 (다음 차례에 다시)
    V.err = "데이터를 불러오지 못했습니다. API 주소를 확인해 주세요. (" + String(e && e.message || e) + ")";
  }
  V.loading = false; render();
}

/* 2분마다 조용히 새로고침 — 다른 팀원이 처리한 내용과 새 인증을 반영한다.
   상세 창이 열려 있거나 글자를 입력하는 중이거나 탭이 가려져 있으면 건너뛴다. */
setInterval(async () => {
  if (!authed || !api || V.loading || document.hidden || $("drawer")) return;
  const ae = document.activeElement;
  if (ae && ae.matches && ae.matches("input,textarea,select")) return;
  const before = D.proofs.filter(p => p.status === "wait").length;
  const y = window.scrollY;
  await load(true);
  window.scrollTo(0, y);
  const after = D.proofs.filter(p => p.status === "wait").length;
  if (after > before) toast(`새 인증 ${after - before}건이 들어왔어요`);
}, 120000);

/* 서버 없이 이 기기에서 테스트할 때 */
function fromLocal() {
  const out = { students: [], proofs: [], surveys: [], ratings: [], exchanges: [] };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || k.indexOf("dingle:") !== 0) continue;
    let d; try { d = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
    const owned = d.owned || {};
    out.students.push({
      sid: d.sid, name: d.name, owned: owned, claims: d.claims || {}, proofs: d.proofs || {},
      types: Object.keys(owned).filter(x => owned[x] > 0).length,
      pending: d.pending || 0,
      exchanged: Object.keys(d.exchanged || {})
        .filter(t => { const x = d.exchanged[t]; return !x || typeof x !== "object" || x.status === "done"; })
        .join(","),
      quizDone: (d.quizDone || []).length, at: d.createdAt || 0,
      ref: d.ref || "", refFrom: d.refFrom || [], contact: d.contact || "",
    });
    Object.keys(d.proofs || {}).forEach(key => {
      const pr = d.proofs[key];
      out.proofs.push({ sid: d.sid, name: d.name, key, at: pr.at, status: pr.status || "wait", img: pr.img });
    });
    (d.surveys || []).forEach(sv => out.surveys.push(Object.assign({ sid: d.sid, name: d.name }, sv)));
    Object.keys(d.ratings || {}).forEach(pid => {
      const rt = d.ratings[pid];
      out.ratings.push({ sid: d.sid, name: d.name, program: rt.program, score: rt.score || 0, memo: rt.memo || "" });
    });
    Object.keys(d.exchanged || {}).forEach(t => {
      const x = d.exchanged[t] || {};
      out.exchanges.push({ sid: d.sid, name: d.name, tier: t, goods: TIERS[t] ? TIERS[t].goods : "",
        contact: x.contact || d.contact || "", at: x.at || 0,
        status: typeof x === "object" && x.status ? x.status : "done", doneAt: 0 });
    });
  }
  return out;
}

/* ── 집계 ── */
function tierDone(st, t) {
  const o = st.owned || {};
  let n = 0;
  for (let i = 1; i <= PER_TIER[t]; i++) if ((o[t + i] || 0) > 0) n++;
  return n;
}
function stats() {
  const s = { total: D.students.length, cards: 0, wait: 0, exch: 0, comp: { C: 0, B: 0, A: 0, S: 0 }, full: 0 };
  D.students.forEach(st => {
    const o = st.owned || {};
    Object.keys(o).forEach(k => s.cards += o[k]);
    TIER_KEYS.forEach(t => { if (tierDone(st, t) === PER_TIER[t]) s.comp[t]++; });
    if (TIER_KEYS.every(t => tierDone(st, t) === PER_TIER[t])) s.full++;
    s.exch += String(st.exchanged || "").split(",").filter(Boolean).length;
  });
  s.wait = D.proofs.filter(p => p.status === "wait").length;
  return s;
}

/* 로그인 화면에서 서버가 실제로 닿는지, 몇 버전인지 보여준다 (문제가 어디 있는지 바로 알 수 있게) */
function srvText() { return srvState() + (MISMATCH || ""); }
function srvState() {
  if (!api) return "API 주소가 비어 있어 이 기기의 데이터만 표시됩니다";
  if (!SRV) return '<span class="spin"></span> 서버 확인 중…';
  if (SRV.state === "down") return '<span style="color:var(--bad)">서버에 연결하지 못했습니다. API 주소와 배포 상태를 확인해 주세요.</span>';
  if (SRV.state === "old") return '<span style="color:var(--bad)">서버가 예전 버전입니다' + (SRV.v ? " (" + esc(SRV.v) + ")" : "") +
    '. apps-script.gs를 새 버전으로 배포해 주세요.</span>';
  if (SRV.state === "stale") return '<span style="color:var(--beam)">서버 연결됨 · 버전 ' + esc(SRV.v) +
    ' · 최신(' + SERVER_EXPECT + ')이 아닙니다. Apps Script를 [배포 관리 → 수정 → 새 버전]으로 다시 배포해야 기간 설문 시트가 만들어집니다.</span>';
  return '<span style="color:#7FE9C0">서버 연결됨 · 버전 ' + esc(SRV.v) + ' ✓</span>';
}
async function checkServer() {
  if (!api || SRV) return;
  try {
    const r = await fetch(CONFIG.API_URL + "?action=ping");
    const j = await r.json();
    const v = (j && j.v) || "";
    SRV = { state: v >= SERVER_EXPECT ? "ok" : v >= "2026-09-24" ? "stale" : "old", v };
  } catch (e) { SRV = { state: "down", v: "" }; }
  const el = $("srvline"); if (el) el.innerHTML = srvText();
  // 같은 사이트의 학생 앱(index.html)이 쓰는 서버 주소와 비교한다 (파일로 열었을 때는 건너뜀)
  try {
    if (location.protocol.indexOf("http") === 0) {
      const t = await (await fetch(new URL("index.html", location.href).href)).text();
      // 학생 앱의 기간 설문 설정(제목·기간·보기)을 읽어 둔다 → 아무도 고르지 않은 보기도 0명으로 보여 준다
      try {
        const pm = t.match(/const POLLS = (\[[\s\S]*?\n\]);/);
        if (pm) { POLL_DEF = {}; (new Function("return " + pm[1])() || []).forEach(x => { POLL_DEF[x.id] = x; }); }
        const rm = t.match(/REWARD:\s*(\{[\s\S]*?\})/);
        if (rm) { const r = new Function("return " + rm[1])(); if (r && typeof r === "object") REWARD = Object.assign(REWARD, r); }
        D._pair = null;                        // 설정을 읽었으니 기간 설문 구분을 다시 계산
        if ((V.tab === "poll" || V.tab === "survey") && authed) render();
      } catch (eP) {}
      const m = t.match(/API_URL:\s*"([^"]+)"/);
      if (m && m[1].trim() !== CONFIG.API_URL.trim()) {
        MISMATCH = '<br><span style="color:var(--bad)">⚠ 학생 앱(index.html)과 이 관리자 페이지의 서버 주소가 다릅니다. ' +
                   '두 파일의 API_URL을 같게 맞춰야 학생 기록이 여기에 보입니다.</span>';
        const e2 = $("srvline"); if (e2) e2.innerHTML = srvText();
      }
    }
  } catch (e) {}
}

/* ── 현황 ── */
/* 순위 — 학생 화면과 같은 규칙: 종류 수가 많은 순, 같으면 26종을 먼저 모은 순. 순위에서 뺀 학생은 제외 */
function rankList() {
  return D.students.filter(x => !(x.adm && x.adm.hide))
    .slice().sort((a, b) => (b.types || 0) - (a.types || 0) || (a.done || 0) - (b.done || 0) || String(a.sid).localeCompare(String(b.sid)))
    .map((x, i, arr) => Object.assign({ rank: i > 0 && arr[i - 1].types === x.types && !x.done && !arr[i - 1].done ? null : i + 1 }, x));
}
function rankPanel() {
  const list = rankList();
  list.forEach((x, i) => { if (x.rank === null) x.rank = list[i - 1].rank; });   // 동점(둘 다 미완성)은 같은 등수

}

          : `<div class="empty">해당하는 인증이 없습니다.</div>`}
      </div>
    </div>`);
}

/* ── 설문 ── */
/* 기간 설문 응답 구분. 서버가 '설문' 칸을 채워 보내지만, 예전 화면에서 낸 응답은 비어 있을 수 있어
   같은 주차·같은 질문이 기간 설문에 속해 있으면 그 설문으로 본다 */
function pollOf(s) {
  if (s.poll) return s.poll;
  if (!D._pair) {
    D._pair = {};
    // 학생 앱 설정(POLLS)에 있는 문항이면, 서버를 새 버전으로 바꾸기 전에 낸 응답이어도 기간 설문으로 본다
    Object.values(POLL_DEF).forEach(p => {
      const wk = mondayOf(p.from);
      (p.questions || []).forEach(q => { D._pair[wk + "|" + q.q] = p.id; });
    });
    D.surveys.forEach(x => { if (x.poll) D._pair[x.week + "|" + x.q] = x.poll; });
  }
  return D._pair[s.week + "|" + s.q] || "";
}
/* "YYYY-MM-DD"가 속한 주의 월요일 (학생 앱의 weekKey와 같은 규칙) */
function mondayOf(ymd) {
  const t = new Date(String(ymd) + "T00:00:00");
  t.setDate(t.getDate() - (t.getDay() + 6) % 7);
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
}

function viewSurvey() {
  const byQ = {};
  const quiz = D.surveys.filter(s => !pollOf(s));
  const nPoll = D.surveys.length - quiz.length;
  quiz.forEach(s => {
    if (!byQ[s.q]) byQ[s.q] = { total: 0, ans: {}, etc: [], weeks: {} };
    const g = byQ[s.q];
    g.total++;
    if (s.answer) g.ans[s.answer] = (g.ans[s.answer] || 0) + 1;
    if (s.etc) g.etc.push({ name: s.name, t: s.etc });
    if (s.week) g.weeks[s.week] = true;
  });
  const keys = Object.keys(byQ);

  return shell(`
    <div class="panel">
      <div class="ph"><h2>설문 응답</h2>
        <span class="sub">퀴즈 뒤 '이번 주 한 마디' 응답 ${quiz.length}건 · 문항 ${keys.length}개${nPoll ? ` · 기간 설문 ${nPoll}건은 '기간 설문' 탭에 따로 모았습니다` : ""}</span>
        <div class="right"><button class="btn gh sm" id="csvsv">CSV 내려받기</button></div>
      </div>
      <div class="pb">
        ${keys.length ? keys.map(q => {
          const g = byQ[q];
          const opts = Object.keys(g.ans).sort((a, b) => g.ans[b] - g.ans[a]);
          const max = Math.max(1, ...opts.map(o => g.ans[o]));
          return `<div class="qcard">
            <h3>${esc(q)}</h3>
            <div class="meta">응답 ${g.total}건 · ${Object.keys(g.weeks).length}개 주차</div>
            ${opts.map(o => {
              const n = g.ans[o], pct = Math.round(n / g.total * 100);
              return `<div class="row"><div class="lb">${esc(o)}</div>
                <div class="bar"><i style="width:${Math.round(n / max * 100)}%;background:var(--info)"></i></div>
                <div class="n">${n}건 · ${pct}%</div></div>`;
            }).join("")}
            ${g.etc.length ? `<div class="memos">
              <div class="meta" style="margin-bottom:8px">직접 입력 ${g.etc.length}건</div>
              ${g.etc.slice(0, 30).map(e => `<div class="memo"><b>${esc(e.name)}</b> · ${esc(e.t)}</div>`).join("")}
              ${g.etc.length > 30 ? `<div class="note">외 ${g.etc.length - 30}건 — CSV에서 전체를 볼 수 있습니다</div>` : ""}
            </div>` : ""}
          </div>`;
        }).join("") : `<div class="empty">아직 퀴즈 설문 응답이 없습니다.<br>학생이 퀴즈를 풀고 '이번 주 한 마디'에 답하면 이곳에 쌓입니다.</div>`}
      </div>
    </div>`);
}

/* ── 기간 설문 ── */
let POLL_DEF = {};    // 학생 앱(index.html)의 POLLS 설정. 같은 사이트에 올렸을 때만 읽힌다
function pollGroups() {
  const by = {};
  D.surveys.forEach(s => {
    const id = pollOf(s);
    if (!id) return;
    const g = by[id] || (by[id] = { id, qs: [], ppl: {} });
    if (g.qs.indexOf(s.q) < 0) g.qs.push(s.q);
    const p = g.ppl[s.sid] || (g.ppl[s.sid] = { sid: s.sid, name: s.name, at: 0, a: {} });
    p.a[s.q] = { answer: s.answer || "", etc: s.etc || "" };
    p.at = Math.max(p.at, Number(s.at) || 0);
  });
  return Object.keys(by).sort().reverse().map(id => {
    const g = by[id], def = POLL_DEF[id];
    if (def) {   // 설정의 문항 순서를 따르고, 응답에만 있는 예전 문항은 뒤에 둔다
      const order = def.questions.map(q => q.q);
      g.qs = order.filter(q => g.qs.indexOf(q) >= 0).concat(g.qs.filter(q => order.indexOf(q) < 0));
      g.def = def;
    }
    g.people = Object.values(g.ppl).sort((a, b) => (b.at || 0) - (a.at || 0));
    return g;
  });
}

function viewPoll() {
  const groups = pollGroups();
  if (!groups.length) return shell(`<div class="panel"><div class="ph"><h2>기간 설문</h2></div>
    <div class="pb"><div class="empty">아직 기간 설문 응답이 없습니다.<br>학생 화면 '카드 얻기' 맨 위 설문에 답하면 이곳에 쌓입니다.</div></div></div>`);
  const total = D.students.length;
  return shell(groups.map(g => {
    const n = g.people.length;
    const sheet = (D.pollSheets || []).find(x => x.id === g.id);
    const etcN = g.people.filter(p => g.qs.some(q => (p.a[q] || {}).etc)).length;
    return `
    <div class="cards">
      <div class="kpi hl"><div class="l">참여 인원</div><div class="v">${n}</div>
        <div class="s">${total ? `전체 참여자 ${total}명 중 ${Math.round(n / total * 100)}%` : ""}</div></div>
      <div class="kpi"><div class="l">문항</div><div class="v">${g.qs.length}</div><div class="s">설문 ${esc(g.id)}</div></div>
      <div class="kpi"><div class="l">직접 입력을 남긴 학생</div><div class="v">${etcN}</div></div>
      <div class="kpi"><div class="l">마지막 응답</div><div class="v" style="font-size:17px;margin-top:5px">
        ${g.people[0] && g.people[0].at ? new Date(g.people[0].at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "-"}</div></div>
    </div>
    <div class="panel">
      <div class="ph"><h2>${g.def ? esc(g.def.title) + " (" + esc(g.def.from || g.id) + (g.def.until ? " ~ " + esc(g.def.until) : "") + ")" : "기간 설문 " + esc(g.id)} · 문항별 결과</h2>
        <span class="sub">응답한 학생 ${n}명 기준${g.def && g.def.cards ? " · 참여 보상 카드 " + Number(g.def.cards) + "장" : ""}</span>
        <div class="right">
          ${sheet ? `<a class="btn gh sm" href="${esc(sheet.url)}" target="_blank" rel="noopener">스프레드시트에서 보기</a>` : ""}
          ${sheet && sheet.sumUrl ? `<a class="btn gh sm" href="${esc(sheet.sumUrl)}" target="_blank" rel="noopener">시트 집계표</a>` : ""}
          <button class="btn gh sm" data-pollcsv="${esc(g.id)}">CSV 내려받기</button>
        </div>
      </div>
      <div class="pb">
        ${g.qs.map((q, qi) => {
          const cnt = {}, etc = [];
          g.people.forEach(p => {
            const a = p.a[q]; if (!a) return;
            if (a.answer) cnt[a.answer] = (cnt[a.answer] || 0) + 1;
            if (a.etc) etc.push({ name: p.name, t: a.etc });
          });
          const dq = g.def && g.def.questions.find(x => x.q === q);
          (dq ? dq.opts : []).forEach(o => { if (!(o in cnt)) cnt[o] = 0; });   // 아무도 안 고른 보기도 0명으로
          const opts = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
          const answered = g.people.filter(p => p.a[q]).length || 1;
          return `<div class="qcard">
            <h3>질문 ${qi + 1}. ${esc(q)}</h3>
            <div class="meta">응답 ${g.people.filter(p => p.a[q]).length}명 · 보기 선택 ${opts.reduce((s, o) => s + cnt[o], 0)}명 · 직접 입력 ${etc.length}명</div>
            ${opts.map((o, i) => {
              const c = cnt[o], pct = Math.round(c / answered * 100);
              return `<div class="row"><div class="lb">${esc(o)}</div>
                <div class="bar"><i style="width:${pct}%;background:${i === 0 && c ? "var(--beam)" : "var(--info)"}"></i></div>
                <div class="n">${c}명 · ${pct}%</div></div>`;
            }).join("") || `<div class="note">보기를 고른 응답이 없습니다.</div>`}
            ${etc.length ? `<div class="memos">
              <div class="meta" style="margin-bottom:8px">직접 입력 ${etc.length}건</div>
              ${etc.map(e => `<div class="memo"><b>${esc(e.name)}</b> · ${esc(e.t)}</div>`).join("")}
            </div>` : ""}
          </div>`;
        }).join("")}
      </div>
    </div>
    <div class="panel">
      <div class="ph"><h2>학생별 응답</h2><span class="sub">${n}명 · 최근 응답 순</span></div>
      <div class="pb flush"><div class="scroll">
        <table>
          <thead><tr><th>이름</th><th>학번</th><th>응답시각</th>
            ${g.qs.map((q, qi) => `<th>질문 ${qi + 1}</th>`).join("")}</tr></thead>
          <tbody>
            ${g.people.map(p => `<tr>
              <td>${esc(p.name)}</td>
              <td style="color:var(--mist)">${esc(p.sid)}</td>
              <td style="color:var(--mist);white-space:nowrap">${p.at ? new Date(p.at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "-"}</td>
              ${g.qs.map(q => { const a = p.a[q] || {};
                return `<td>${esc(a.answer || "")}${a.etc ? `${a.answer ? "<br>" : ""}<span style="color:var(--mist)">✎ ${esc(a.etc)}</span>` : ""}${!a.answer && !a.etc ? "-" : ""}</td>`; }).join("")}
            </tr>`).join("")}
          </tbody>
        </table>
      </div></div>
    </div>`;
  }).join(""));
}

const qrLink = code => siteBase() + "?ev=" + encodeURIComponent(code);
function qrSVG(text, px) {
  const q = qrcode(0, "M"); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 4, cell = (px || 320) / (n + m * 2);
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m},${r + m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + m * 2} ${n + m * 2}" width="${px || 320}" height="${px || 320}" shape-rendering="crispEdges"
    style="background:#fff;border-radius:10px"><path d="${d}" fill="#0B1834"/></svg>`;
}
const evLive = e => !e.until || e.until > Date.now();
const evCount = code => D.students.filter(x => (x.claims || {})["event:" + String(code).toUpperCase()]).length;

function viewField() {

  const st = V.fq ? D.students.find(x => String(x.sid) === V.fq) : null;
  return shell(`
    <div class="panel">
      <div class="ph"><h2>현장 이벤트 QR</h2><span class="sub">학생이 폰 카메라로 QR을 찍으면 사이트가 열리면서 카드가 바로 들어갑니다 (로그인 전이면 로그인 직후)</span></div>
      <div class="pb">
        ${api ? `<div class="frm fq">
          <input id="fl" placeholder="이벤트 이름 (예: 11/5 현장 이벤트)" maxlength="30">
          <input id="fc" type="number" min="1" max="30" value="5" style="width:80px" inputmode="numeric"><span class="note">장</span>
          <select id="fu"><option value="today">오늘 자정까지</option><option value="3">3시간</option><option value="1">1시간</option><option value="0">기한 없음</option></select>
          <button class="btn sm" id="fadd">QR 만들기</button></div>` : `<p class="note">서버에 연결된 상태에서만 만들 수 있습니다.</p>`}
        ${evs.length ? `<div class="flist">${evs.map(e => `<div class="fev ${evLive(e) ? "" : "off"}">
            <div class="fi"><b>${esc(e.label)}</b> <span class="chip ${evLive(e) ? "ok" : "no"}">${evLive(e) ? "진행 중" : "끝남"}</span>
              <div class="note">카드 ${e.cards}장 · ${e.until ? (evLive(e) ? when(e.until) + "까지" : when(e.until) + " 종료") : "기한 없음"} · 참여 <b style="color:var(--foam)">${evCount(e.code)}명</b> · 코드 ${esc(e.code)}</div></div>
            <div class="fb"><button class="btn sm" data-fqr="${esc(e.code)}">QR 크게</button>
              ${evLive(e) ? `<button class="btn gh sm" data-fend="${esc(e.code)}">지금 끝내기</button>` : ""}
              <button class="btn gh sm" data-fdel="${esc(e.code)}">삭제</button></div></div>`).join("")}</div>`
          : `<p class="note" style="margin-top:12px">아직 만든 현장 이벤트가 없습니다.</p>`}
        <p class="note" style="margin-top:10px">한 학생은 이벤트마다 한 번만 받습니다. QR 사진이 퍼지는 것을 막으려면 기한을 짧게 두고, 행사가 끝나면 [지금 끝내기]를 누르세요.</p>
      </div>
    </div>

    <div class="panel">
      <div class="ph"><h2>학번으로 바로 처리</h2>

        <span class="chip wait">단백질 쉐이크 ${D.students.filter(x => x.adm && x.adm.gifts && x.adm.gifts["단백질 쉐이크"]).length}개 지급</span></div>
      <div class="pb" style="padding-bottom:0"><p class="note" style="margin:0">TABS 인증·팔로우 인증을 확인하고 경품을 건넨 뒤 [지급]을 눌러 두면, 같은 학생이 다시 와도 '지급함'으로 보입니다.</p></div>
    </div>
    <div class="panel">
      <div class="ph"><h2>학번 조회</h2><span class="sub">부스에서 학생 학번을 넣으면 카드 현황·교환 상태를 보고 바로 지급합니다</span></div>
      <div class="pb">

        ${V.fq ? (st ? fieldStudent(st) : `<p class="note" style="margin-top:10px">${esc(V.fq)} 학번의 참여 기록이 없습니다. [새로고침] 후 다시 조회해 보세요.</p>`) : ""}

}
function fieldStudent(st) {
  const ex = (D.exchanges || []).filter(x => String(x.sid) === String(st.sid));
  const tiers = TIER_KEYS.map(t => {
    const have = tierDone(st, t), all = PER_TIER[t], x = ex.find(y => y.tier === t);
    const state = x ? (x.status === "done" ? `<span class="chip ok">지급 완료</span>`
                                            : `<button class="btn sm" data-fex="${t}">선물 지급 완료</button>`)
                    : have === all ? `<span class="chip wait">완성 · 교환 신청 전</span>` : "";
    return `<div class="ftier"><b>${t} ${TIERS[t].word}</b><span>${have}/${all}</span>${state}</div>`;
  }).join("");
  const rejected = Object.keys(st.proofs || {}).filter(k => (st.proofs[k] || {}).status === "no").length;
  const gifts = (st.adm && st.adm.gifts) || {};
  const pst = k => { const pr = (D.proofs || []).find(p => String(p.sid) === String(st.sid) && p.key === k);
    return pr ? pr.status : (st.claims || {})[k] ? "wait" : ""; };
  const giftRow = (k, label, item) => {
    const ps = pst(k), ok = ps === "ok" || ps === "wait", given = gifts[item];

    <div class="fgifts">${giftRow("tabs", "TABS 설문", "전기손난로")}${giftRow("follow", "인스타 팔로우", "단백질 쉐이크")}</div>
    <div class="ftiers">${tiers}</div>
    ${api ? `<div class="frm" style="margin-top:12px">
      <span class="note">카드 지급</span>
      ${[3, 5, 7].map(n => `<button class="btn gh sm" data-fg="${n}">+${n}장</button>`).join("")}
      <input id="fgr" placeholder="사유 (기본: 현장 지급)" maxlength="60" style="flex:1;min-width:140px">
    </div>` : ""}
    <div style="margin-top:10px"><button class="btn gh sm" data-st="${esc(st.sid)}">학생 상세 창 열기 (인증·조치·지급 기록)</button></div>

function showQR(e) {

  z.className = "qrfull";
  z.innerHTML = `<div class="qrbox">${qrSVG(qrLink(e.code), Math.min(520, innerWidth - 80, innerHeight - 260))}
    <h2>${esc(e.label)}</h2><p>카메라로 찍으면 딩글이 카드 <b>${e.cards}장</b>!</p>
    <div class="note" style="word-break:break-all">${esc(qrLink(e.code))}</div>
    <div class="frm" style="justify-content:center;margin-top:12px"><button class="btn sm" id="qrcopy">링크 복사</button>
      <button class="btn gh sm" id="qrprint">인쇄</button><button class="btn gh sm" id="qrx">닫기</button></div></div>`;
  document.body.appendChild(z);
  document.body.classList.add("qrprint");
  const close = () => { z.remove(); document.body.classList.remove("qrprint"); };

  z.querySelector("#qrcopy").onclick = () => navigator.clipboard.writeText(qrLink(e.code)).then(() => toast("링크를 복사했습니다"), () => toast("복사하지 못했습니다"));
  z.querySelector("#qrprint").onclick = () => window.print();
}
function bindField() {
  if (V.tab !== "field") return;
  $("fadd") && ($("fadd").onclick = async e => {
    const label = $("fl").value.trim(), cards = parseInt($("fc").value, 10) || 0, u = $("fu").value;
    if (!label) return toast("이벤트 이름을 적어 주세요");
    if (cards < 1 || cards > 30) return toast("장수는 1~30장으로 넣어 주세요");
    let until = 0;
    if (u === "today") { const k = new Date(Date.now() + 9 * 3600e3); until = Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate(), 23, 59, 59) - 9 * 3600e3; }
    else if (+u) until = Date.now() + (+u) * 3600e3;
    const b = e.currentTarget; b.disabled = true;
    try { const j = await adminPost({ action: "fieldEvent", mode: "add", label, cards, until }); D.events = j.events || [];
      render(); showQR(D.events[D.events.length - 1]); }
    catch (err) { b.disabled = false; toast(errMsg(err)); }
  });
  const act = (sel, mode, ask, msg) => app.querySelectorAll(sel).forEach(b => b.onclick = async () => {
    const code = b.dataset[sel.slice(6, -1).replace(/-./g, x => x[1].toUpperCase())];
    if (ask && !confirm(ask)) return;
    try { const j = await adminPost({ action: "fieldEvent", mode, code }); D.events = j.events || []; render(); toast(msg); }
    catch (err) { toast(errMsg(err)); }
  });
  act("[data-fend]", "end", "이 QR 이벤트를 지금 끝낼까요? 이미 받은 카드는 그대로입니다.", "이벤트를 끝냈습니다");
  act("[data-fdel]", "del", "이 QR 이벤트를 목록에서 지울까요? 이미 받은 카드는 그대로이며, QR은 더 이상 동작하지 않습니다.", "삭제했습니다");
  app.querySelectorAll("[data-fqr]").forEach(b => b.onclick = () => showQR(D.events.find(x => x.code === b.dataset.fqr)));
  const look = () => { V.fq = ($("fsid").value || "").replace(/\D/g, ""); render(); setTimeout(() => $("fsid") && $("fsid").focus(), 0); };
  $("fgo") && ($("fgo").onclick = look);
  $("fsid") && ($("fsid").onkeydown = e => { if (e.key === "Enter") look(); });
  app.querySelectorAll("[data-fg]").forEach(b => b.onclick = async () => {
    const n = +b.dataset.fg, reason = ($("fgr").value || "").trim() || "현장 지급";
    b.disabled = true;
    if (await grantCards(V.fq, n, reason)) render(); else b.disabled = false;
  });
  const gift = async (item, on, b) => {
    b.disabled = true;
    try { const j = await adminPost({ action: "gift", sid: V.fq, item, on });
      const st = D.students.find(x => String(x.sid) === V.fq); if (st) { st.adm = st.adm || {}; st.adm.gifts = j.gifts; }
      toast(on ? `${item} 지급으로 표시했습니다` : `${item} 지급 표시를 취소했습니다`); render(); }
    catch (err) { b.disabled = false; toast(err && err.message === "already gift" ? "이미 지급한 학생입니다 (다른 팀원이 먼저 처리)" : errMsg(err)); }
  };
  app.querySelectorAll("[data-gv]").forEach(b => b.onclick = () => gift(b.dataset.gv, true, b));
  app.querySelectorAll("[data-gu]").forEach(b => b.onclick = () => { if (confirm("경품 지급 표시를 취소할까요?")) gift(b.dataset.gu, false, b); });
  app.querySelectorAll("[data-fex]").forEach(b => b.onclick = async () => {
    const t = b.dataset.fex; b.disabled = true;
    try { await exchangeDone(V.fq, t, "done");
      const x = (D.exchanges || []).find(y => String(y.sid) === V.fq && y.tier === t); if (x) x.status = "done";
      toast(`${t}등급 선물 지급 완료로 바꿨습니다`); render(); }
    catch (err) { b.disabled = false; toast(errMsg(err)); }
  });
}

/* ───────── 운영 보고서 (미래융합교육혁신원 보고용) ─────────
   지금 불러온 데이터로 바로 만든다. [인쇄 · PDF로 저장]은 보고서 부분만 인쇄하고,
   [HTML로 저장]은 그래프까지 들어 있는 파일 하나로 내려받는다. */
const KO = n => Number(n || 0).toLocaleString("ko-KR");
const PCT = (a, b) => b ? Math.round(a / b * 100) : 0;
function mondayMs(t) {
  const d = new Date(Number(t) + 9 * 3600e3);            // 한국 날짜 기준
  const dow = (d.getUTCDay() + 6) % 7;
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - dow);
}
const wkLabel = ms => { const d = new Date(ms); return (d.getUTCMonth() + 1) + "/" + d.getUTCDate(); };

function reportData() {
  const S = D.students, now = Date.now();
  const has = (st, pre) => Object.keys(st.claims || {}).some(k => k === pre || k.indexOf(pre) === 0);
  const firstAt = Math.min.apply(null, S.map(x => x.created || x.at || now).concat([now]));
  const proofN = { ok: 0, wait: 0, no: 0 };
  D.proofs.forEach(p => { proofN[p.status] = (proofN[p.status] || 0) + 1; });
  const ex = D.exchanges || [];
  const rate = D.ratings.filter(r => r.score > 0);
  const k = {
    total: S.length,
    proofStu: S.filter(x => has(x, "follow") || has(x, "apply:") || has(x, "done:")).length,
    applyStu: S.filter(x => has(x, "apply:")).length,
    doneStu: S.filter(x => has(x, "done:")).length,
    quiz: S.reduce((a, x) => a + (x.quizDone || 0), 0),
    quizStu: S.filter(x => x.quizDone > 0).length,
    ref: S.filter(x => x.ref).length,
    exReq: ex.length, exDone: ex.filter(x => x.status === "done").length,
    rateAvg: rate.length ? (rate.reduce((a, r) => a + r.score, 0) / rate.length).toFixed(2) : "-", rateN: rate.length,
    proofN, cards: S.reduce((a, x) => a + Object.values(x.owned || {}).reduce((b, c) => b + c, 0), 0),
  };
  // 프로그램별 신청 → 완료
  const prog = PROGRAMS.map(p => {
    const a = S.filter(x => (x.claims || {})["apply:" + p.id]).length;
    const d = S.filter(x => (x.claims || {})["done:" + p.id]).length;
    const both = S.filter(x => (x.claims || {})["apply:" + p.id] && (x.claims || {})["done:" + p.id]).length;
    return { name: p.name, apply: a, done: d, both, conv: PCT(both, a) };
  });
  // 주차별 추이
  const w0 = mondayMs(firstAt), w1 = mondayMs(now), weeks = [];
  for (let w = w0; w <= w1; w += 7 * 864e5) weeks.push({ w, join: 0, proof: 0, quiz: 0 });
  const at = t => { const w = mondayMs(t); return weeks.find(x => x.w === w); };
  S.forEach(x => { const r = x.created && at(x.created); if (r) r.join++; });
  D.proofs.forEach(p => { const r = p.at && at(p.at); if (r) r.proof++; });
  D.surveys.filter(x => !pollOf(x)).forEach(x => {
    const t = Date.parse(String(x.week) + "T12:00:00+09:00"); const r = !isNaN(t) && at(t); if (r) r.quiz++;
  });
  // 참여 경로
  const route = [["인스타그램 팔로우", "follow"], ["TABS 설문 인증", "tabs"], ["주간 퀴즈", null], ["프로그램 신청", "apply:"], ["활동 완료", "done:"],
                 ["이벤트 코드", "event:"], ["기간 설문", "survey:"], ["친구 추천으로 가입", "ref"]]
    .map(([l, pre]) => [l, pre === null ? k.quizStu : pre === "ref" ? k.ref : S.filter(x => has(x, pre)).length]);
  // 만족도
  const rp = {};
  D.ratings.forEach(r => { const o = rp[r.program] || (rp[r.program] = { n: 0, sum: 0, memo: 0 }); if (r.score) { o.n++; o.sum += r.score; } if (r.memo) o.memo++; });
  // 설문 (퀴즈 '한 마디' + 기간 설문)
  const qs = [];
  const add = (title, list, def) => {
    const by = {};
    list.forEach(x => { const o = by[x.q] || (by[x.q] = { q: x.q, cnt: {}, etc: [], n: 0 }); o.n++;
      if (x.answer) o.cnt[x.answer] = (o.cnt[x.answer] || 0) + 1; if (x.etc) o.etc.push(x.etc); });
    Object.values(by).forEach(o => {
      const dq = def && def.questions.find(z => z.q === o.q);
      (dq ? dq.opts : []).forEach(op => { if (!(op in o.cnt)) o.cnt[op] = 0; });
      qs.push(Object.assign({ group: title }, o));
    });
  };
  pollGroups().forEach(g => add((g.def ? g.def.title : "기간 설문") + " (" + g.id + ")",
    D.surveys.filter(x => pollOf(x) === g.id), g.def));
  add("주간 퀴즈 '이번 주 한 마디'", D.surveys.filter(x => !pollOf(x)));
  return { k, prog, weeks, route, rp, qs, firstAt, now };
}

function hbars(rows, color) {           // rows: [[label, n, pctBase]]
  const max = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="rb">${rows.map(([l, n, base]) => `<div class="rbr"><span class="rbl">${esc(l)}</span>
    <span class="rbt"><i style="width:${Math.round(n / max * 100)}%;background:${color || "#2F5BD3"}"></i></span>
    <span class="rbn">${KO(n)}${base ? ` <small>(${PCT(n, base)}%)</small>` : ""}</span></div>`).join("")}</div>`;
}
function weekChart(weeks) {
  const W = 680, H = 210, P = { l: 34, r: 12, t: 14, b: 30 };
  const keys = [["join", "신규 가입", "#2F5BD3"], ["proof", "인증 제출", "#E3A008"], ["quiz", "퀴즈 '한 마디' 응답", "#18A36B"]];
  const max = Math.max(1, ...weeks.map(w => Math.max(w.join, w.proof, w.quiz)));
  const n = weeks.length, gx = (W - P.l - P.r) / Math.max(1, n), bw = Math.min(16, gx / 4);
  const y = v => P.t + (H - P.t - P.b) * (1 - v / max);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = Math.round(max * i / 4), yy = y(v);
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" stroke="#E3E7EF"/><text x="${P.l - 6}" y="${yy + 3}" text-anchor="end" font-size="9" fill="#7A8599">${v}</text>`; }
  weeks.forEach((w, i) => {
    const cx = P.l + gx * i + gx / 2;
    keys.forEach(([k, , c], j) => { const v = w[k], x = cx + (j - 1) * (bw + 2) - bw / 2;
      g += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${H - P.b - y(v)}" rx="2" fill="${c}"/>`; });
    g += `<text x="${cx}" y="${H - P.b + 14}" text-anchor="middle" font-size="9.5" fill="#4A5568">${wkLabel(w.w)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="주차별 참여 추이">${g}</svg>
    <div class="rleg">${keys.map(([, l, c]) => `<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>`;
}

          ${hbars(opts.map(o => [o, q.cnt[o], picked]), "#E3A008")}

  </article>`;

/* ── 만족도 ── */
function viewRating() {
  const byP = {};
  D.ratings.forEach(r => {
    const k = r.program || "기타";
    if (!byP[k]) byP[k] = { n: 0, sum: 0, cnt: 0, memos: [] };
    byP[k].n++;
    if (r.score) { byP[k].sum += r.score; byP[k].cnt++; }
    if (r.memo) byP[k].memos.push({ name: r.name, t: r.memo, s: r.score });
  });
  const keys = Object.keys(byP).sort((a, b) => (byP[b].cnt ? byP[b].sum / byP[b].cnt : 0) - (byP[a].cnt ? byP[a].sum / byP[a].cnt : 0));

  return shell(`
    <div class="panel">
      <div class="ph"><h2>프로그램 만족도</h2>
        <span class="sub">활동 완료 인증 시 받은 응답 ${D.ratings.length}건</span>
        <div class="right"><button class="btn gh sm" id="csvrt">CSV 내려받기</button></div>
      </div>
      <div class="pb">
        ${keys.length ? keys.map(k => {
          const g = byP[k];
          const avg = g.cnt ? (g.sum / g.cnt) : 0;
          return `<div class="qcard">
            <h3>${esc(k)}</h3>
            <div class="meta">응답 ${g.n}건 · 별점 ${g.cnt}건</div>
            <div class="row">
              <div class="lb" style="color:var(--beam);font-weight:800;font-size:17px">
                ${g.cnt ? avg.toFixed(1) : "-"}<span style="font-size:12px;color:var(--mist);font-weight:400"> / 5</span></div>
              <div class="bar"><i style="width:${avg / 5 * 100}%;background:var(--beam)"></i></div>
              <div class="n">${"★".repeat(Math.round(avg))}</div>
            </div>
            ${g.memos.length ? `<div class="memos">
              ${g.memos.slice(0, 20).map(m => `<div class="memo">
                <b>${esc(m.name)}${m.s ? " · " + "★".repeat(m.s) : ""}</b><br>${esc(m.t)}</div>`).join("")}
              ${g.memos.length > 20 ? `<div class="note">외 ${g.memos.length - 20}건</div>` : ""}
            </div>` : ""}
          </div>`;
        }).join("") : `<div class="empty">아직 만족도 응답이 없습니다.<br>학생이 활동 완료를 인증하면 이곳에 쌓입니다.</div>`}
      </div>
    </div>`);
}

/* ── 추천 ── */
function viewReferral() {
  const byRef = {};
  D.students.forEach(s => {
    if (!s.ref) return;
    if (!byRef[s.ref]) byRef[s.ref] = [];
    byRef[s.ref].push(s);
  });
  const nameOf = sid => {
    const f = D.students.find(x => String(x.sid) === String(sid));
    return f ? f.name : "(미가입)";
  };
  const joined = s => Object.keys(s.claims || {}).some(k => k.indexOf("apply:") === 0 || k.indexOf("done:") === 0);

  const rows = Object.keys(byRef)
    .map(sid => ({ sid, name: nameOf(sid), list: byRef[sid] }))
    .sort((a, b) => b.list.length - a.list.length);

  const invited = D.students.filter(s => s.ref).length;
  const active = D.students.filter(s => s.ref && joined(s)).length;
  const rate = invited ? Math.round(active / invited * 100) : 0;

  return shell(`
    <div class="cards">
      <div class="kpi"><div class="l">추천으로 가입</div><div class="v">${invited}</div>
        <div class="s">전체 ${D.students.length}명 중</div></div>
      <div class="kpi"><div class="l">추천한 학생</div><div class="v">${rows.length}</div>
        <div class="s">1명 이상 데려온 학생</div></div>
      <div class="kpi ${rate >= 50 ? "hl" : ""}"><div class="l">실제 참여 전환</div><div class="v">${rate}%</div>
        <div class="s">추천 가입자 중 프로그램 인증 ${active}명</div></div>
    </div>

    <div class="panel">
      <div class="ph"><h2>추천 현황</h2>
        <span class="sub">추천한 학생과 데려온 친구</span>
        <div class="right"><button class="btn gh sm" id="csvref">CSV 내려받기</button></div>
      </div>
      <div class="pb flush"><div class="scroll">
        <table>
          <thead><tr><th>추천한 학생</th><th>학번</th><th class="num">데려온 인원</th><th>친구 목록</th></tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => `<tr>
              <td>${esc(r.name)}</td>
              <td style="color:var(--mist)">${esc(r.sid)}</td>
              <td class="num">${r.list.length}명</td>
              <td>${r.list.map(x => `<span class="chip ${joined(x) ? "ok" : "wait"}">${esc(x.name)}${joined(x) ? "" : " 미참여"}</span>`).join(" ")}</td>
            </tr>`).join("") : `<tr><td colspan="4"><div class="empty">아직 추천 기록이 없습니다.</div></td></tr>`}
          </tbody>
        </table>
      </div></div>
    </div>

    <p class="note">
      초록색은 추천으로 들어와 프로그램을 실제로 인증한 학생입니다. 이때 추천인에게 카드가 지급됩니다.<br>
      회색(미참여)은 가입만 하고 아직 프로그램 인증을 하지 않은 상태로, 추천인 보상은 지급되지 않았습니다.
    </p>`);
}

        <p class="note" style="margin:0 0 10px">위 '연결된 스프레드시트'의 학생·인증·설문·별점·교환·지급 기록과 인증 캡처 파일을 모두 지웁니다.
          지우기 전에 스프레드시트 백업본을 자동으로 만들고, 테스트했던 폰에 남은 예전 기록도 서버로 되살아나지 않게 막습니다.
          시트에서 직접 줄을 지우면 이 막음이 걸리지 않으니 꼭 여기서 초기화해 주세요.</p>
        <div class="frm">
          <input id="rsconf" placeholder="확인을 위해 '전체 초기화'라고 입력">
          <button class="btn sm danger" id="rsgo">전체 초기화</button>
        </div>
        ${V.resetMsg ? `<p class="note" style="margin:10px 0 0;color:var(--foam)">${V.resetMsg}</p>` : ""}
      </div>
    </div>`);
}

/* 학생 한 명의 상세 — 오른쪽에서 열리는 창 */
function openStudent(sid) {
  const st = D.students.find(x => String(x.sid) === String(sid));
  if (!st) return;
  closeStudent();
  const owned = st.owned || {};
  const byTier = TIER_KEYS.map(t => {
    const ids = Object.keys(owned).filter(k => k[0] === t && owned[k] > 0).sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));
    return `<div style="margin-bottom:8px"><span class="chip ${t}">${t} ${TIERS[t].word} ${ids.length}/${PER_TIER[t]}</span>
      <div class="owned" style="margin-top:6px">${ids.map(k => `<span>${k}<b>×${owned[k]}</b></span>`).join("") || '<span style="color:var(--dim)">없음</span>'}</div></div>`;
  }).join("");
  const proofs = D.proofs.filter(p => String(p.sid) === String(sid));
  const ex = (D.exchanges || []).filter(x => String(x.sid) === String(sid));
  const gr = D.grants.filter(g => String(g.sid) === String(sid));
  const stLabel = { ok: "승인", no: "반려", wait: "대기" };

  const el = document.createElement("div");
  el.className = "drawer"; el.id = "drawer";
  el.innerHTML = `<div class="dp">
    <div class="dh"><div><h3>${esc(st.name)}</h3><div class="note">${esc(st.sid)}</div></div>
      <button class="btn gh sm" id="dx" style="margin-left:auto">닫기</button></div>

    <div class="sec"><h4>기본 정보</h4><dl class="kv">
      <dt>연락처</dt><dd>${esc(st.contact) || "-"}</dd>
      <dt>보유</dt><dd>${st.types} / ${TOTAL_CARDS}종</dd>
      <dt>미개봉 카드</dt><dd>${st.pending}장</dd>
      <dt>퀴즈 참여</dt><dd>${st.quizDone || 0}회</dd>
      <dt>추천인</dt><dd>${esc(st.ref) || "-"}</dd>
      <dt>내가 추천한 친구</dt><dd>${(st.refFrom || []).length}명</dd>
    </dl></div>

    <div class="sec"><h4>보유 카드</h4>${byTier}</div>

    <div class="sec"><h4>인증 ${proofs.length}건</h4>
      ${proofs.length ? proofs.map(p => `<div class="note" style="color:var(--foam)">${proofLabel(p.key)} ·
        <span class="chip ${p.status}">${stLabel[p.status] || p.status}</span> · ${when(p.at)}${p.status === "no" && p.reason ? ` · 사유: ${esc(p.reason)}` : ""}</div>`).join("") : '<div class="note">없음</div>'}</div>

    ${sanctionHTML(st, proofs)}

    <div class="sec"><h4>굿즈 교환</h4>
      ${ex.length ? ex.map(x => `<div class="note" style="color:var(--foam)"><span class="chip ${x.tier}">${x.tier}</span>
        ${esc(x.goods || "")} · ${x.status === "done" ? "지급 완료" : "신청(연락 예정)"} · ${when(x.doneAt || x.at)}</div>`).join("") : '<div class="note">없음</div>'}</div>

    <div class="sec"><h4>카드 지급·회수</h4>
      <div class="frm">
        <input id="gn" class="n" type="number" min="-100" max="100" placeholder="장수 (회수는 -3)">
        <input id="gr" placeholder="사유 (기록에 남습니다)">
        <button class="btn sm" id="ggo">반영</button>
      </div>
      <p class="note" style="margin:8px 0 0">학생이 다음에 앱을 열거나 저장할 때 미개봉 카드로 들어갑니다. 회수는 아직 뜯지 않은 카드에서만 빠집니다.
        잘못 넣었으면 아래 기록의 [취소]로 되돌리거나 [기록 삭제]로 기록만 지울 수 있습니다.</p>
      ${gr.length ? `<div style="margin-top:10px">${gr.map(g => `<div class="note grow">${when(g.at)} · ${grantAmt(g)}
        · ${esc(g.reason) || "사유 없음"} ${grantBtns(g)}</div>`).join("")}</div>` : ""}
    </div>

    <div class="sec"><h4>기록 삭제</h4>
      <p class="note" style="margin:0 0 10px">개인정보 삭제 요청 등에 씁니다. 이 학생의 카드·인증·설문·별점·교환·지급 기록과
        인증 캡처 파일이 지워지며 되돌릴 수 없습니다.</p>
      <div class="frm">
        <input id="dconf" placeholder="확인을 위해 학번 입력" inputmode="numeric">
        <button class="btn sm danger" id="dgo">이 학생 기록 삭제</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) closeStudent(); };
  el.querySelector("#dx").onclick = closeStudent;

  bindSanction(el, st);
  bindGrantBtns(el);

  el.querySelector("#ggo").onclick = async e => {
    const n = parseInt(el.querySelector("#gn").value, 10);
    const reason = el.querySelector("#gr").value.trim();
    if (!n || Math.abs(n) > 100) return toast("장수를 -100~100 사이로 넣어 주세요");
    if (!reason) return toast("사유를 적어 주세요 (지급 기록에 남습니다)");
    if (!(await grantCards(st.sid, n, reason, e.currentTarget))) return;
    openStudent(st.sid);
  };

  el.querySelector("#dgo").onclick = async e => {
    if (el.querySelector("#dconf").value.trim() !== String(st.sid)) return toast("학번을 정확히 입력해야 삭제됩니다");
    if (!api) return toast("서버에 연결된 상태에서만 쓸 수 있습니다");
    const b = e.currentTarget; b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    try {
      const j = await adminPost({ action: "deleteStudent", sid: st.sid });
      const keep = x => String(x.sid) !== String(st.sid);
      D.students = D.students.filter(keep); D.proofs = D.proofs.filter(keep);
      D.exchanges = (D.exchanges || []).filter(keep); D.surveys = D.surveys.filter(keep);
      D.ratings = D.ratings.filter(keep); D.grants = D.grants.filter(keep);
      closeStudent(); render();
      toast(`${st.name} 학생 기록을 삭제했습니다 (${j.removed}줄, 캡처 ${j.files}개)`);
    } catch (err) { b.disabled = false; b.textContent = "이 학생 기록 삭제"; toast(errMsg(err)); }
  };
}
function closeStudent() { const d = $("drawer"); if (d) d.remove(); }

/* ── 부정 참여 조치 (허위 인증 등) ──
   서버가 학생 기록에 직접 적용하고, 학생 폰에 남은 옛 기록으로 저장해도 다시 적용하므로 되살아나지 않는다. */
const OP_LABEL = { hide: "순위 제외", unhide: "순위 복구", revoke: "인증 반려 회수", take: "카드 골라서 회수", give: "반려 취소(돌려줌)",
                   rollback: "되돌리기", wipe: "카드 전부 회수" };
function logText(e) {
  if (e.k === "d") return `카드 ${(e.ids || []).length}장 뽑음 <span class="note">(${(e.ids || []).join(", ")})</span>`;
  const key = String(e.key || "");
  const what = key === "welcome" ? "시작 카드" : key === "invited" ? "추천인 입력" : key === "server" ? "추천·등대팀 지급"
    : key.indexOf("quiz:") === 0 ? "주간 퀴즈" : key.indexOf("event:") === 0 ? "이벤트 코드 " + esc(key.slice(6))
    : key.indexOf("survey:") === 0 ? "기간 설문" : key === "follow" || key.indexOf(":") > 0 ? proofLabel(key) + " 인증" : esc(key);
  return `카드 ${e.n}장 받음 · ${what}`;
}
function sanctionHTML(st, proofs) {
  const adm = st.adm || { hide: false, ops: [] };
  const ops = (adm.ops || []).slice().reverse();
  const revoked = k => !(st.claims || {})[k];      // 회수하면 인증 인정이 풀린다 → 재인증 대기
  const rejected = proofs.filter(p => p.status === "no");
  const owned = st.owned || {};
  const ids = Object.keys(owned).filter(k => owned[k] > 0)
    .sort((a, b) => TIER_KEYS.indexOf(a[0]) - TIER_KEYS.indexOf(b[0]) || parseInt(a.slice(1)) - parseInt(b.slice(1)));
  const log = Array.isArray(st.log) ? st.log.slice().reverse() : null;
  return `<div class="sec sanc"><h4>부정 참여 조치</h4>
    <p class="note" style="margin:0 0 10px">허위 인증 등으로 받은 카드를 회수하거나 순위에서 뺍니다. 모든 조치는 지급 기록에 남고,
      <b>여기 적은 사유가 학생 화면에 그대로 보입니다.</b> 학생 폰에 옛 기록이 남아 있어도 서버가 다시 적용합니다.</p>
    <div class="frm"><input id="sreason" placeholder="사유 — 학생 화면에 그대로 보입니다. 예: 다른 학생의 캡처를 사용했습니다"></div>

    <div class="sb">
      <div class="sbh"><b>순위</b>${adm.hide ? `<span class="chip no">제외됨</span>` : `<span class="chip ok">집계 중</span>`}</div>
      <p class="note">${adm.hide ? `순위 화면에서 빠져 있습니다${adm.hideReason ? " · " + esc(adm.hideReason) : ""}. 학생 본인 화면에는 '집계 제외 · 사유'로 보입니다.`
                                  : "순위에서 빼도 카드·인증 기록은 그대로입니다."}</p>
      <button class="btn sm ${adm.hide ? "gh" : "danger"}" data-sk="${adm.hide ? "unhide" : "hide"}">${adm.hide ? "순위에 다시 포함" : "순위에서 제외"}</button>
    </div>

    <div class="sb">
      <div class="sbh"><b>반려된 인증의 보상 회수</b></div>
      ${rejected.length ? rejected.map(p => `<div class="srow"><span>${proofLabel(p.key)} <span class="chip no">반려</span></span>
          ${revoked(p.key) ? `<span class="note">회수함 · 재인증 대기</span>`
            : `<button class="btn sm danger" data-rv="${esc(p.key)}">이 인증으로 받은 카드 회수</button>`}</div>`).join("")
        : `<p class="note">반려된 인증이 없습니다. 인증 검토 탭에서 반려하면 여기에 나옵니다.</p>`}
      ${rejected.length ? `<p class="note">이 인증으로 받은 카드와 그 카드로 뽑은 카드만 빼고, 그 전에 모은 카드는 그대로 둡니다.
        (이 기능 전에 참여해 획득 기록이 없으면 지급 장수만큼 미개봉 → 최근 카드 순으로 뺍니다)</p>` : ""}
    </div>

    <div class="sb">
      <div class="sbh"><b>카드 골라서 회수</b><span class="note">보유 ${st.types}종 · 미개봉 ${st.pending}장</span></div>
      ${ids.length ? `<div class="pick">${ids.map(k => `<label class="pk ${k[0]}"><span>${k}<b>×${owned[k]}</b></span>
          <input type="number" min="0" max="${owned[k]}" value="0" data-pk="${k}" inputmode="numeric"></label>`).join("")}</div>`
        : `<p class="note">보유한 카드가 없습니다.</p>`}
      <div class="frm" style="margin-top:8px">
        <label class="note" style="display:flex;align-items:center;gap:6px">미개봉에서
          <input id="spend" type="number" min="0" max="${st.pending}" value="0" style="width:72px" inputmode="numeric">장</label>
        <button class="btn sm danger" id="stake" style="margin-left:auto">고른 카드 회수</button>
      </div>
    </div>

    <div class="sb">
      <div class="sbh"><b>획득 기록에서 되돌리기</b><span class="note">최근 40건</span></div>
      ${log && log.length ? `<div class="logs">${log.map(e => `<div class="lr ${e.r ? "rv" : ""}">
          <span class="lt">${when(e.t)}</span><span class="lx">${logText(e)}${e.r ? ` <span class="note">· 되돌림</span>` : ""}</span>
          ${e.r ? "" : `<button class="lnk" data-rb="${e.t}">이 시점부터 되돌리기</button>`}</div>`).join("")}</div>
          <p class="note">고른 시점과 그 이후에 받은 카드·뽑은 카드를 모두 되돌립니다. (인증·퀴즈 참여 기록은 남습니다)</p>`
        : `<p class="note">획득 기록이 없습니다. 이 기능이 생기기 전에 참여한 학생은 '카드 골라서 회수'나 '전부 회수'를 써 주세요.</p>`}
    </div>

    <div class="sb">
      <div class="sbh"><b>카드 전부 회수</b></div>
      <p class="note">보유 카드와 미개봉 카드를 모두 0으로 만듭니다. 계정과 인증 기록은 남고, 이후 정상 참여하면 다시 모을 수 있습니다.</p>
      <div class="frm"><input id="wconf" placeholder="확인을 위해 학번 입력" inputmode="numeric">
        <button class="btn sm danger" id="swipe">전부 회수</button></div>
    </div>

    ${ops.length ? `<div class="sb"><div class="sbh"><b>조치 기록</b></div>${ops.map(o => `<div class="note">${when(o.at)} ·
        <b style="color:var(--foam)">${OP_LABEL[o.via || o.type] || o.type}</b>${o.key ? " · " + proofLabel(o.key) : ""}${
          o.type === "give" ? " 미개봉 " + (o.pending || 0) + "장"
          : o.cards ? " · 뽑은 카드 " + Object.values(o.cards).reduce((a, b) => a + b, 0) + "장" + (o.pending ? " + 미개봉 " + o.pending + "장" : "") : ""}${o.reason ? " · " + esc(o.reason) : ""}</div>`).join("")}</div>` : ""}
  </div>`;
}
async function sanction(st, body, btn) {
  if (!api) { toast("서버에 연결된 상태에서만 쓸 수 있습니다"); return false; }
  const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try {
    const j = await adminPost(Object.assign({ action: "sanction", sid: st.sid }, body));
    st.adm = j.adm;
    if (j.student) Object.assign(st, j.student);
    D.grants.unshift({ at: Date.now(), sid: String(st.sid), name: st.name, cards: 0,
                       reason: "[조치] " + (OP_LABEL[body.kind] || body.kind) + (body.reason ? " · " + body.reason : "") });
    render(); openStudent(st.sid);
    return true;
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = label; }
    toast(errMsg(err));
    return false;
  }
}
function bindSanction(el, st) {
  const why = () => el.querySelector("#sreason").value.trim();
  const need = () => { const r = why(); if (!r) { toast("사유를 먼저 적어 주세요"); el.querySelector("#sreason").focus(); } return r; };
  el.querySelectorAll("[data-sk]").forEach(b => b.onclick = async () => {
    const r = b.dataset.sk === "hide" ? need() : why();
    if (b.dataset.sk === "hide" && !r) return;
    if (await sanction(st, { kind: b.dataset.sk, reason: r }, b))
      toast(b.dataset.sk === "hide" ? `${st.name} 학생을 순위에서 뺐습니다` : `${st.name} 학생을 순위에 다시 넣었습니다`);
  });
  el.querySelectorAll("[data-rv]").forEach(b => b.onclick = async () => {
    const r = need(); if (!r) return;
    const k = b.dataset.rv, n = rewardFor(st, k);
    if (!confirm(`${st.name} 학생이 '${proofLabel(k)}' 인증으로 받은 카드(그걸로 뽑은 카드 포함)를 회수할까요?`)) return;
    if (await sanction(st, { kind: "revoke", key: k, n, reason: r }, b)) toast("이 인증으로 받은 카드를 회수했습니다");
  });
  const tk = el.querySelector("#stake");
  if (tk) tk.onclick = async () => {
    const cards = {}; let cnt = 0;
    el.querySelectorAll("[data-pk]").forEach(i => {
      const v = Math.max(0, Math.min(Number(i.max) || 0, parseInt(i.value, 10) || 0));
      if (v) { cards[i.dataset.pk] = v; cnt += v; }
    });
    const pend = Math.max(0, Math.min(st.pending || 0, parseInt(el.querySelector("#spend").value, 10) || 0));
    if (!cnt && !pend) return toast("회수할 카드 수를 넣어 주세요");
    const r = need(); if (!r) return;
    if (!confirm(`${st.name} 학생에게서 카드 ${cnt}장${pend ? ", 미개봉 " + pend + "장" : ""}을 회수할까요?`)) return;
    if (await sanction(st, { kind: "take", cards, pending: pend, reason: r }, tk)) toast("고른 카드를 회수했습니다");
  };
  el.querySelectorAll("[data-rb]").forEach(b => b.onclick = async () => {
    const r = need(); if (!r) return;
    const t = Number(b.dataset.rb);
    if (!confirm(`${when(t)} 이후에 받은 카드와 뽑은 카드를 모두 되돌릴까요?`)) return;
    if (await sanction(st, { kind: "rollback", after: t - 1, reason: r }, b)) toast("되돌렸습니다");
  });
  const wp = el.querySelector("#swipe");
  if (wp) wp.onclick = async () => {
    if (el.querySelector("#wconf").value.trim() !== String(st.sid)) return toast("학번을 정확히 입력해야 회수됩니다");
    const r = need(); if (!r) return;
    if (await sanction(st, { kind: "wipe", reason: r }, wp)) toast(`${st.name} 학생의 카드를 모두 회수했습니다`);
  };
}

/* 지급 기록 한 줄의 장수 표시 (회수는 미개봉에서만 빠지므로 실제로 빠진 장수가 다를 수 있다) */
function grantAmt(g) {
  if (!g.cards) return `<span class="minus">조치</span>`;
  const main = `<span class="${g.cards > 0 ? "plus" : "minus"}">${g.cards > 0 ? "+" : ""}${g.cards}</span>`;
  return g.actual != null && g.actual !== g.cards ? `${main} <span class="note">(실제 ${g.actual > 0 ? "+" : ""}${g.actual})</span>` : main;
}
function grantBtns(g) {
  const i = D.grants.indexOf(g);
  return `<span class="gbtn">${g.cards ? `<button class="lnk" data-gc="${i}">취소</button>` : ""}<button class="lnk" data-gd="${i}">기록 삭제</button></span>`;
}
async function grantRowAction(g, kind) {
  if (!api) return toast("서버에 연결된 상태에서만 쓸 수 있습니다");
  const label = g.cards > 0 ? `+${g.cards}장 지급` : g.cards < 0 ? `${-g.cards}장 회수` : "조치";
  if (kind === "delete" && !confirm(`이 ${label} 기록만 지울까요?\n학생의 카드는 바뀌지 않습니다.` + (g.cards ? `\n(카드도 원래대로 돌리려면 [취소]를 누르세요)` : ""))) return;
  if (kind === "cancel" && !confirm(`이 ${label}을 취소할까요?\n이 지급·회수로 바뀐 카드를 원래대로 돌리고 기록을 지웁니다.`)) return;
  const body = { action: kind === "delete" ? "grantDelete" : "grantCancel", sid: g.sid, at: g.at, cards: g.cards, reason: g.reason };
  try {
    let j;
    try { j = await adminPost(body); }
    catch (e) {
      if (!(e && e.message === "need amount")) throw e;
      const r = prompt(`예전 기록이라 이 회수로 실제 몇 장이 빠졌는지 남아 있지 않습니다.\n`
        + `회수는 미개봉 카드에서만 빠지므로 ${Math.abs(g.cards)}장보다 적었을 수 있습니다.\n\n`
        + `${g.cards < 0 ? "돌려줄" : "다시 뺄"} 장수를 적어 주세요. 0을 넣으면 카드는 그대로 두고 기록만 지웁니다.`, "");
      if (r === null) return;
      j = await adminPost(Object.assign(body, { amount: Math.max(0, parseInt(r, 10) || 0) }));
    }
    const sid = g.sid, open = !!$("drawer");
    await load();
    if (open) openStudent(sid);
    toast(kind === "delete" ? "기록을 지웠습니다"
      : j.back ? `취소했습니다 (미개봉 ${j.back > 0 ? "+" : ""}${j.back}장)` : "취소했습니다 (카드 변화 없음)");
  } catch (e) {
    toast(e && e.message === "not found" ? "기록을 찾지 못했습니다. [새로고침] 후 다시 해 주세요" : errMsg(e));
  }
}

/* 카드 지급·회수 (상세 창과 운영 화면이 같이 씀) */
async function grantCards(sid, n, reason, btn) {
  if (!api) { toast("서버에 연결된 상태에서만 쓸 수 있습니다"); return false; }
  const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try {
    const j = await adminPost({ action: "grant", sid, cards: n, reason });
    const st = D.students.find(x => String(x.sid) === String(sid));
    const act = typeof j.actual === "number" ? j.actual : n;
    if (st) st.pending = Math.max(0, (st.pending || 0) + act);
    D.grants.unshift({ at: j.at || Date.now(), sid: String(sid), name: st ? st.name : "", cards: n, reason, actual: act });
    toast(`${st ? st.name : sid} 학생에게 ${n > 0 ? n + "장 지급" : -n + "장 회수"}했습니다`
      + (n < 0 && act !== n ? ` (미개봉이 ${-act}장뿐이라 실제로는 ${-act}장만 빠졌습니다)` : ""));
    return true;
  } catch (err) {
    toast(errMsg(err));
    return false;
  } finally { if (btn) { btn.disabled = false; btn.textContent = label; } }
}

/* ── CSV ── */
function csv(rows, name) {
  const body = rows.map(r => r.map(c => {
    const v = String(c == null ? "" : c);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + body], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + "_" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

function bindGate() {
  const go = $("go");
  go.onclick = async () => {
    const v = ($("code").value || "").trim();
    if (!v) { V.err = "담당자 코드를 입력해 주세요."; return render(); }
    if (api) {
      go.disabled = true; go.innerHTML = '<span class="spin"></span>';
      try {
        const r = await fetch(CONFIG.API_URL + "?action=auth&admin=" + encodeURIComponent(v));
        const j = await r.json();
        if (!j.ok) {
          V.err = j.error === "no admin code" ? NO_CODE_MSG
                : j.error === "unknown action" ? "서버가 예전 버전입니다. apps-script.gs를 새 버전으로 배포한 뒤 다시 들어와 주세요."
                : "코드가 올바르지 않습니다.";
          V.errRaw = j.error || "";
          return render();
        }
      } catch (e) { V.err = "서버에 연결하지 못했습니다."; V.errRaw = String(e && e.message || e); return render(); }
    }
    ADMIN = v; authed = true; V.err = ""; V.errRaw = "";
    await load();
  };
  $("code").onkeydown = e => { if (e.key === "Enter") go.click(); };
  setTimeout(() => $("code") && $("code").focus(), 40);
  checkServer();
}

    if (r.trim() !== "마감") return toast("'마감'이라고 정확히 입력해야 마감됩니다");

    z.onclick = () => z.remove(); document.body.appendChild(z);
  });
  const rev = async (i, st, btn) => {
    const it = list[i];
    const who = D.students.find(x => String(x.sid) === String(it.sid));
    const n = rewardFor(who, it.key);

    if (st === "no") {

        + `· 이 인증으로 받은 카드 ${n}장과 그 카드로 뽑은 카드만 회수하고, 그 전에 모은 카드는 그대로 둡니다.\n`
        + `· 학생에게 재인증 요청이 뜹니다.`, "");

      if (!reason) return toast("반려 사유를 적어 주세요 (학생 화면에 보입니다)");

    try {
      const prev = it.status;
      const j = await review(it.sid, it.key, st, reason);
      it.status = st;
      const src = D.proofs.find(p => p.sid === it.sid && p.key === it.key);

        if (sc.student) Object.assign(who, sc.student);
        if (sc.desc) D.grants.unshift({ at: Date.now(), sid: String(who.sid), name: who.name, cards: 0, reason: "[조치] " + sc.desc });

  bindGrantBtns(app);
  $("rankcsv") && ($("rankcsv").onclick = () => {
    const l = rankList(); l.forEach((x, i) => { if (x.rank === null) x.rank = l[i - 1].rank; });
    csv([["등수", "이름", "학번", "종수", "26종 완성 시각", "연락처", "교환 등급", "미개봉"]].concat(l.map(x =>
      [x.rank, x.name, x.sid, x.types, x.done ? new Date(x.done).toLocaleString("ko-KR") : "", x.contact, x.exchanged, x.pending])),
      "순위_" + new Date().toISOString().slice(0, 10));
  });
  $("grcsv") && ($("grcsv").onclick = () => {
    const rows = [["시각", "이름", "학번", "장수", "실제 반영", "사유"]];
    D.grants.forEach(g => rows.push([g.at ? new Date(g.at).toLocaleString("ko-KR") : "", g.name, g.sid, g.cards, g.actual == null ? "" : g.actual, g.reason]));
    csv(rows, "카드지급기록");
  });
  app.querySelectorAll("[data-no]").forEach(b => b.onclick = () => rev(+b.dataset.no, "no", b));
  app.querySelectorAll("[data-re]").forEach(b => b.onclick = () => rev(+b.dataset.re, "wait", b));

  // 검색
  const q = $("q");
  if (q) {
    q.oninput = () => { V.q = q.value; const p = q.selectionStart; render();
      const n = $("q"); if (n) { n.focus(); n.setSelectionRange(p, p); } };
  }

  // CSV
  $("csv") && ($("csv").onclick = () => csv(
    [["이름", "학번", "보유종수", "C", "B", "A", "S", "미개봉", "퀴즈참여", "교환등급"]].concat(
      D.students.map(s => [s.name, s.sid, s.types].concat(TIER_KEYS.map(t => tierDone(s, t)))
        .concat([s.pending, s.quizDone || 0, s.exchanged || ""]))), "참여자"));
  $("csvsv") && ($("csvsv").onclick = () => csv(
    [["주차", "학번", "이름", "질문", "선택한 답", "직접 입력"]].concat(
      D.surveys.filter(s => !pollOf(s)).map(s => [s.week, s.sid, s.name, s.q, s.answer, s.etc])), "퀴즈설문응답"));
  app.querySelectorAll("[data-pollcsv]").forEach(el => el.onclick = () => {
    const g = pollGroups().find(x => x.id === el.dataset.pollcsv);
    if (!g) return;
    const head = ["학번", "이름", "응답시각"];
    g.qs.forEach(q => head.push(q, q + " (직접 입력)"));
    csv([head].concat(g.people.map(p => [p.sid, p.name, p.at ? new Date(p.at).toLocaleString("ko-KR") : ""]
      .concat(...g.qs.map(q => { const a = p.a[q] || {}; return [a.answer || "", a.etc || ""]; })))), "기간설문_" + g.id);
  });
  $("csvrt") && ($("csvrt").onclick = () => csv(
    [["학번", "이름", "프로그램", "별점", "한 줄 후기"]].concat(
      D.ratings.map(r => [r.sid, r.name, r.program, r.score, r.memo])), "만족도"));
  $("csvref") && ($("csvref").onclick = () => {
    const rows = [["추천한 학생", "추천인 학번", "데려온 학생", "학번", "프로그램 인증"]];
    D.students.forEach(s => {
      if (!s.ref) return;
      const r = D.students.find(x => String(x.sid) === String(s.ref));
      const j = Object.keys(s.claims || {}).some(k => k.indexOf("apply:") === 0 || k.indexOf("done:") === 0);
      rows.push([r ? r.name : "(미가입)", s.ref, s.name, s.sid, j ? "O" : "X"]);
    });
    csv(rows, "추천현황");
  });
  $("csvex") && ($("csvex").onclick = () => {
    const rows = [["이름", "학번", "등급", "선물", "연락처", "지급시각"]];
    (D.exchanges || []).filter(x => x.status === "done").forEach(x =>
      rows.push([x.name, x.sid, x.tier, x.goods || (TIERS[x.tier] ? TIERS[x.tier].goods : ""),
                 x.contact || "", x.doneAt ? new Date(x.doneAt).toLocaleString("ko-KR") : ""]));
    csv(rows, "교환내역");
  });

  // 교환 지급 처리 / 되돌리기
  const exList = (D.exchanges || []).slice();
  const waiting = exList.filter(x => x.status !== "done").sort((a, b) => (a.at || 0) - (b.at || 0));
  const paid    = exList.filter(x => x.status === "done").sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const setEx = async (item, status, btn) => {
    if (!item) return;
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      await exchangeDone(item.sid, item.tier, status);
      const src = (D.exchanges || []).find(x => x.sid === item.sid && x.tier === item.tier);
      if (src) { src.status = status; src.doneAt = status === "done" ? Date.now() : 0; }
      toast(status === "done" ? "지급 완료로 처리했습니다" : "신청 대기로 되돌렸습니다");
      render();
    } catch (e) {
      btn.disabled = false; btn.textContent = status === "done" ? "지급 완료" : "되돌리기";
      toast("처리에 실패했습니다");
    }
  };
  app.querySelectorAll("[data-give]").forEach(b =>
    b.onclick = () => setEx(waiting[+b.dataset.give], "done", b));
  app.querySelectorAll("[data-undo]").forEach(b =>
    b.onclick = () => setEx(paid[+b.dataset.undo], "req", b));
}

async function exchangeDone(sid, tier, status) {
  if (api) { await adminPost({ action: "exchangeDone", sid, tier, status }); return; }
  const raw = localStorage.getItem("dingle:" + sid);
  if (!raw) return;
  const d = JSON.parse(raw);
  d.exchanged = d.exchanged || {};
  d.exchanged[tier] = Object.assign({ at: Date.now() }, d.exchanged[tier], { status });
  localStorage.setItem("dingle:" + sid, JSON.stringify(d));
}

/* 등대팀 전용 요청. 담당자 코드를 붙여 보내고, 서버가 거절하면 예외를 던진다. */
async function adminPost(body) {
  const r = await fetch(CONFIG.API_URL, {
    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({}, body, { admin: ADMIN })),
  });
  const j = await r.json();
  if (!j || j.ok !== true) throw new Error((j && j.error) || "failed");
  return j;
}

async function review(sid, key, status, reason) {
  if (api) return await adminPost({ action: "review", sid, key, status, n: rewardOf(key), reason: reason || "" });
  const raw = localStorage.getItem("dingle:" + sid);
  if (!raw) return;
  const d = JSON.parse(raw);
  if (d.proofs && d.proofs[key]) d.proofs[key].status = status;
  localStorage.setItem("dingle:" + sid, JSON.stringify(d));
}

render();
</script>
