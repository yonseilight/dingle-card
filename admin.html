<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딩글이 카드 도감 · 등대팀 관리자</title>
<style>
  :root{
    --deep:#060D1C; --sea:#101E3A; --sea2:#17274A; --line:rgba(255,255,255,.08);
    --beam:#FFC94A; --beam2:#FFE6A8; --foam:#EEF3FB; --mist:#93A6C6; --dim:#7387AD;
    --cC:#8397B2; --cB:#3FC4B2; --cA:#A87BF0; --cS:#FFC94A;
    --ok:#4ED8A0; --bad:#FF9A8B; --info:#6FA8E8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:radial-gradient(120% 55% at 50% -4%,#16294D 0%,var(--deep) 58%) no-repeat,var(--deep);
    background-attachment:fixed;color:var(--foam);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  :focus-visible{outline:2px solid var(--beam);outline-offset:2px}
  button,input,select{font-family:inherit}
  button{cursor:pointer}
  a{color:var(--beam)}

  /* 로그인 */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate .box{width:100%;max-width:340px;text-align:center}
  .gate h1{font-size:23px;margin:0 0 6px}
  .gate p{color:var(--mist);font-size:13px;margin:0 0 22px}
  .gate input{width:100%;padding:13px 14px;font-size:16px;background:rgba(255,255,255,.05);
    border:1px solid rgba(143,163,196,.3);border-radius:10px;color:var(--foam);outline:none;margin-bottom:10px}
  .gate input:focus{border-color:var(--beam)}
  .btn{width:100%;padding:13px;font-size:15px;font-weight:700;background:var(--beam);
    color:#16233D;border:none;border-radius:10px}
  .btn:hover{filter:brightness(1.06)}
  .btn.sm{width:auto;padding:8px 15px;font-size:13px;border-radius:8px}
  .btn.gh{background:transparent;color:var(--foam);border:1px solid rgba(143,163,196,.35)}
  .btn.gh:hover{border-color:var(--beam);color:var(--beam)}
  .err{color:var(--bad);font-size:12.5px;margin-top:10px}

  /* 레이아웃 */
  .top{position:sticky;top:0;z-index:20;background:rgba(11,23,48,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .topin{max-width:1180px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:14px}
  .brand{font-weight:800;font-size:16px;white-space:nowrap}
  .brand span{color:var(--beam)}
  .tabs{display:flex;gap:3px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:9px 14px;font-size:13.5px;font-weight:600;background:none;border:none;color:var(--mist);
    border-radius:8px;white-space:nowrap}
  .tab:hover{color:var(--foam);background:rgba(255,255,255,.05)}
  .tab.on{color:#16233D;background:var(--beam)}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}

  /* 카드/표 */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin-bottom:22px}
  .kpi{background:var(--sea);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .kpi .l{font-size:12px;color:var(--mist);margin-bottom:6px}
  .kpi .v{font-size:26px;font-weight:800;line-height:1.1}
  .kpi .s{font-size:11.5px;color:var(--dim);margin-top:5px}
  .kpi.hl{border-color:rgba(247,201,72,.5);background:rgba(247,201,72,.08)}
  .kpi.hl .v{color:var(--beam)}

  .panel{background:var(--sea);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden}
  .ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .ph h2{margin:0;font-size:15px;font-weight:700}
  .ph .sub{font-size:12px;color:var(--mist)}
  .ph .right{margin-left:auto;display:flex;gap:7px;align-items:center}
  .pb{padding:16px}
  .pb.flush{padding:0}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:11px 14px;background:rgba(0,0,0,.2);color:var(--mist);font-weight:600;
    font-size:12px;white-space:nowrap;position:sticky;top:0}
  td{padding:11px 14px;border-top:1px solid rgba(143,163,196,.12);vertical-align:middle}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .scroll{max-height:520px;overflow:auto}

  .chip{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .chip.C{background:rgba(124,143,168,.2);color:#B6C4D8;border:1px solid rgba(124,143,168,.5)}
  .chip.B{background:rgba(63,182,168,.16);color:#8FE3D6;border:1px solid rgba(63,182,168,.5)}
  .chip.A{background:rgba(161,118,232,.16);color:#CFB6F5;border:1px solid rgba(161,118,232,.5)}
  .chip.S{background:rgba(247,201,72,.16);color:var(--beam2);border:1px solid rgba(247,201,72,.5)}
  .chip.wait{background:rgba(143,163,196,.16);color:var(--mist);border:1px solid rgba(143,163,196,.4)}
  .chip.ok{background:rgba(78,216,160,.16);color:#7FE9C0;border:1px solid rgba(78,216,160,.45)}
  .chip.no{background:rgba(255,154,139,.14);color:var(--bad);border:1px solid rgba(255,154,139,.45)}

  .bar{height:9px;background:rgba(0,0,0,.28);border-radius:999px;overflow:hidden;min-width:90px}
  .bar i{display:block;height:100%;border-radius:999px}

  input.search,select.sel{padding:8px 11px;font-size:13px;background:rgba(0,0,0,.25);
    border:1px solid rgba(143,163,196,.3);border-radius:8px;color:var(--foam);outline:none}
  input.search:focus,select.sel:focus{border-color:var(--beam)}
  select.sel option{background:#12233F}

  .rev{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:13px}
  .rc{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .rc .rh{padding:11px 13px;display:flex;align-items:center;gap:8px;font-size:13px}
  .rc .rh b{font-weight:700}
  .rc .rh .sid{color:var(--mist);font-size:11.5px}
  .rc{position:relative}
  .rc img{width:100%;height:210px;object-fit:contain;object-position:top;background:#0A1428;
    display:block;cursor:zoom-in}
  .rc img.bad{min-height:210px}
  .rc img.bad+.openorig{background:rgba(255,154,139,.16);border-color:rgba(255,154,139,.5);
    color:var(--bad)}
  .rc .openorig{position:absolute;right:10px;top:46px;z-index:4;font-size:11px;
    background:rgba(11,23,48,.85);border:1px solid rgba(143,163,196,.4);color:var(--mist);
    padding:4px 9px;border-radius:999px;text-decoration:none}
  .rc .openorig:hover{border-color:var(--beam);color:var(--beam)}
  a.tel{color:var(--beam2);text-decoration:none;font-variant-numeric:tabular-nums}
  a.tel:hover{text-decoration:underline}
  .rc .ra{display:flex;gap:6px;padding:11px 13px}
  .rc .ra button{flex:1;padding:9px;font-size:12.5px;font-weight:700;border-radius:8px;border:none}
  .rc .ra .y{background:rgba(78,216,160,.18);color:#7FE9C0;border:1px solid rgba(78,216,160,.45)}
  .rc .ra .n{background:rgba(255,154,139,.14);color:var(--bad);border:1px solid rgba(255,154,139,.45)}
  .rc .done{padding:12px;text-align:center;font-size:12.5px}

  .qcard{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:12px}
  .qcard h3{margin:0 0 3px;font-size:14.5px}
  .qcard .meta{font-size:11.5px;color:var(--mist);margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
  .row .lb{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .bar{flex:1}
  .row .n{width:64px;text-align:right;color:var(--mist);font-size:12px;font-variant-numeric:tabular-nums}
  .memos{margin-top:12px;padding-top:12px;border-top:1px solid rgba(143,163,196,.15)}
  .memo{font-size:12.5px;color:var(--foam);background:rgba(0,0,0,.2);border-radius:8px;
    padding:9px 11px;margin-bottom:6px;line-height:1.5}
  .memo b{color:var(--mist);font-weight:600;font-size:11px}

  .empty{padding:44px 16px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(143,163,196,.3);
    border-top-color:var(--beam);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .zoom{position:fixed;inset:0;z-index:300;background:rgba(4,9,20,.95);display:flex;
    align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .zoom img{max-width:100%;max-height:100%;border-radius:10px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(20,38,74,.97);
    border:1px solid var(--beam);color:var(--beam2);padding:11px 20px;border-radius:999px;
    font-size:13.5px;z-index:400;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .note{font-size:12px;color:var(--dim);line-height:1.7}
  /* 학생 상세 */
  .drawer{position:fixed;inset:0;z-index:200;background:rgba(4,9,20,.72);display:flex;justify-content:flex-end}
  .drawer .dp{width:100%;max-width:540px;height:100%;overflow-y:auto;background:var(--sea);
    border-left:1px solid var(--line);padding:22px 22px 70px;animation:dIn .22s ease}
  @keyframes dIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
  .dp .dh{display:flex;align-items:flex-start;gap:10px}
  .dp h3{margin:0;font-size:21px}
  .dp .sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  .dp .sec h4{margin:0 0 10px;font-size:13px;color:var(--mist);font-weight:700}
  .kv{display:grid;grid-template-columns:112px 1fr;gap:7px 12px;font-size:13.5px;margin:0}
  .kv dt{color:var(--dim)} .kv dd{margin:0}
  .frm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .frm input,.frm textarea{flex:1;min-width:0;padding:10px 12px;font-size:14px;background:rgba(255,255,255,.05);
    border:1px solid rgba(143,163,196,.3);border-radius:9px;color:var(--foam);outline:none;font-family:inherit}
  .frm input.n{flex:0 0 120px}
  .frm textarea{width:100%;min-height:78px;resize:vertical}
  .frm input:focus,.frm textarea:focus{border-color:var(--beam)}
  .btn.danger{background:rgba(255,154,139,.15);color:var(--bad);border:1px solid rgba(255,154,139,.4)}
  .owned{display:flex;flex-wrap:wrap;gap:5px}
  .owned span{font-size:12px;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.05)}
  .owned span b{margin-left:4px;color:var(--beam)}
  .plus{color:#7FE9C0;font-weight:800} .minus{color:var(--bad);font-weight:800}
  .vwarn{background:rgba(255,154,139,.12);color:#FFD5CD;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:16px}
  @media(max-width:640px){
    .topin{flex-wrap:wrap} .tabs{margin-left:0;width:100%;order:3}
    .row .lb{width:104px}
  }
</style>
</head>
<body>
<div id="app"><div class="gate"><span class="spin"></span></div></div>

<script>
/* ═══════════════════════════════════════════════
   딩글이 카드 도감 — 등대팀 관리자
   ═══════════════════════════════════════════════ */

/* ── 설정: 학생용 index.html과 동일하게 맞춰주세요 ── */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbzG9m2zMqCLCkxWinagr5fRNIL_0e0Cm51GG9BhK_0mzXu0fOxqbyiZe8WjqFjbZ-T8qw/exec",                 // Apps Script 웹앱 주소
  // 담당자 코드는 여기 두지 않습니다. Apps Script → 프로젝트 설정 → 스크립트 속성의 ADMIN_CODE에 둡니다.
  CAP: 3,
};

const TIERS = {
  C: { color: "#7C8FA8", word: "일반", goods: "소정의 선물" },
  B: { color: "#3FB6A8", word: "희귀", goods: "조금 더 좋은 선물" },
  A: { color: "#A176E8", word: "영웅", goods: "더 좋은 선물" },
  S: { color: "#F7C948", word: "전설", goods: "특별 선물" },
};
const TIER_KEYS = ["C", "B", "A", "S"];
const PER_TIER = { C: 7, B: 7, A: 7, S: 5 };      // 등급별 카드 종수
const TOTAL_CARDS = TIER_KEYS.reduce((a, t) => a + PER_TIER[t], 0);

const PROGRAMS = [
  { id: "p1", name: "학습동아리" },
  { id: "p2", name: "학습튜터링" },
  { id: "p3", name: "학습법 특강" },
  { id: "p4", name: "학습코칭 상담" },
  { id: "p5", name: "의사소통코칭" },
  { id: "p6", name: "의사소통 워크숍" },
];

const api = CONFIG.API_URL && CONFIG.API_URL.indexOf("http") === 0;

let D = { students: [], proofs: [], surveys: [], ratings: [], exchanges: [], grants: [], meta: {} };
let ADMIN = "";        // 로그인 때 입력한 담당자 코드 (이 창을 닫으면 사라짐)
let V = { tab: "home", loading: false, q: "", revFilter: "wait", err: "" };

const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function toast(m) {
  const e = document.createElement("div");
  e.className = "toast"; e.textContent = m;
  document.body.appendChild(e);
  setTimeout(() => e.remove(), 2200);
}

/* 구글 드라이브 주소를 이미지로 표시 가능한 형태로 바꾼다.
   예전에 저장된 uc?export=view 주소도 자동 변환된다. */
function driveId(u) {
  const t = String(u || "");
  if (t.indexOf("google") < 0) return "";   // data: 주소 등은 그대로 둔다
  const m = t.match(/[-\w]{25,}/);          // 드라이브 파일 ID
  return m ? m[0] : "";
}
function imgUrl(u) {
  u = String(u || "");
  const id = driveId(u);
  return id ? "https://drive.google.com/thumbnail?id=" + id + "&sz=w1200" : u;
}
function origUrl(u) {
  const id = driveId(u);
  return id ? "https://drive.google.com/file/d/" + id + "/view" : String(u || "");
}
/* 썸네일 주소가 실패하면 lh3 주소로 한 번 더 시도한다 */
function admImgFallback(im) {
  const id = im.getAttribute("data-id") || "";
  if (id && !im.getAttribute("data-retry")) {
    im.setAttribute("data-retry", "1");
    im.src = "https://lh3.googleusercontent.com/d/" + id + "=w1200";
    return;
  }
  im.classList.add("bad");
}

function proofLabel(key) {
  if (key === "follow") return "인스타 팔로우";
  const a = String(key).split(":");
  const p = PROGRAMS.find(x => x.id === a[1]);
  const nm = p ? p.name : a[1];
  return a[0] === "apply" ? nm + " 신청" : nm + " 완료";
}

/* ── 데이터 로드 ── */
async function load() {
  V.loading = true; render();
  try {
    if (api) {
      const r = await fetch(CONFIG.API_URL + "?action=admin&admin=" + encodeURIComponent(ADMIN));
      const j = await r.json();
      if (!j.ok) {
        authed = false; V.loading = false;
        V.err = j.error === "no admin code" ? NO_CODE_MSG : "담당자 코드가 맞지 않습니다. 다시 입력해 주세요.";
        return render();
      }
      D = { students: j.students || [], proofs: j.proofs || [], surveys: j.surveys || [],
            ratings: j.ratings || [], exchanges: j.exchanges || [], grants: j.grants || [],
            meta: { v: j.v || "", epoch: j.epoch || "", notice: j.notice || null } };
    } else {
      D = fromLocal();
    }
    V.err = "";
  } catch (e) {
    V.err = "데이터를 불러오지 못했습니다. API 주소를 확인해 주세요.";
  }
  V.loading = false; render();
}

/* 서버 없이 이 기기에서 테스트할 때 */
function fromLocal() {
  const out = { students: [], proofs: [], surveys: [], ratings: [], exchanges: [] };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || k.indexOf("dingle:") !== 0) continue;
    let d; try { d = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
    const owned = d.owned || {};
    out.students.push({
      sid: d.sid, name: d.name, owned: owned, claims: d.claims || {}, proofs: d.proofs || {},
      types: Object.keys(owned).filter(x => owned[x] > 0).length,
      pending: d.pending || 0,
      exchanged: Object.keys(d.exchanged || {})
        .filter(t => { const x = d.exchanged[t]; return !x || typeof x !== "object" || x.status === "done"; })
        .join(","),
      quizDone: (d.quizDone || []).length, at: d.createdAt || 0,
      ref: d.ref || "", refFrom: d.refFrom || [], contact: d.contact || "",
    });
    Object.keys(d.proofs || {}).forEach(key => {
      const pr = d.proofs[key];
      out.proofs.push({ sid: d.sid, name: d.name, key, at: pr.at, status: pr.status || "wait", img: pr.img });
    });
    (d.surveys || []).forEach(sv => out.surveys.push(Object.assign({ sid: d.sid, name: d.name }, sv)));
    Object.keys(d.ratings || {}).forEach(pid => {
      const rt = d.ratings[pid];
      out.ratings.push({ sid: d.sid, name: d.name, program: rt.program, score: rt.score || 0, memo: rt.memo || "" });
    });
    Object.keys(d.exchanged || {}).forEach(t => {
      const x = d.exchanged[t] || {};
      out.exchanges.push({ sid: d.sid, name: d.name, tier: t, goods: TIERS[t] ? TIERS[t].goods : "",
        contact: x.contact || d.contact || "", at: x.at || 0,
        status: typeof x === "object" && x.status ? x.status : "done", doneAt: 0 });
    });
  }
  return out;
}

/* ── 집계 ── */
function tierDone(st, t) {
  const o = st.owned || {};
  let n = 0;
  for (let i = 1; i <= PER_TIER[t]; i++) if ((o[t + i] || 0) > 0) n++;
  return n;
}
function stats() {
  const s = { total: D.students.length, cards: 0, wait: 0, exch: 0, comp: { C: 0, B: 0, A: 0, S: 0 }, full: 0 };
  D.students.forEach(st => {
    const o = st.owned || {};
    Object.keys(o).forEach(k => s.cards += o[k]);
    TIER_KEYS.forEach(t => { if (tierDone(st, t) === PER_TIER[t]) s.comp[t]++; });
    if (TIER_KEYS.every(t => tierDone(st, t) === PER_TIER[t])) s.full++;
    s.exch += String(st.exchanged || "").split(",").filter(Boolean).length;
  });
  s.wait = D.proofs.filter(p => p.status === "wait").length;
  return s;
}

const NO_CODE_MSG = "서버에 담당자 코드가 아직 없습니다. Apps Script 편집기 → 왼쪽 톱니바퀴(프로젝트 설정) → 스크립트 속성 → 속성 ADMIN_CODE, 값에 원하는 코드를 넣고 저장해 주세요.";

/* ── 화면: 로그인 ── */
function viewGate() {
  return `
    <div class="gate"><div class="box">
      <h1>등대팀 관리자</h1>
      <p>딩글이 카드 도감 운영 화면입니다</p>
      <input id="code" type="password" placeholder="담당자 코드" autocomplete="off">
      <button class="btn" id="go">들어가기</button>
      ${V.err ? `<div class="err">${esc(V.err)}</div>` : ""}
      <p class="note" style="margin-top:20px">
        ${api ? "서버에 연결되어 있습니다" : "API 주소가 비어 있어 이 기기의 데이터만 표시됩니다"}
      </p>
    </div></div>`;
}

/* ── 화면: 공통 틀 ── */
function shell(inner) {
  const tabs = [["home", "현황"], ["review", "인증 검토"], ["students", "참여자"],
                ["referral", "추천"], ["survey", "설문"], ["rating", "만족도"], ["exchange", "교환"], ["ops", "운영"]];
  const w = D.proofs.filter(p => p.status === "wait").length;
  return `
    <div class="top"><div class="topin">
      <div class="brand">딩글이 카드 도감 <span>관리자</span></div>
      <div class="tabs">
        ${tabs.map(([k, l]) => `<button class="tab ${V.tab === k ? "on" : ""}" data-tab="${k}">
          ${l}${k === "review" && w ? " " + w : ""}</button>`).join("")}
      </div>
      <button class="btn gh sm" id="reload">${V.loading ? '<span class="spin"></span>' : "새로고침"}</button>
    </div></div>
    <div class="wrap">${api && D.meta && D.meta.v && D.meta.v < SERVER_EXPECT
      ? `<div class="vwarn">서버가 예전 버전(${esc(D.meta.v)})입니다. 카드 지급·공지·학생 삭제가 동작하지 않을 수 있으니 apps-script.gs를 새 버전으로 배포해 주세요.</div>` : ""}${inner}</div>`;
}

/* ── 현황 ── */
function viewHome() {
  const s = stats();
  const avg = s.total ? (s.cards / s.total).toFixed(1) : "0";
  const rate = s.total ? Math.round(D.students.filter(x => x.types > 0).length / s.total * 100) : 0;

  return shell(`
    <div class="cards">
      <div class="kpi"><div class="l">참여 학생</div><div class="v">${s.total}</div>
        <div class="s">카드를 1장 이상 받은 학생 ${Math.round(rate)}%</div></div>
      <div class="kpi"><div class="l">지급된 카드</div><div class="v">${s.cards.toLocaleString()}</div>
        <div class="s">1인 평균 ${avg}장</div></div>
      <div class="kpi ${s.wait ? "hl" : ""}"><div class="l">검토 대기</div><div class="v">${s.wait}</div>
        <div class="s">${s.wait ? "확인이 필요합니다" : "모두 처리했습니다"}</div></div>
      <div class="kpi"><div class="l">교환 완료</div><div class="v">${s.exch}</div>
        <div class="s">전 등급 완성 ${s.full}명</div></div>
    </div>

    <div class="panel">
      <div class="ph"><h2>등급별 완성자</h2><span class="sub">한 등급을 모두 모은 학생 수</span></div>
      <div class="pb">
        ${TIER_KEYS.map(t => {
          const n = s.comp[t], pct = s.total ? Math.round(n / s.total * 100) : 0;
          return `<div class="row">
            <div class="lb"><span class="chip ${t}">${t} ${TIERS[t].word}</span></div>
            <div class="bar"><i style="width:${pct}%;background:${TIERS[t].color}"></i></div>
            <div class="n">${n}명 · ${pct}%</div></div>`;
        }).join("")}
      </div>
    </div>

    <div class="panel">
      <div class="ph"><h2>참여 경로별 인원</h2><span class="sub">해당 항목으로 카드를 받은 학생 수</span></div>
      <div class="pb">
        ${routeRows()}
      </div>
    </div>
  `);
}

function routeRows() {
  const rows = [];
  const N = D.students.length || 1;
  const count = pred => D.students.filter(st => Object.keys(st.claims || {}).some(pred)).length;

  rows.push(["인스타 팔로우", count(k => k === "follow")]);
  rows.push(["퀴즈 참여", D.students.filter(st => (st.quizDone || 0) > 0).length]);
  PROGRAMS.forEach(p => {
    rows.push([p.name + " 신청", count(k => k === "apply:" + p.id)]);
    rows.push([p.name + " 완료", count(k => k === "done:" + p.id)]);
  });
  rows.push(["이벤트 코드", count(k => k.indexOf("event:") === 0)]);

  return rows.map(([l, n]) => {
    const pct = Math.round(n / N * 100);
    return `<div class="row"><div class="lb">${esc(l)}</div>
      <div class="bar"><i style="width:${pct}%;background:var(--info)"></i></div>
      <div class="n">${n}명</div></div>`;
  }).join("");
}

            </tr>`).join("") : `<tr><td colspan="11"><div class="empty">참여자가 없습니다.</div></td></tr>`}

/* ── 설문 ── */
function viewSurvey() {
  const byQ = {};
  D.surveys.forEach(s => {
    if (!byQ[s.q]) byQ[s.q] = { total: 0, ans: {}, etc: [], weeks: {} };
    const g = byQ[s.q];
    g.total++;
    if (s.answer) g.ans[s.answer] = (g.ans[s.answer] || 0) + 1;
    if (s.etc) g.etc.push({ name: s.name, t: s.etc });
    if (s.week) g.weeks[s.week] = true;
  });
  const keys = Object.keys(byQ);

  return shell(`
    <div class="panel">
      <div class="ph"><h2>설문 응답</h2>
        <span class="sub">총 ${D.surveys.length}건 · 문항 ${keys.length}개</span>
        <div class="right"><button class="btn gh sm" id="csvsv">CSV 내려받기</button></div>
      </div>
      <div class="pb">
        ${keys.length ? keys.map(q => {
          const g = byQ[q];
          const opts = Object.keys(g.ans).sort((a, b) => g.ans[b] - g.ans[a]);
          const max = Math.max(1, ...opts.map(o => g.ans[o]));
          return `<div class="qcard">
            <h3>${esc(q)}</h3>
            <div class="meta">응답 ${g.total}건 · ${Object.keys(g.weeks).length}개 주차</div>
            ${opts.map(o => {
              const n = g.ans[o], pct = Math.round(n / g.total * 100);
              return `<div class="row"><div class="lb">${esc(o)}</div>
                <div class="bar"><i style="width:${Math.round(n / max * 100)}%;background:var(--info)"></i></div>
                <div class="n">${n}건 · ${pct}%</div></div>`;
            }).join("")}
            ${g.etc.length ? `<div class="memos">
              <div class="meta" style="margin-bottom:8px">직접 입력 ${g.etc.length}건</div>
              ${g.etc.slice(0, 30).map(e => `<div class="memo"><b>${esc(e.name)}</b> · ${esc(e.t)}</div>`).join("")}
              ${g.etc.length > 30 ? `<div class="note">외 ${g.etc.length - 30}건 — CSV에서 전체를 볼 수 있습니다</div>` : ""}
            </div>` : ""}
          </div>`;
        }).join("") : `<div class="empty">아직 설문 응답이 없습니다.<br>학생이 퀴즈를 풀면 이곳에 쌓입니다.</div>`}
      </div>
    </div>`);
}

/* ── 만족도 ── */
function viewRating() {
  const byP = {};
  D.ratings.forEach(r => {
    const k = r.program || "기타";
    if (!byP[k]) byP[k] = { n: 0, sum: 0, cnt: 0, memos: [] };
    byP[k].n++;
    if (r.score) { byP[k].sum += r.score; byP[k].cnt++; }
    if (r.memo) byP[k].memos.push({ name: r.name, t: r.memo, s: r.score });
  });
  const keys = Object.keys(byP).sort((a, b) => (byP[b].cnt ? byP[b].sum / byP[b].cnt : 0) - (byP[a].cnt ? byP[a].sum / byP[a].cnt : 0));

  return shell(`
    <div class="panel">
      <div class="ph"><h2>프로그램 만족도</h2>
        <span class="sub">활동 완료 인증 시 받은 응답 ${D.ratings.length}건</span>
        <div class="right"><button class="btn gh sm" id="csvrt">CSV 내려받기</button></div>
      </div>
      <div class="pb">
        ${keys.length ? keys.map(k => {
          const g = byP[k];
          const avg = g.cnt ? (g.sum / g.cnt) : 0;
          return `<div class="qcard">
            <h3>${esc(k)}</h3>
            <div class="meta">응답 ${g.n}건 · 별점 ${g.cnt}건</div>
            <div class="row">
              <div class="lb" style="color:var(--beam);font-weight:800;font-size:17px">
                ${g.cnt ? avg.toFixed(1) : "-"}<span style="font-size:12px;color:var(--mist);font-weight:400"> / 5</span></div>
              <div class="bar"><i style="width:${avg / 5 * 100}%;background:var(--beam)"></i></div>
              <div class="n">${"★".repeat(Math.round(avg))}</div>
            </div>
            ${g.memos.length ? `<div class="memos">
              ${g.memos.slice(0, 20).map(m => `<div class="memo">
                <b>${esc(m.name)}${m.s ? " · " + "★".repeat(m.s) : ""}</b><br>${esc(m.t)}</div>`).join("")}
              ${g.memos.length > 20 ? `<div class="note">외 ${g.memos.length - 20}건</div>` : ""}
            </div>` : ""}
          </div>`;
        }).join("") : `<div class="empty">아직 만족도 응답이 없습니다.<br>학생이 활동 완료를 인증하면 이곳에 쌓입니다.</div>`}
      </div>
    </div>`);
}

/* ── 추천 ── */
function viewReferral() {
  const byRef = {};
  D.students.forEach(s => {
    if (!s.ref) return;
    if (!byRef[s.ref]) byRef[s.ref] = [];
    byRef[s.ref].push(s);
  });
  const nameOf = sid => {
    const f = D.students.find(x => String(x.sid) === String(sid));
    return f ? f.name : "(미가입)";
  };
  const joined = s => Object.keys(s.claims || {}).some(k => k.indexOf("apply:") === 0 || k.indexOf("done:") === 0);

  const rows = Object.keys(byRef)
    .map(sid => ({ sid, name: nameOf(sid), list: byRef[sid] }))
    .sort((a, b) => b.list.length - a.list.length);

  const invited = D.students.filter(s => s.ref).length;
  const active = D.students.filter(s => s.ref && joined(s)).length;
  const rate = invited ? Math.round(active / invited * 100) : 0;

  return shell(`
    <div class="cards">
      <div class="kpi"><div class="l">추천으로 가입</div><div class="v">${invited}</div>
        <div class="s">전체 ${D.students.length}명 중</div></div>
      <div class="kpi"><div class="l">추천한 학생</div><div class="v">${rows.length}</div>
        <div class="s">1명 이상 데려온 학생</div></div>
      <div class="kpi ${rate >= 50 ? "hl" : ""}"><div class="l">실제 참여 전환</div><div class="v">${rate}%</div>
        <div class="s">추천 가입자 중 프로그램 인증 ${active}명</div></div>
    </div>

    <div class="panel">
      <div class="ph"><h2>추천 현황</h2>
        <span class="sub">추천한 학생과 데려온 친구</span>
        <div class="right"><button class="btn gh sm" id="csvref">CSV 내려받기</button></div>
      </div>
      <div class="pb flush"><div class="scroll">
        <table>
          <thead><tr><th>추천한 학생</th><th>학번</th><th class="num">데려온 인원</th><th>친구 목록</th></tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => `<tr>
              <td>${esc(r.name)}</td>
              <td style="color:var(--mist)">${esc(r.sid)}</td>
              <td class="num">${r.list.length}명</td>
              <td>${r.list.map(x => `<span class="chip ${joined(x) ? "ok" : "wait"}">${esc(x.name)}${joined(x) ? "" : " 미참여"}</span>`).join(" ")}</td>
            </tr>`).join("") : `<tr><td colspan="4"><div class="empty">아직 추천 기록이 없습니다.</div></td></tr>`}
          </tbody>
        </table>
      </div></div>
    </div>

    <p class="note">
      초록색은 추천으로 들어와 프로그램을 실제로 인증한 학생입니다. 이때 추천인에게 카드가 지급됩니다.<br>
      회색(미참여)은 가입만 하고 아직 프로그램 인증을 하지 않은 상태로, 추천인 보상은 지급되지 않았습니다.
    </p>`);
}

/* ── 운영 ── */
const SERVER_EXPECT = "2026-09-24";
function errMsg(e) {
  const m = e && e.message;
  return m === "auth" ? "담당자 코드가 맞지 않습니다" : m === "not found" ? "학생을 찾지 못했습니다"
    : m === "unknown action" ? "서버가 예전 버전입니다. 새 버전으로 배포해 주세요"
    : m === "bad cards" ? "장수는 -100~100 사이로 넣어 주세요" : "처리하지 못했습니다" + (m ? " (" + m + ")" : "");
}

          <dt>마지막 전체 초기화</dt><dd>${ep ? new Date(ep).toLocaleString("ko-KR") : "한 번도 하지 않음"}</dd>
          <dt>참여 학생</dt><dd>${D.students.length}명</dd>
          <dt>서버 주소</dt><dd style="word-break:break-all;color:var(--mist)">${esc(CONFIG.API_URL || "-")}</dd>
        </dl>
        <p class="note" style="margin:14px 0 0">전체 초기화는 실수를 막기 위해 이 화면이 아니라 Apps Script 편집기에서
          '전체삭제'를 90초 안에 두 번 실행해서 합니다. 지우기 전에 시트 백업본이 자동으로 만들어집니다.</p>
      </div>
    </div>`);
}

/* 학생 한 명의 상세 — 오른쪽에서 열리는 창 */
function openStudent(sid) {
  const st = D.students.find(x => String(x.sid) === String(sid));
  if (!st) return;
  closeStudent();
  const owned = st.owned || {};
  const byTier = TIER_KEYS.map(t => {
    const ids = Object.keys(owned).filter(k => k[0] === t && owned[k] > 0).sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));
    return `<div style="margin-bottom:8px"><span class="chip ${t}">${t} ${TIERS[t].word} ${ids.length}/${PER_TIER[t]}</span>
      <div class="owned" style="margin-top:6px">${ids.map(k => `<span>${k}<b>×${owned[k]}</b></span>`).join("") || '<span style="color:var(--dim)">없음</span>'}</div></div>`;
  }).join("");
  const proofs = D.proofs.filter(p => String(p.sid) === String(sid));
  const ex = (D.exchanges || []).filter(x => String(x.sid) === String(sid));
  const gr = D.grants.filter(g => String(g.sid) === String(sid));
  const stLabel = { ok: "승인", no: "반려", wait: "대기" };

  const el = document.createElement("div");
  el.className = "drawer"; el.id = "drawer";
  el.innerHTML = `<div class="dp">
    <div class="dh"><div><h3>${esc(st.name)}</h3><div class="note">${esc(st.sid)}</div></div>
      <button class="btn gh sm" id="dx" style="margin-left:auto">닫기</button></div>

    <div class="sec"><h4>기본 정보</h4><dl class="kv">
      <dt>연락처</dt><dd>${esc(st.contact) || "-"}</dd>
      <dt>보유</dt><dd>${st.types} / ${TOTAL_CARDS}종</dd>
      <dt>미개봉 카드</dt><dd>${st.pending}장</dd>
      <dt>퀴즈 참여</dt><dd>${st.quizDone || 0}회</dd>
      <dt>추천인</dt><dd>${esc(st.ref) || "-"}</dd>
      <dt>내가 추천한 친구</dt><dd>${(st.refFrom || []).length}명</dd>
    </dl></div>

    <div class="sec"><h4>보유 카드</h4>${byTier}</div>

    <div class="sec"><h4>인증 ${proofs.length}건</h4>
      ${proofs.length ? proofs.map(p => `<div class="note" style="color:var(--foam)">${proofLabel(p.key)} ·
        <span class="chip ${p.status}">${stLabel[p.status] || p.status}</span> · ${when(p.at)}</div>`).join("") : '<div class="note">없음</div>'}</div>

    <div class="sec"><h4>굿즈 교환</h4>
      ${ex.length ? ex.map(x => `<div class="note" style="color:var(--foam)"><span class="chip ${x.tier}">${x.tier}</span>
        ${esc(x.goods || "")} · ${x.status === "done" ? "지급 완료" : "신청(연락 예정)"} · ${when(x.doneAt || x.at)}</div>`).join("") : '<div class="note">없음</div>'}</div>

    <div class="sec"><h4>카드 지급·회수</h4>
      <div class="frm">
        <input id="gn" class="n" type="number" min="-100" max="100" placeholder="장수 (회수는 -3)">
        <input id="gr" placeholder="사유 (기록에 남습니다)">
        <button class="btn sm" id="ggo">반영</button>
      </div>
      <p class="note" style="margin:8px 0 0">학생이 다음에 앱을 열거나 저장할 때 미개봉 카드로 들어갑니다. 회수는 아직 뜯지 않은 카드에서만 빠집니다.</p>
      ${gr.length ? `<div style="margin-top:10px">${gr.map(g => `<div class="note">${when(g.at)} ·
        <span class="${g.cards > 0 ? "plus" : "minus"}">${g.cards > 0 ? "+" : ""}${g.cards}</span> · ${esc(g.reason) || "사유 없음"}</div>`).join("")}</div>` : ""}
    </div>

    <div class="sec"><h4>기록 삭제</h4>
      <p class="note" style="margin:0 0 10px">개인정보 삭제 요청 등에 씁니다. 이 학생의 카드·인증·설문·별점·교환·지급 기록과
        인증 캡처 파일이 지워지며 되돌릴 수 없습니다.</p>
      <div class="frm">
        <input id="dconf" placeholder="확인을 위해 학번 입력" inputmode="numeric">
        <button class="btn sm danger" id="dgo">이 학생 기록 삭제</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) closeStudent(); };
  el.querySelector("#dx").onclick = closeStudent;

  el.querySelector("#ggo").onclick = async e => {
    const n = parseInt(el.querySelector("#gn").value, 10);
    const reason = el.querySelector("#gr").value.trim();
    if (!n || Math.abs(n) > 100) return toast("장수를 -100~100 사이로 넣어 주세요");
    if (!reason) return toast("사유를 적어 주세요 (지급 기록에 남습니다)");
    if (!(await grantCards(st.sid, n, reason, e.currentTarget))) return;
    openStudent(st.sid);
  };

  el.querySelector("#dgo").onclick = async e => {
    if (el.querySelector("#dconf").value.trim() !== String(st.sid)) return toast("학번을 정확히 입력해야 삭제됩니다");
    if (!api) return toast("서버에 연결된 상태에서만 쓸 수 있습니다");
    const b = e.currentTarget; b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    try {
      const j = await adminPost({ action: "deleteStudent", sid: st.sid });
      const keep = x => String(x.sid) !== String(st.sid);
      D.students = D.students.filter(keep); D.proofs = D.proofs.filter(keep);
      D.exchanges = (D.exchanges || []).filter(keep); D.surveys = D.surveys.filter(keep);
      D.ratings = D.ratings.filter(keep); D.grants = D.grants.filter(keep);
      closeStudent(); render();
      toast(`${st.name} 학생 기록을 삭제했습니다 (${j.removed}줄, 캡처 ${j.files}개)`);
    } catch (err) { b.disabled = false; b.textContent = "이 학생 기록 삭제"; toast(errMsg(err)); }
  };
}
function closeStudent() { const d = $("drawer"); if (d) d.remove(); }

/* 카드 지급·회수 (상세 창과 운영 화면이 같이 씀) */
async function grantCards(sid, n, reason, btn) {
  if (!api) { toast("서버에 연결된 상태에서만 쓸 수 있습니다"); return false; }
  const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try {
    await adminPost({ action: "grant", sid, cards: n, reason });
    const st = D.students.find(x => String(x.sid) === String(sid));
    if (st) st.pending = Math.max(0, (st.pending || 0) + n);
    D.grants.unshift({ at: Date.now(), sid: String(sid), name: st ? st.name : "", cards: n, reason });
    toast(`${st ? st.name : sid} 학생에게 ${n > 0 ? n + "장 지급" : -n + "장 회수"}했습니다`);
    return true;
  } catch (err) {
    toast(errMsg(err));
    return false;
  } finally { if (btn) { btn.disabled = false; btn.textContent = label; } }
}

/* ── 교환 ── */

  const waiting = ex.filter(x => x.status !== "done").sort((a, b) => (a.at || 0) - (b.at || 0));
  const paid    = ex.filter(x => x.status === "done").sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

            <th>연락처</th><th>신청</th><th class="num">처리</th></tr></thead>
          <tbody>
            ${waiting.length ? waiting.map((x, i) => `<tr>
              <td>${esc(x.name)}</td>
              <td style="color:var(--mist)">${esc(x.sid)}</td>

              <td>${esc(x.goods || (TIERS[x.tier] ? TIERS[x.tier].goods : ""))}</td>
              <td><a class="tel" href="tel:${esc(String(x.contact).replace(/[^0-9+]/g, ""))}">${esc(x.contact) || "-"}</a></td>
              <td style="color:var(--mist)">${when(x.at)}</td>

              : `<tr><td colspan="7"><div class="empty">처리할 교환 신청이 없습니다.</div></td></tr>`}

      </div></div>

    <div class="panel">
      <div class="ph"><h2>지급 완료</h2><span class="sub">${paid.length}건</span>
        <div class="right"><button class="btn gh sm" id="csvex">CSV 내려받기</button></div>
      </div>
      <div class="pb flush"><div class="scroll" style="max-height:340px">
        <table>
          <thead><tr><th>이름</th><th>학번</th><th>등급</th><th>지급한 선물</th>
            <th>연락처</th><th>지급</th><th class="num">되돌리기</th></tr></thead>
          <tbody>

              <td><span class="chip ${x.tier}">${x.tier}</span></td>

              <td style="color:var(--mist)">${when(x.doneAt || x.at)}</td>

              : `<tr><td colspan="7"><div class="empty">아직 지급 내역이 없습니다.</div></td></tr>`}

      <div class="ph"><h2>완성했지만 미신청</h2>

/* ── CSV ── */
function csv(rows, name) {
  const body = rows.map(r => r.map(c => {
    const v = String(c == null ? "" : c);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + body], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + "_" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

/* ── 렌더 ── */
let authed = false;
function render() {
  if (!authed) { app.innerHTML = viewGate(); return bindGate(); }
  if (V.tab === "review") app.innerHTML = viewReview();
  else if (V.tab === "students") app.innerHTML = viewStudents();
  else if (V.tab === "survey") app.innerHTML = viewSurvey();
  else if (V.tab === "rating") app.innerHTML = viewRating();
  else if (V.tab === "referral") app.innerHTML = viewReferral();
  else if (V.tab === "exchange") app.innerHTML = viewExchange();
  else if (V.tab === "ops") app.innerHTML = viewOps();
  else app.innerHTML = viewHome();
  bind();
}

function bindGate() {
  const go = $("go");
  go.onclick = async () => {
    const v = ($("code").value || "").trim();
    if (!v) { V.err = "담당자 코드를 입력해 주세요."; return render(); }
    if (api) {
      go.disabled = true; go.innerHTML = '<span class="spin"></span>';
      try {
        const r = await fetch(CONFIG.API_URL + "?action=auth&admin=" + encodeURIComponent(v));
        const j = await r.json();
        if (!j.ok) {
          V.err = j.error === "no admin code" ? NO_CODE_MSG
                : j.error === "unknown action" ? "서버가 예전 버전입니다. apps-script.gs를 새 버전으로 배포한 뒤 다시 들어와 주세요."
                : "코드가 올바르지 않습니다.";
          return render();
        }
      } catch (e) { V.err = "서버에 연결하지 못했습니다."; return render(); }
    }
    ADMIN = v; authed = true; V.err = "";
    await load();
  };
  $("code").onkeydown = e => { if (e.key === "Enter") go.click(); };
  setTimeout(() => $("code") && $("code").focus(), 40);
}

function bind() {
  app.querySelectorAll("[data-tab]").forEach(el => el.onclick = () => { V.tab = el.dataset.tab; render(); });
  $("reload") && ($("reload").onclick = () => load());

  // 검토
  $("rf") && ($("rf").onchange = e => { V.revFilter = e.target.value; render(); });
  const list = D.proofs.filter(p => V.revFilter === "all" ? true : p.status === V.revFilter)
                       .sort((a, b) => (a.at || 0) - (b.at || 0));
  app.querySelectorAll(".rc img").forEach(im => im.onclick = () => {
    const z = document.createElement("div");
    z.className = "zoom";
    z.innerHTML = `<img src="${im.src}" alt="" referrerpolicy="no-referrer">`;
    z.onclick = () => z.remove(); document.body.appendChild(z);
  });
  const rev = async (i, st, btn) => {
    const it = list[i];
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      await review(it.sid, it.key, st);
      it.status = st;
      const src = D.proofs.find(p => p.sid === it.sid && p.key === it.key);
      if (src) src.status = st;
      toast(st === "ok" ? "승인했습니다" : "반려했습니다");
      render();
    } catch (e) { btn.disabled = false; btn.textContent = st === "ok" ? "승인" : "반려"; toast("처리에 실패했습니다"); }
  };
  app.querySelectorAll("[data-ok]").forEach(b => b.onclick = () => rev(+b.dataset.ok, "ok", b));

  // 대기 전체 승인
  $("okall") && ($("okall").onclick = async e => {
    const items = list.filter(p => p.status === "wait");
    if (!items.length) return;
    if (!confirm(`검토 대기 ${items.length}건을 모두 승인할까요?`)) return;
    const b = e.currentTarget; b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    try {
      if (api) await adminPost({ action: "reviewBatch", status: "ok", items: items.map(p => ({ sid: p.sid, key: p.key })) });
      else for (const p of items) await review(p.sid, p.key, "ok");
      items.forEach(p => { p.status = "ok"; });
      toast(`${items.length}건을 승인했습니다`);
      render();
    } catch (err) { b.disabled = false; b.textContent = `대기 ${items.length}건 모두 승인`; toast(errMsg(err)); }
  });

  // 참여자 → 상세
  app.querySelectorAll("[data-st]").forEach(b => b.onclick = () => openStudent(b.dataset.st));

  // 운영: 공지
  const postNotice = async (text, btn) => {
    if (!api) return toast("서버에 연결된 상태에서만 쓸 수 있습니다");
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      await adminPost({ action: "notice", text });
      D.meta.notice = text ? { t: text, at: Date.now() } : null;
      toast(text ? "공지를 올렸습니다" : "공지를 내렸습니다");
      render();
    } catch (err) { toast(errMsg(err)); render(); }
  };
  $("ntgo") && ($("ntgo").onclick = e => {
    const t = ($("nt").value || "").trim();
    if (!t) return toast("공지 내용을 적어 주세요");
    postNotice(t, e.currentTarget);
  });
  $("ntdel") && ($("ntdel").onclick = e => postNotice("", e.currentTarget));

  // 운영: 학번으로 바로 지급
  $("qgo") && ($("qgo").onclick = async e => {
    const sid = ($("qsid").value || "").trim(), n = parseInt($("qn").value, 10), reason = ($("qr").value || "").trim();
    if (!/^\d{6,12}$/.test(sid)) return toast("학번을 확인해 주세요");
    if (!D.students.some(x => String(x.sid) === sid)) return toast("참여자 목록에 없는 학번입니다");
    if (!n || Math.abs(n) > 100) return toast("장수를 -100~100 사이로 넣어 주세요");
    if (!reason) return toast("사유를 적어 주세요 (지급 기록에 남습니다)");
    if (await grantCards(sid, n, reason, e.currentTarget)) render();
  });
  $("grcsv") && ($("grcsv").onclick = () => {
    const rows = [["시각", "이름", "학번", "장수", "사유"]];
    D.grants.forEach(g => rows.push([g.at ? new Date(g.at).toLocaleString("ko-KR") : "", g.name, g.sid, g.cards, g.reason]));
    csv(rows, "카드지급기록");
  });
  app.querySelectorAll("[data-no]").forEach(b => b.onclick = () => rev(+b.dataset.no, "no", b));
  app.querySelectorAll("[data-re]").forEach(b => b.onclick = () => rev(+b.dataset.re, "wait", b));

  // 검색
  const q = $("q");
  if (q) {
    q.oninput = () => { V.q = q.value; const p = q.selectionStart; render();
      const n = $("q"); if (n) { n.focus(); n.setSelectionRange(p, p); } };
  }

  // CSV
  $("csv") && ($("csv").onclick = () => csv(
    [["이름", "학번", "보유종수", "C", "B", "A", "S", "미개봉", "퀴즈참여", "교환등급"]].concat(
      D.students.map(s => [s.name, s.sid, s.types].concat(TIER_KEYS.map(t => tierDone(s, t)))
        .concat([s.pending, s.quizDone || 0, s.exchanged || ""]))), "참여자"));
  $("csvsv") && ($("csvsv").onclick = () => csv(
    [["주차", "학번", "이름", "질문", "선택한 답", "직접 입력"]].concat(
      D.surveys.map(s => [s.week, s.sid, s.name, s.q, s.answer, s.etc])), "설문응답"));
  $("csvrt") && ($("csvrt").onclick = () => csv(
    [["학번", "이름", "프로그램", "별점", "한 줄 후기"]].concat(
      D.ratings.map(r => [r.sid, r.name, r.program, r.score, r.memo])), "만족도"));
  $("csvref") && ($("csvref").onclick = () => {
    const rows = [["추천한 학생", "추천인 학번", "데려온 학생", "학번", "프로그램 인증"]];
    D.students.forEach(s => {
      if (!s.ref) return;
      const r = D.students.find(x => String(x.sid) === String(s.ref));
      const j = Object.keys(s.claims || {}).some(k => k.indexOf("apply:") === 0 || k.indexOf("done:") === 0);
      rows.push([r ? r.name : "(미가입)", s.ref, s.name, s.sid, j ? "O" : "X"]);
    });
    csv(rows, "추천현황");
  });
  $("csvex") && ($("csvex").onclick = () => {
    const rows = [["이름", "학번", "등급", "선물", "연락처", "지급시각"]];
    (D.exchanges || []).filter(x => x.status === "done").forEach(x =>
      rows.push([x.name, x.sid, x.tier, x.goods || (TIERS[x.tier] ? TIERS[x.tier].goods : ""),
                 x.contact || "", x.doneAt ? new Date(x.doneAt).toLocaleString("ko-KR") : ""]));
    csv(rows, "교환내역");
  });

  // 교환 지급 처리 / 되돌리기
  const exList = (D.exchanges || []).slice();
  const waiting = exList.filter(x => x.status !== "done").sort((a, b) => (a.at || 0) - (b.at || 0));
  const paid    = exList.filter(x => x.status === "done").sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const setEx = async (item, status, btn) => {
    if (!item) return;
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      await exchangeDone(item.sid, item.tier, status);
      const src = (D.exchanges || []).find(x => x.sid === item.sid && x.tier === item.tier);
      if (src) { src.status = status; src.doneAt = status === "done" ? Date.now() : 0; }
      toast(status === "done" ? "지급 완료로 처리했습니다" : "신청 대기로 되돌렸습니다");
      render();
    } catch (e) {
      btn.disabled = false; btn.textContent = status === "done" ? "지급 완료" : "되돌리기";
      toast("처리에 실패했습니다");
    }
  };
  app.querySelectorAll("[data-give]").forEach(b =>
    b.onclick = () => setEx(waiting[+b.dataset.give], "done", b));
  app.querySelectorAll("[data-undo]").forEach(b =>
    b.onclick = () => setEx(paid[+b.dataset.undo], "req", b));
}

async function exchangeDone(sid, tier, status) {
  if (api) { await adminPost({ action: "exchangeDone", sid, tier, status }); return; }
  const raw = localStorage.getItem("dingle:" + sid);
  if (!raw) return;
  const d = JSON.parse(raw);
  d.exchanged = d.exchanged || {};
  d.exchanged[tier] = Object.assign({ at: Date.now() }, d.exchanged[tier], { status });
  localStorage.setItem("dingle:" + sid, JSON.stringify(d));
}

/* 등대팀 전용 요청. 담당자 코드를 붙여 보내고, 서버가 거절하면 예외를 던진다. */
async function adminPost(body) {
  const r = await fetch(CONFIG.API_URL, {
    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({}, body, { admin: ADMIN })),
  });
  const j = await r.json();
  if (!j || j.ok !== true) throw new Error((j && j.error) || "failed");
  return j;
}

async function review(sid, key, status) {
  if (api) { await adminPost({ action: "review", sid, key, status }); return; }
  const raw = localStorage.getItem("dingle:" + sid);
  if (!raw) return;
  const d = JSON.parse(raw);
  if (d.proofs && d.proofs[key]) d.proofs[key].status = status;
  localStorage.setItem("dingle:" + sid, JSON.stringify(d));
}

render();
</script>
