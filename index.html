<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>딩글이 카드 도감 · 연세대학교 미래캠퍼스 등대팀</title>
<meta name="description" content="학습지원 프로그램에 참여하고 딩글이 카드를 모아보세요.">
<style>
  :root{
    --deep:#0B1730; --sea:#14264A; --sea2:#1D3563; --line:#2C4471;
    --beam:#F7C948; --beam2:#FFE29A; --foam:#EAF0FA; --mist:#8FA3C4; --dim:#5E729A;
    --cC:#7C8FA8; --cB:#3FB6A8; --cA:#A176E8; --cS:#F7C948;
    --ok:#4ED8A0; --bad:#FF9A8B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:radial-gradient(130% 70% at 50% 0%,#1B2F57 0%,var(--deep) 55%) no-repeat,var(--deep);
    color:var(--foam); min-height:100vh; -webkit-font-smoothing:antialiased;
    padding:16px 14px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:760px;margin:0 auto}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}

  /* ---------- 공통 ---------- */
  .btn{width:100%;padding:14px;font-size:15px;font-weight:700;background:var(--beam);color:#16233D;border:none;border-radius:11px;transition:filter .12s,transform .12s}
  .btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
  .btn:disabled{background:#3A4B6B;color:#7B8CA8;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--foam);border:1px solid rgba(143,163,196,.35)}
  .btn.ghost:hover{border-color:var(--beam);color:var(--beam)}
  .lnk{background:none;border:none;color:var(--mist);font-size:12.5px;text-decoration:underline;padding:8px 0}
  .lead{font-size:13px;color:var(--mist);line-height:1.7;margin:0 0 14px}
  .note{font-size:11.5px;color:var(--dim);line-height:1.6}

  .panel{background:rgba(247,201,72,.07);border:1px solid rgba(247,201,72,.28);border-radius:12px;padding:14px;margin-bottom:16px}
  .panel h3{margin:0 0 6px;font-size:13.5px;color:var(--beam);font-weight:700}
  .panel p{margin:0;font-size:12.5px;line-height:1.65;opacity:.88}

  /* ---------- 로그인 ---------- */
  .gate{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
  .gate .hero{text-align:center;margin-bottom:26px}
  .gate .hero img{width:132px;display:block;margin:0 auto 12px}
  .gate h1{font-size:27px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
  .gate .sub{margin:0;color:var(--mist);font-size:13.5px;line-height:1.65}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:12.5px;color:var(--mist);margin-bottom:6px}
  .field input{width:100%;padding:13px 14px;font-size:16px;background:rgba(255,255,255,.05);
    border:1px solid rgba(143,163,196,.3);border-radius:10px;color:var(--foam);outline:none}
  .field input:focus{border-color:var(--beam);background:rgba(247,201,72,.06)}
  .field input::placeholder{color:#54688E}
  .agree{display:flex;gap:9px;align-items:flex-start;margin:12px 0 14px;font-size:12px;color:var(--mist);line-height:1.55}
  .agree input{margin-top:2px;width:16px;height:16px;accent-color:var(--beam);flex:none}

  /* ---------- 헤더/탭 ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid rgba(143,163,196,.18)}
  .who .nm{font-weight:700;font-size:15px}
  .who .id{font-size:11.5px;color:var(--mist)}
  .tickets{display:flex;align-items:baseline;gap:5px;background:rgba(247,201,72,.12);
    border:1px solid rgba(247,201,72,.35);padding:7px 13px;border-radius:999px;white-space:nowrap}
  .tickets b{font-size:17px;color:var(--beam)} .tickets span{font-size:11.5px;color:var(--beam2)}
  .tabs{display:flex;gap:4px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1;min-width:76px;padding:10px 4px;text-align:center;font-size:13.5px;font-weight:600;
    background:none;border:none;color:var(--mist);border-bottom:2px solid transparent;white-space:nowrap}
  .tab.on{color:var(--beam);border-bottom-color:var(--beam)}

  /* ---------- 카드 얻기 ---------- */
  .src{background:rgba(255,255,255,.04);border:1px solid rgba(143,163,196,.16);border-radius:12px;
    padding:13px 14px;margin-bottom:9px}
  .src .hd{display:flex;align-items:center;gap:10px}
  .src .ttl{font-size:14.5px;font-weight:700;flex:1;min-width:0}
  .src .amt{font-size:12px;font-weight:800;color:#16233D;background:var(--beam);padding:3px 9px;border-radius:999px;white-space:nowrap}
  .src .meta{font-size:12px;color:var(--mist);margin-top:5px;line-height:1.55}
  .src .act{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap}
  .src .act button{flex:1;min-width:120px;padding:10px;font-size:13px;font-weight:700;border-radius:9px;
    background:rgba(247,201,72,.15);color:var(--beam);border:1px solid rgba(247,201,72,.4)}
  .src .act button:hover{background:var(--beam);color:#16233D}
  .src .act button.done{background:transparent;color:var(--dim);border-color:rgba(143,163,196,.22);cursor:default}
  .src .act button.done:hover{background:transparent;color:var(--dim)}

  .plist{display:grid;grid-template-columns:1fr;gap:7px;margin-top:10px}
  .prow{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);border-radius:9px;padding:9px 11px}
  .prow .pn{flex:1;font-size:13px;min-width:0}
  .prow button{padding:7px 11px;font-size:11.5px;font-weight:700;border-radius:7px;border:1px solid rgba(247,201,72,.4);
    background:rgba(247,201,72,.14);color:var(--beam);white-space:nowrap}
  .prow button.done{background:transparent;border-color:rgba(143,163,196,.22);color:var(--dim);cursor:default}

  /* ---------- 뽑기 ---------- */
  .draw{text-align:center;padding:6px 0}
  .pack{width:150px;height:210px;margin:0 auto 20px;border-radius:15px;position:relative;
    background:linear-gradient(160deg,var(--sea2),var(--sea) 55%,#0F1F3D);
    border:1px solid rgba(247,201,72,.45);display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 40px rgba(0,0,0,.45);transition:transform .18s}
  .pack:hover{transform:translateY(-4px) rotate(-1.2deg)}
  .pack img{width:78px;opacity:.95}
  .pack .lbl{position:absolute;bottom:14px;left:0;right:0;font-size:10.5px;letter-spacing:.09em;color:var(--beam2)}
  .pack.shake{animation:sh .5s ease}
  @keyframes sh{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg) scale(1.04)}45%{transform:rotate(5deg) scale(1.04)}70%{transform:rotate(-3deg) scale(1.02)}}
  .reveal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .flip{animation:fi .5s cubic-bezier(.2,.9,.3,1.3) backwards}
  @keyframes fi{from{opacity:0;transform:rotateY(85deg) scale(.85)}to{opacity:1;transform:none}}

  /* ---------- 카드 ---------- */
  .card{width:100px;aspect-ratio:5/7;border-radius:9px;overflow:hidden;position:relative;
    background:#0F1D38;display:block}
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .card.t-A{box-shadow:0 0 0 1px rgba(161,118,232,.5),0 3px 14px rgba(161,118,232,.3)}
  .card.t-S{box-shadow:0 0 0 1px rgba(247,201,72,.6),0 4px 18px rgba(247,201,72,.45);
    animation:glowS 2.2s ease-in-out infinite}
  @keyframes glowS{
    0%,100%{box-shadow:0 0 0 1px rgba(247,201,72,.55),0 3px 14px rgba(247,201,72,.35)}
    50%{box-shadow:0 0 0 1px rgba(255,235,170,.95),0 5px 26px rgba(247,201,72,.7)}}
  .card.t-S::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.55) 47%,rgba(190,235,255,.4) 53%,transparent 66%);
    background-size:250% 100%;animation:holo 2.8s linear infinite}
  @keyframes holo{0%{background-position:180% 0}100%{background-position:-80% 0}}

  .card.locked{background:#13233F;border:1px dashed rgba(143,163,196,.35);
    display:flex;align-items:center;justify-content:center;box-shadow:none!important;animation:none!important}
  .card.locked::after{display:none}
  .card.locked .q{font-size:26px;font-weight:900;color:#3A5178}
  .card.used::before{content:"교환 완료";position:absolute;left:0;right:0;bottom:0;z-index:3;
    background:rgba(247,201,72,.92);color:#12203C;font-size:9.5px;font-weight:800;
    text-align:center;padding:3px 0}
  .card.used img{filter:saturate(.55)}
  .qty{position:absolute;top:5px;right:5px;z-index:5;background:rgba(11,23,48,.9);color:var(--foam);
    font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;border:1px solid rgba(143,163,196,.45)}
  .qty.full{background:var(--beam);color:#12203C;border-color:var(--beam)}

  /* ---------- 인증 업로드 ---------- */
  .up{background:rgba(0,0,0,.22);border:1.5px dashed rgba(143,163,196,.4);border-radius:11px;
    padding:22px 14px;text-align:center;cursor:pointer;transition:border-color .15s}
  .up:hover{border-color:var(--beam)}
  .up.has{border-style:solid;border-color:var(--beam);padding:10px}
  .up svg{display:block;margin:0 auto 8px}
  .up .t{font-size:13px;color:var(--mist)}
  .up img{max-width:100%;max-height:230px;border-radius:8px;display:block;margin:0 auto}
  .st{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
  .st.wait{background:rgba(143,163,196,.18);color:var(--mist);border:1px solid rgba(143,163,196,.35)}
  .st.ok{background:rgba(78,216,160,.16);color:#7FE9C0;border:1px solid rgba(78,216,160,.45)}
  .st.no{background:rgba(255,154,139,.14);color:var(--bad);border:1px solid rgba(255,154,139,.45)}
  .warn{background:rgba(255,154,139,.1);border:1px solid rgba(255,154,139,.4);border-radius:11px;
    padding:12px 14px;margin-bottom:14px;font-size:12.5px;color:#FFD5CD;line-height:1.6}
  .modal{position:fixed;inset:0;z-index:150;background:rgba(5,11,24,.86);display:flex;
    align-items:flex-end;justify-content:center;animation:fadein .2s}
  .sheet{background:#12233F;border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;
    max-width:520px;max-height:92vh;overflow-y:auto;padding:20px 18px calc(22px + env(safe-area-inset-bottom));
    animation:slideup .28s cubic-bezier(.2,.9,.3,1)}
  @keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 6px;font-size:17px}
  .sheet .desc{font-size:12.5px;color:var(--mist);line-height:1.65;margin:0 0 14px}
  .adm{background:rgba(255,255,255,.04);border:1px solid rgba(143,163,196,.18);border-radius:12px;
    padding:12px;margin-bottom:10px}
  .adm .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .adm .hd .n{font-weight:700;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .adm .hd .sid{font-size:11px;color:var(--mist);font-weight:400}
    .adm img{width:100%;max-height:230px;object-fit:contain;object-position:top;border-radius:9px;
    display:block;margin-bottom:9px;background:#0A1428;cursor:zoom-in}
  .zoom{position:fixed;inset:0;z-index:300;background:rgba(4,9,20,.95);display:flex;
    align-items:center;justify-content:center;padding:16px;animation:fadein .18s;cursor:zoom-out}
  .zoom img{max-width:100%;max-height:100%;border-radius:10px}
  .adm .row{display:flex;gap:7px}
  .adm .row button{flex:1;padding:10px;font-size:13px;font-weight:700;border-radius:9px;border:none}
  .adm .row .y{background:rgba(78,216,160,.18);color:#7FE9C0;border:1px solid rgba(78,216,160,.45)}
  .adm .row .n2{background:rgba(255,154,139,.14);color:var(--bad);border:1px solid rgba(255,154,139,.45)}

  /* ---------- 팩 오프닝 연출 ---------- */
  #stage{position:fixed;inset:0;z-index:200;background:#04070F;display:flex;
    align-items:center;justify-content:center;flex-direction:column;overflow:hidden;
    padding:20px;animation:fadein .22s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}

  /* 배경 레이어 */
  #stage .halo{position:absolute;width:160vmax;height:160vmax;border-radius:50%;
    background:radial-gradient(circle,var(--gc) 0%,transparent 60%);opacity:0;
    transition:opacity .6s ease}
  #stage .beams{position:absolute;inset:-70%;opacity:0;transition:opacity .6s ease;
    background:repeating-conic-gradient(from 0deg,var(--gc) 0deg 3deg,transparent 3deg 15deg);
    animation:rays 20s linear infinite}
  #stage .rings{position:absolute;inset:0;pointer-events:none;z-index:2}
  #stage .ring{position:absolute;left:50%;top:50%;border-radius:50%;
    border:2px solid var(--gc);opacity:0;transform:translate(-50%,-50%)}
  .ring.go{animation:ringOut 1.1s cubic-bezier(.15,.7,.35,1) forwards}
  @keyframes ringOut{
    0%{width:60px;height:60px;opacity:.85;border-width:3px}
    100%{width:150vmax;height:150vmax;opacity:0;border-width:1px}}

  /* 등급별 배경 강도 */
  #stage.lv1 .halo{opacity:.14}
  #stage.lv1 .beams{opacity:0}
  #stage.lv2 .halo{opacity:.26}
  #stage.lv2 .beams{opacity:.14;animation-duration:16s}
  #stage.lv3 .halo{opacity:.42}
  #stage.lv3 .beams{opacity:.28;animation-duration:9s}
  #stage.lv4 .halo{opacity:.6}
  #stage.lv4 .beams{opacity:.46;animation-duration:4.5s}
  #stage.lv4{animation:fadein .22s ease,bgpulse 1.6s ease-in-out infinite .6s}
  @keyframes bgpulse{0%,100%{background:#04070F}50%{background:#150E02}}

  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
  .flash.on{animation:fl .5s ease-out}
  .flash.on2{animation:fl2 .9s ease-out}
  @keyframes fl{0%{opacity:.9}100%{opacity:0}}
  @keyframes fl2{0%{opacity:1}18%{opacity:.15}34%{opacity:.95}100%{opacity:0}}

  #stageBody{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center}
  #afterword{text-align:center;width:100%}

  /* 카드 */
  .bigcard{position:relative;z-index:5;width:min(66vw,250px);aspect-ratio:5/7;perspective:1400px}
  .bigcard .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.3,.85,.35,1.05)}
  .bigcard.flip .inner{transform:rotateY(180deg)}
  .bigcard.turn .inner{transition:transform 1.05s cubic-bezier(.22,.7,.25,1)}
  .bigcard.turn.flip .inner{transform:rotateY(900deg)}
  .bigcard .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;overflow:hidden}
  .bigcard .back{background:linear-gradient(160deg,#1D3563,#14264A 55%,#0C1B38);
    border:2px solid rgba(247,201,72,.45);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px}
  .bigcard .back img{width:44%;opacity:.95}
  .bigcard .back span{font-size:10px;letter-spacing:.14em;color:var(--beam2)}
  .bigcard .front{transform:rotateY(180deg);overflow:hidden}
  .bigcard .front img{width:100%;height:100%;object-fit:cover;display:block}
  .bigcard .front.t-S{box-shadow:0 0 44px rgba(247,201,72,.75)}
  .bigcard .front.t-A{box-shadow:0 0 32px rgba(161,118,232,.6)}
  .bigcard .front.t-S::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.7) 46%,rgba(180,232,255,.5) 54%,transparent 68%);
    background-size:250% 100%;animation:holo 2.4s linear infinite}

  /* 등급별 등장 모션 */
  .bigcard.e1{animation:pop1 .42s ease-out}
  @keyframes pop1{0%{transform:scale(.88);opacity:0}100%{transform:none;opacity:1}}
  .bigcard.e2{animation:pop2 .5s cubic-bezier(.2,.9,.3,1.5)}
  @keyframes pop2{0%{transform:scale(.75) translateY(14px);opacity:0}
    65%{transform:scale(1.05) translateY(0)}100%{transform:none;opacity:1}}
  .bigcard.e3{animation:pop3 .62s cubic-bezier(.2,.9,.3,1.5)}
  @keyframes pop3{0%{transform:scale(.6) rotate(-8deg);opacity:0}
    60%{transform:scale(1.1) rotate(2deg)}100%{transform:none;opacity:1}}
  .bigcard.e4{animation:pop4 .8s cubic-bezier(.16,.9,.28,1.45)}
  @keyframes pop4{0%{transform:scale(.35) rotate(-16deg);opacity:0}
    45%{transform:scale(1.22) rotate(4deg);opacity:1}
    70%{transform:scale(.96) rotate(-2deg)}100%{transform:none}}
  .bigcard.quake{animation:quake .55s ease-in-out}
  @keyframes quake{0%,100%{transform:none}
    15%{transform:translate(-7px,3px) rotate(-1.8deg)}
    35%{transform:translate(7px,-3px) rotate(1.8deg)}
    55%{transform:translate(-5px,2px) rotate(-1.2deg)}
    75%{transform:translate(4px,-1px) rotate(.8deg)}}
  .bigcard.float{animation:floaty 3s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

  /* 등급 문구 */
  .tierword{position:relative;z-index:6;margin-top:20px;font-weight:900;text-align:center;
    letter-spacing:.34em;color:var(--gc)}
  .tierword.w1{font-size:12px;opacity:.75;animation:tw .4s ease}
  .tierword.w2{font-size:13.5px;animation:tw .45s ease}
  .tierword.w3{font-size:16px;text-shadow:0 0 20px var(--gc);animation:tw .5s ease}
  .tierword.w4{font-size:22px;text-shadow:0 0 12px #fff,0 0 34px var(--gc),0 0 60px var(--gc);
    animation:twBig .7s cubic-bezier(.2,.9,.3,1.4)}
  @keyframes tw{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes twBig{0%{opacity:0;transform:scale(2.2);filter:blur(8px)}
    55%{opacity:1;transform:scale(.94);filter:blur(0)}100%{transform:none}}
  .legendmark{position:relative;z-index:6;margin-top:8px;font-size:10px;letter-spacing:.42em;
    color:var(--beam2);opacity:0;animation:tw .5s ease .25s forwards}

  .counter{position:absolute;top:calc(16px + env(safe-area-inset-top));left:0;right:0;z-index:7;
    text-align:center;font-size:12px;color:var(--mist);letter-spacing:.05em}
  .tapnext{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;z-index:7;
    text-align:center;font-size:12.5px;color:var(--mist);animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
  .skip{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:8;
    background:rgba(255,255,255,.08);border:1px solid rgba(143,163,196,.3);color:var(--mist);
    font-size:11.5px;padding:7px 13px;border-radius:999px}

  /* 파티클 */
  .spark{position:absolute;z-index:6;pointer-events:none;animation:spk 1.3s ease-out forwards}
  @keyframes spk{0%{opacity:0;transform:scale(.2) translateY(0)}
    25%{opacity:1}100%{opacity:0;transform:scale(1.6) translateY(-40px)}}
  .mote{position:absolute;z-index:4;width:5px;height:5px;border-radius:50%;
    background:var(--gc);box-shadow:0 0 10px var(--gc);pointer-events:none;
    animation:rise 2.2s ease-out forwards}
  @keyframes rise{0%{opacity:0;transform:translateY(30px) scale(.4)}
    20%{opacity:.95}100%{opacity:0;transform:translateY(-180px) scale(1.1)}}

  /* ---------- 보관함 ---------- */
  .th{display:flex;align-items:center;gap:9px;margin:20px 0 10px}
  .badge{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;color:#10203C;flex:none}
  .th .rw{font-size:12px;color:var(--mist);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .th .cnt{font-size:12px;color:var(--mist);white-space:nowrap}
  .th .xbtn{font-size:12px;font-weight:800;color:#10203C;background:var(--beam);border:none;
    padding:6px 13px;border-radius:999px;white-space:nowrap}
  .th .okd{font-size:11px;font-weight:800;color:var(--mist);background:#43597F;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .grid .card{width:100%}
  .grid.dim{opacity:.55}
  @media(max-width:430px){.grid{grid-template-columns:repeat(3,1fr)}}

/* ───────── 3. 저장소 ───────── */
const api = CONFIG.API_URL && CONFIG.API_URL.startsWith("http");

const store = {
  key: sid => "dingle:" + sid,

  async load(sid) {
    if (api) {
      const r = await fetch(CONFIG.API_URL + "?action=load&sid=" + encodeURIComponent(sid));
      const j = await r.json();
      return j.data || null;
    }
    try { return JSON.parse(localStorage.getItem(this.key(sid))); } catch (e) { return null; }
  },

  async save(sid, data) {
    if (api) {
      await fetch(CONFIG.API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "save", sid, data }),
      });
      return;
    }
    localStorage.setItem(this.key(sid), JSON.stringify(data));
  },

  async upload(sid, key, img) {
    if (!api) return img;
    const r = await fetch(CONFIG.API_URL, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "upload", sid, key, img }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "upload failed");
    return j.url;
  },

  async pending() {
    if (api) {
      const r = await fetch(CONFIG.API_URL + "?action=pending");
      const j = await r.json();
      return j.list || [];
    }
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith("dingle:")) continue;
      try {
        const d = JSON.parse(localStorage.getItem(k));
        Object.keys(d.proofs || {}).forEach(key => {
          const pr = d.proofs[key];
          if ((pr.status || "wait") === "wait")
            out.push({ sid: d.sid, name: d.name, key, img: pr.img, at: pr.at });
        });
      } catch (e) {}
    }
    return out.sort((a, b) => (a.at || 0) - (b.at || 0));
  },

  async review(sid, key, status) {
    if (api) {
      await fetch(CONFIG.API_URL, {
        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "review", sid, key, status }),
      });
      return;
    }
    const raw = localStorage.getItem("dingle:" + sid);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.proofs && d.proofs[key]) d.proofs[key].status = status;
    localStorage.setItem("dingle:" + sid, JSON.stringify(d));
  },

  /* 추천인에게 카드를 적립한다. 서버가 있으면 서버가, 없으면 로컬에서 처리 */
  async reward(sid, cards, fromSid) {
    if (api) {
      const r = await fetch(CONFIG.API_URL, {
        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "reward", sid, cards, from: fromSid, limit: CONFIG.REFERRAL_LIMIT }),
      });
      const j = await r.json();
      return j.ok === true;
    }
    const raw = localStorage.getItem("dingle:" + sid);
    if (!raw) return false;
    const d = JSON.parse(raw);
    d.refFrom = d.refFrom || [];
    if (d.refFrom.indexOf(fromSid) >= 0) return false;
    if (d.refFrom.length >= CONFIG.REFERRAL_LIMIT) return false;
    d.refFrom.push(fromSid);
    d.pending = (d.pending || 0) + cards;
    localStorage.setItem("dingle:" + sid, JSON.stringify(d));
    return true;
  },

  /* 추천인이 실제로 존재하는지, 서로 추천이 아닌지 확인 */
  async checkRef(refSid, mySid) {
    let d = null;
    try { d = await this.load(refSid); } catch (e) { return { ok: false, msg: "확인에 실패했습니다. 잠시 후 다시 시도해 주세요." }; }
    if (!d) return { ok: false, msg: "그런 학번의 참여자가 없습니다. 친구가 먼저 가입해야 해요." };
    if (String(d.ref || "") === String(mySid)) return { ok: false, msg: "서로 추천은 인정되지 않습니다." };
    return { ok: true, name: d.name };
  },

  async rank() {
    if (api) {
      const r = await fetch(CONFIG.API_URL + "?action=rank");
      const j = await r.json();
      return j.list || [];
    }
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k.startsWith("dingle:")) continue;
      try {
        const d = JSON.parse(localStorage.getItem(k));
        out.push({ name: d.name, sid: d.sid, types: Object.keys(d.owned || {}).filter(x => d.owned[x] > 0).length, at: d.completedAt || 0 });
      } catch (e) {}
    }
    return out;
  },
};

    sid, name, pending: 0, owned: {},          // pending = 미개봉 카드 장수
    claims: {},                                 // key -> 지급 시각
    proofs: {},                                 // key -> {img, at, status}
    exchanged: {}, quizDone: [], quizWeek: null, surveys: [], ratings: [],
    contact: "",          // 선물 수령 안내용 연락처 (교환 시 선택 입력)
    ref: null,            // 내가 입력한 추천인 학번
    refPaid: false,       // 추천인에게 보상이 지급되었는지
    createdAt: Date.now(),
  };
}

const owned    = id => S.owned[id] || 0;
const types    = () => CARDS.filter(c => owned(c.id) > 0).length;
const tierHave = t => CARDS.filter(c => c.tier === t && owned(c.id) > 0).length;

function toast(msg, ms) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms || 2200);
}

async function persist() { try { await store.save(S.sid, S); } catch (e) { console.warn(e); } }

/* 내가 프로그램을 처음 인증하면, 나를 추천한 친구에게 카드를 지급한다 */
async function payReferrer() {
  if (!S.ref || S.refPaid) return;
  const joined = Object.keys(S.claims).some(k => k.indexOf("apply:") === 0 || k.indexOf("done:") === 0);
  if (!joined) return;
  try {
    const ok = await store.reward(S.ref, CONFIG.REWARD.referrer, S.sid);
    S.refPaid = true;
    await persist();
    if (ok) toast("추천해준 친구에게도 카드가 전달됐어요!", 3000);
  } catch (e) { /* 다음 기회에 재시도 */ }
}

/* ───────── 5. 뽑기 ───────── */
function pickTier() {
  const r = Math.random() * 100;
  if (r < TIERS.S.rate) return "S";
  if (r < TIERS.S.rate + TIERS.A.rate) return "A";
  if (r < TIERS.S.rate + TIERS.A.rate + TIERS.B.rate) return "B";
  return "C";
}
function drawOne() {
  const t = pickTier();
  // 이미 상한까지 모은 카드는 아예 나오지 않는다
  let pool = CARDS.filter(c => c.tier === t && owned(c.id) < CONFIG.CAP);
  if (!pool.length) pool = CARDS.filter(c => owned(c.id) < CONFIG.CAP);   // 해당 등급이 다 찼으면 전체에서
  if (!pool.length) return null;                                          // 전 종류가 상한 도달
  return pool[Math.floor(Math.random() * pool.length)];
}

      ${q > 1 ? `<div class="qty ${q >= CONFIG.CAP ? "full" : ""}">×${q}</div>` : ""}
    </div>`;
}

function viewRank() {
  if (!V.ranking) {
    return shell(`<div style="text-align:center;padding:40px 0"><span class="spin"></span></div>`);
  }
  const me = { name: S.name, sid: S.sid, types: types(), me: true };
  const list = V.ranking.filter(r => r.sid !== S.sid).concat([me])
    .sort((a, b) => b.types - a.types || (a.at || 0) - (b.at || 0));
  const rows = list.slice(0, 50).map((r, i) => `
    <div class="rank ${i < 3 ? "top3" : ""} ${r.me ? "me" : ""}">
      <div class="no">${i + 1}</div>
      <div class="rn">${mask(r.name)}${r.me ? " (나)" : ""}</div>
      <div class="rs"><b>${r.types}</b>종</div>
    </div>`).join("");
  return shell(`
    <div class="panel">
      <h3>순위 집계</h3>
      <p>수집한 카드 종류 수로 순위를 매기며, 같은 종수일 경우 먼저 달성한 순서로 정합니다.</p>
    </div>
    ${rows || `<p class="lead">아직 참여자가 없습니다.</p>`}`);
}
function mask(n) {
  if (!n) return "";
  if (n.length <= 2) return n[0] + "*";
  return n[0] + "*".repeat(n.length - 2) + n[n.length - 1];
}

function shrinkImage(file, maxW, quality) {
  maxW = maxW || 1000; quality = quality || 0.72;
  return new Promise((res, rej) => {
    if (!file.type || file.type.indexOf("image/") !== 0) return rej(new Error("이미지 파일만 올릴 수 있습니다."));
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const sc = Math.min(1, maxW / im.width);
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width * sc);
        cv.height = Math.round(im.height * sc);
        const cx = cv.getContext("2d");
        cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", quality));
      };
      im.onerror = () => rej(new Error("이미지를 읽지 못했습니다."));
      im.src = fr.result;
    };
    fr.onerror = () => rej(new Error("파일을 읽지 못했습니다."));
    fr.readAsDataURL(file);
  });
}

function proofLabel(key) {
  if (key === "follow") return "인스타그램 팔로우 화면";
  const parts = key.split(":");
  const p = PROGRAMS.find(x => x.id === parts[1]);
  const nm = p ? p.name : "프로그램";
  return parts[0] === "apply" ? nm + " 신청 화면" : nm + " 참여기록";
}
function proofStatus(key) {
  const pr = (S.proofs || {})[key];
  return pr ? (pr.status || "wait") : null;
}
const ST_TEXT = { wait: "검토중", ok: "승인", no: "반려" };

/* 이번 주 키 (월요일 시작) — 주 1회 퀴즈 판정용 */
function weekKey(d) {
  d = d ? new Date(d) : new Date();
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (t.getDay() + 6) % 7;          // 월=0
  t.setDate(t.getDate() - day);              // 그 주 월요일
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
}
function quizAvailable() { return S.quizWeek !== weekKey(); }
function nextMonday() {
  const d = new Date();
  const add = (8 - ((d.getDay() + 6) % 7 + 1)) % 7 || 7;
  d.setDate(d.getDate() + add);
  return (d.getMonth() + 1) + "월 " + d.getDate() + "일(월)";
}

    if (this.busy || !this.data) return;
    this.busy = true;
    const btn = document.getElementById("upSend");
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';

    const k = this.key;
    const amt = k === "follow" ? CONFIG.REWARD.follow
              : k.indexOf("apply") === 0 ? CONFIG.REWARD.apply
              : CONFIG.REWARD.done;
    try {
      const url = await store.upload(S.sid, k, this.data);
      S.proofs = S.proofs || {};
      const already = !!S.claims[k];
      S.proofs[k] = { img: url, at: Date.now(), status: "wait" };

      // 활동 완료 인증이면 만족도도 함께 저장
      const memoEl = document.getElementById("rateMemo");
      const memo = memoEl ? memoEl.value.trim() : "";
      if (k.indexOf("done:") === 0 && (this.rate || memo)) {
        const pid = k.split(":")[1];
        const pg = PROGRAMS.find(x => x.id === pid);
        S.ratings = S.ratings || {};
        S.ratings[pid] = { program: pg ? pg.name : pid, score: this.rate || null, memo: memo, at: Date.now() };
      }

      if (!already) { S.claims[k] = Date.now(); S.pending += amt; }
      await persist();
      payReferrer();
      this.close();
      toast(already ? "다시 제출했습니다" : "카드 " + amt + "장을 받았습니다. 뽑기 탭에서 열어보세요!", 2600);
      render();
    } catch (err) {
      btn.disabled = false; btn.textContent = "제출하고 카드 받기";
      this.busy = false;
      toast("제출에 실패했습니다. 잠시 후 다시 시도해 주세요.", 2600);
    }
  },

  close() {
    const m = document.getElementById("proofModal");
    if (m) m.remove();
    document.body.style.overflow = "";
    this.busy = false;
  },
};

/* ───────── 팩 오프닝 연출 ───────── */
const LV = { C: 1, B: 2, A: 3, S: 4 };

const Stage = {
  queue: [], idx: 0, el: null, busy: false,

  start(cards) {
    if (!cards || !cards.length) return;
    this.queue = cards.slice().sort((a, b) => ORDER[a.tier] - ORDER[b.tier]);
    this.idx = 0;
    this.el = document.createElement("div");
    this.el.id = "stage";
    this.el.innerHTML = `
      <div class="halo"></div><div class="beams"></div>
      <div class="rings"></div><div class="flash"></div>
      <div class="counter"></div>
      <button class="skip">건너뛰기</button>
      <div id="stageBody"></div>`;
    document.body.appendChild(this.el);
    document.body.style.overflow = "hidden";
    this.el.querySelector(".skip").onclick = e => { e.stopPropagation(); this.finish(); };
    this.el.onclick = () => this.next();
    this.show();
  },

  show() {
    const c = this.queue[this.idx];
    const t = TIERS[c.tier];
    const lv = LV[c.tier];
    const st = this.el;

    st.style.setProperty("--gc", t.color);
    st.className = "";
    st.querySelector(".rings").innerHTML = "";
    st.querySelector(".counter").textContent = (this.idx + 1) + " / " + this.queue.length;

    st.querySelector("#stageBody").innerHTML = `
      <div class="bigcard" id="bc" style="--cc:${t.color}">
        <div class="inner">
          <div class="face back"><img src="${IMG.face}" alt=""><span>LIGHTHOUSE TEAM</span></div>
          <div class="face front t-${c.tier}">
            <img src="${IMG[c.id]}" alt="${c.name}">
          </div>
        </div>
      </div>
      <div id="afterword"></div>`;

    const bc = document.getElementById("bc");
    this.busy = true;

    // 1) 배경이 서서히 밝아지며 등급을 암시
    setTimeout(() => st.classList.add("lv" + lv), 100);

    // 2) 상위 등급은 뜸을 더 들인다
    const wait = lv === 4 ? 1500 : lv === 3 ? 950 : lv === 2 ? 550 : 320;

    // 전설: 공개 직전 빛무리가 차오른다
    if (lv === 4) {
      setTimeout(() => this.motes(14), 420);
      setTimeout(() => this.ring(), 900);
      setTimeout(() => this.ring(), 1130);
    } else if (lv === 3) {
      setTimeout(() => this.motes(6), 480);
    }

    setTimeout(() => {
      // 3) 카드 공개
      if (lv === 4) bc.classList.add("turn");
      bc.classList.add("flip");

      const f = st.querySelector(".flash");
      if (lv === 4) { f.className = "flash"; void f.offsetWidth; f.classList.add("on2"); }
      else if (lv === 3) { f.className = "flash"; void f.offsetWidth; f.classList.add("on"); }

      // 4) 착지 모션 + 파티클
      const land = lv === 4 ? 900 : 480;
      setTimeout(() => {
        bc.classList.add("e" + lv);
        if (lv === 4) {
          this.ring(); this.sparks(20); this.motes(18);
          setTimeout(() => bc.classList.add("quake"), 260);
          setTimeout(() => { bc.classList.remove("quake"); bc.classList.add("float"); }, 820);
        } else if (lv === 3) {
          this.ring(); this.sparks(9);
        } else if (lv === 2) {
          this.sparks(4);
        }

        // 5) 등급 문구
        setTimeout(() => {
          const aw = document.getElementById("afterword");
          if (aw) aw.innerHTML =
            `<div class="tierword w${lv}">${t.word.split("").join(" ")}</div>` +
            (lv === 4 ? `<div class="legendmark">LEGENDARY</div>` : "");
          st.insertAdjacentHTML("beforeend",
            `<div class="tapnext">${this.idx + 1 < this.queue.length ? "화면을 누르면 다음 카드" : "화면을 누르면 결과 보기"}</div>`);
          this.busy = false;
        }, lv === 4 ? 420 : 220);
      }, land);
    }, wait);
  },

  ring() {
    const r = document.createElement("div");
    r.className = "ring";
    this.el.querySelector(".rings").appendChild(r);
    void r.offsetWidth; r.classList.add("go");
    setTimeout(() => r.remove(), 1300);
  },

  sparks(n) {
    for (let i = 0; i < n; i++) {
      const sp = document.createElement("div");
      sp.className = "spark";
      sp.textContent = Math.random() > .5 ? "✦" : "✧";
      sp.style.fontSize = (11 + Math.random() * 12) + "px";
      sp.style.left = (12 + Math.random() * 76) + "%";
      sp.style.top = (18 + Math.random() * 56) + "%";
      sp.style.animationDelay = (Math.random() * .55) + "s";
      sp.style.color = Math.random() > .35 ? "#FFF0BC" : "#FFFFFF";
      this.el.appendChild(sp);
      setTimeout(() => sp.remove(), 2200);
    }
  },

  motes(n) {
    for (let i = 0; i < n; i++) {
      const m = document.createElement("div");
      m.className = "mote";
      m.style.left = (10 + Math.random() * 80) + "%";
      m.style.top = (55 + Math.random() * 30) + "%";
      m.style.animationDelay = (Math.random() * .9) + "s";
      const sz = 3 + Math.random() * 5;
      m.style.width = m.style.height = sz + "px";
      this.el.appendChild(m);
      setTimeout(() => m.remove(), 3400);
    }
  },

  next() {
    if (this.busy) return;
    const tn = this.el.querySelector(".tapnext"); if (tn) tn.remove();
    this.idx++;
    if (this.idx >= this.queue.length) return this.finish();
    this.show();
  },

  finish() {
    if (this.el) this.el.remove();
    this.el = null; this.busy = false;
    document.body.style.overflow = "";
    render();
  },
};

/* ───────── 12. 렌더 & 이벤트 ───────── */
function render() {
  if (!S) { app.innerHTML = viewLogin(); return bindLogin(); }
  if (V.tab === "get") app.innerHTML = viewGet();
  else if (V.tab === "draw") app.innerHTML = viewDraw();
  else if (V.tab === "album") app.innerHTML = viewAlbum();
  else app.innerHTML = viewRank();
  bind();
}

function bindLogin() {
  const go = $("go");
  go.onclick = async () => {
    const sid = $("sid").value.trim();
    const nm  = $("nm").value.trim();
    if (!/^\d{6,12}$/.test(sid)) { toast("학번을 숫자로 정확히 입력해 주세요."); return; }
    if (!nm) { toast("이름을 입력해 주세요."); return; }
    if (!$("agree").checked) { toast("개인정보 수집에 동의해 주세요."); return; }
    const ref = ($("ref").value || "").trim();
    if (ref && ref === sid) { toast("자기 학번은 추천인으로 넣을 수 없습니다."); return; }

    go.disabled = true; go.innerHTML = '<span class="spin"></span>';
    let msg = "";
    try {
      const found = await store.load(sid);
      const isNew = !found;
      S = found || blank(sid, nm);
      if (found && found.name !== nm) S.name = nm;

      // 추천인은 신규 가입 때만 인정
      if (isNew && ref) {
        const chk = await store.checkRef(ref, sid);
        if (chk.ok) {
          S.ref = ref;
          S.pending += CONFIG.REWARD.invited;
          msg = `${chk.name}님의 추천으로 카드 ${CONFIG.REWARD.invited}장을 받았어요!`;
        } else {
          msg = chk.msg;
        }
      }
      await persist();
    } catch (e) {
      S = blank(sid, nm);
      toast("서버 연결에 실패해 이 기기에만 저장됩니다.", 3000);
    }
    V.tab = "get";
    render();
    if (msg) toast(msg, 3400);
  };
  [$("sid"), $("nm")].forEach(el => el.onkeydown = e => { if (e.key === "Enter") go.click(); });
}

function bind() {
  // 탭
  app.querySelectorAll("[data-tab]").forEach(el => el.onclick = () => {
    V.tab = el.dataset.tab; V.drawn = null; V.codeOpen = null; V.quizOpen = false;
    V.evMsg = null;
    render();
    if (V.tab === "rank" && !V.ranking) loadRank();
  });

  $("adminbtn") && ($("adminbtn").onclick = () => Admin.open());
  $("logout") && ($("logout").onclick = () => { S = null; V = { tab: "get", drawn: null, ranking: null }; render(); });

  // 외부 링크
  app.querySelectorAll("[data-open]").forEach(el => el.onclick = () => {
    const t = el.dataset.open;
    const url = t === "ig" ? CONFIG.INSTAGRAM : CONFIG.FORM_URL;
    if (url) window.open(url, "_blank", "noopener");
  });

  // 인증 제출
  app.querySelectorAll("[data-proof]").forEach(el => el.onclick = () => Proof.open(el.dataset.proof));

  // 퀴즈
  $("quizstart") && ($("quizstart").onclick = () => {
    if (!quizAvailable()) return;
    V.quizOpen = true; V.quizPick = null;
    V.quizIdx = S.quizDone.length % QUIZ.length;   // 매주 다음 문항
    render();
  });
  app.querySelectorAll("[data-opt]").forEach(el => el.onclick = () => {
    V.quizPick = Number(el.dataset.opt); render();
  });
  app.querySelectorAll("[data-sv]").forEach(el => el.onclick = () => {
    V.svPick = Number(el.dataset.sv);
    const box = $("svetc"); if (box) V.svEtc = box.value;
    render();
    setTimeout(() => { const b = $("svetc"); if (b && V.svEtc) b.value = V.svEtc; }, 0);
  });
  $("qdone") && ($("qdone").onclick = async () => {
    if (quizAvailable()) {
      const sv = SURVEY.length ? SURVEY[S.quizDone.length % SURVEY.length] : null;
      const etcEl = $("svetc");
      const etc = etcEl ? etcEl.value.trim() : "";
      if (sv && (V.svPick !== null || etc)) {
        S.surveys.push({
          week: weekKey(),
          q: sv.q,
          answer: V.svPick !== null ? sv.opts[V.svPick] : "",
          etc: etc,
          at: Date.now(),
        });
      }
      S.quizDone.push(V.quizIdx);
      S.quizWeek = weekKey();
      S.pending += CONFIG.REWARD.quiz;
      await persist();
    }
    V.quizOpen = false; V.quizPick = null; V.svPick = null; V.svEtc = "";
    toast(`카드 ${CONFIG.REWARD.quiz}장을 받았습니다!`);
    render();
  });

  // 내 학번 복사
  $("copysid") && ($("copysid").onclick = async () => {
    try {
      await navigator.clipboard.writeText(S.sid);
      toast("학번을 복사했어요. 친구에게 보내주세요!");
    } catch (e) {
      toast("내 학번: " + S.sid, 3000);
    }
  });

  // 이벤트 코드
  const evGo = $("evok");
  evGo && (evGo.onclick = async () => {
    const raw = ($("evcode").value || "").trim().toUpperCase();
    if (!raw) return;
    const ev = (CONFIG.EVENTS || []).find(e => String(e.code).toUpperCase() === raw);
    if (!ev) {
      V.evOk = false; V.evMsg = "올바른 이벤트 코드가 아닙니다.";
      return render();
    }
    if (ev.until && new Date(ev.until + "T23:59:59") < new Date()) {
      V.evOk = false; V.evMsg = "기간이 끝난 이벤트입니다.";
      return render();
    }
    const key = "event:" + raw;
    if (S.claims[key]) {
      V.evOk = false; V.evMsg = "이미 참여한 이벤트입니다.";
      return render();
    }
    S.claims[key] = Date.now();
    S.pending += Number(ev.cards) || 0;
    await persist();
    V.evOk = true; V.evMsg = `${ev.label} 참여 완료! 카드 ${ev.cards}장을 받았습니다.`;
    render();
  });
  $("evcode") && ($("evcode").onkeydown = e => { if (e.key === "Enter") evGo.click(); });

  // 뽑기
  const pack = $("pack");
  $("draw") && ($("draw").onclick = () => {
    if (V.busy || S.pending < 1) return;
    V.busy = true;
    $("draw").disabled = true;
    pack && pack.classList.add("shake");
    setTimeout(async () => {
      const n = Math.min(S.pending, 7);
      const got = [];
      let used = 0;
      for (let i = 0; i < n; i++) {
        const c = drawOne();
        if (!c) break;                       // 모든 카드를 상한까지 모은 경우
        const cur = owned(c.id);
        S.owned[c.id] = cur + 1;
        got.push(Object.assign({}, c, { count: cur + 1 }));
        used++;
      }
      S.pending -= used;
      if (!got.length) {
        V.busy = false;
        toast("모든 카드를 " + CONFIG.CAP + "장씩 모았습니다!", 2600);
        render();
        return;
      }
      if (types() === CARDS.length && !S.completedAt) S.completedAt = Date.now();
      V.drawn = got; V.busy = false;
      await persist();
      Stage.start(got);
    }, 520);
  });
  $("again") && ($("again").onclick = () => {
    if (S.pending > 0) { V.drawn = null; render(); setTimeout(() => { const d = $("draw"); d && d.click(); }, 60); }
    else { V.drawn = null; render(); }
  });
  $("replay") && ($("replay").onclick = () => Stage.start(V.drawn));

  // 교환
  app.querySelectorAll("[data-x]").forEach(el => el.onclick = () => {
    V.codeOpen = el.dataset.x; V.codeErr = false; render();
    setTimeout(() => $("xcode") && $("xcode").focus(), 30);
  });
  app.querySelectorAll("[data-xcancel]").forEach(el => el.onclick = () => { V.codeOpen = null; V.codeErr = false; render(); });
  app.querySelectorAll("[data-xok]").forEach(el => el.onclick = async () => {
    const v = ($("xcode").value || "").trim().toUpperCase();
    if (v === CONFIG.STAFF_CODE.toUpperCase()) {
      const ce = $("xcontact");
      if (ce && ce.value.trim()) S.contact = ce.value.trim().slice(0, 40);
      S.exchanged[el.dataset.xok] = Date.now();
      V.codeOpen = null; V.codeErr = false;
      await persist();
      toast("교환이 완료되었습니다");
    } else V.codeErr = true;
    render();
  });
  $("xcode") && ($("xcode").onkeydown = e => {
    if (e.key === "Enter") { const b = app.querySelector("[data-xok]"); b && b.click(); }
  });
}

async function loadRank() {
  try { V.ranking = await store.rank(); }
  catch (e) { V.ranking = []; }
  if (V.tab === "rank") render();
}

/* ───────── 13. 시작 ───────── */
render();
</script>
</body>
</html>
